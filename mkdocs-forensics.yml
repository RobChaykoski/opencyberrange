site_name: "SWOCTS Cyber Range - Digital Forensics"
site_description: "Memory and network forensics for SWOCTS Cyber Range"
site_url: ""
docs_dir: Workbook
site_dir: _site_forensics
copyright: 'SWOCTS Cyber Range | Powered by <a class="ocr-powered" href="https://github.com/RobChaykoski/opencyberrange">OpenCyberRange</a>'

theme:
  name: material
  # No Google Fonts request: the wiki CSP only allows self-hosted styles.
  font: false
  logo: assets/swocts-cyber-range-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid.min.js?v=1
  - javascripts/embed-mode.js?v=1
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - javascripts/html2pdf.bundle.min.js?v=1

nav:
  - Home: index.md
  - "Curriculum map": CURRICULUM.md
  - Terminology: TERMINOLOGY.md
  - Frameworks: FRAMEWORKS.md
  - "FOR01: Memory Forensics":
    - Introduction: CH_FOR01_Memory_Forensics/00_Introduction.md
    - "Windows Memory Analysis with Volatility": CH_FOR01_Memory_Forensics/01_Windows_Memory_Volatility.md
  - "FOR02: Network Forensics":
    - Introduction: CH_FOR02_Network_Forensics/00_Introduction.md
    - "VoIP Call Reconstruction": CH_FOR02_Network_Forensics/01_VoIP_Call_Reconstruction.md
  - "FOR03: Topology Forensics":
    - Introduction: CH_FOR03_Topology_Forensics/00_Introduction.md
    - "Guided Path Reconstruction": CH_FOR03_Topology_Forensics/01_Guided_Path.md
    - "Independent Path Reconstruction": CH_FOR03_Topology_Forensics/02_Independent_Path.md
  - "Free training and certifications": FREE-TRAINING-AND-CERTIFICATIONS.md
