site_name: "SWOCTS Cyber Range - OT/ICS Security"
site_description: "OT/ICS security and detection exercises for SWOCTS Cyber Range"
site_url: ""
docs_dir: Workbook
site_dir: _site_ot
copyright: 'SWOCTS Cyber Range | Powered by <a class="ocr-powered" href="https://github.com/RobChaykoski/opencyberrange">OpenCyberRange</a>'

theme:
  name: material
  # No Google Fonts request: the wiki CSP only allows self-hosted styles.
  font: false
  logo: assets/swocts-cyber-range-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid.min.js?v=1
  - javascripts/embed-mode.js?v=1
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - javascripts/html2pdf.bundle.min.js?v=1

nav:
  - Home: index.md
  - "Curriculum map": CURRICULUM.md
  - Terminology: TERMINOLOGY.md
  - Frameworks: FRAMEWORKS.md
  - "OT01: Modbus Fundamentals":
    - Introduction: CH_OT01_Modbus_Fundamentals/00_Introduction.md
    - "Exercise 1.1 -- Modbus Register Analysis": CH_OT01_Modbus_Fundamentals/01_Modbus_Register_Analysis.md
  - "OT02: S7comm and PLC Data Blocks":
    - Introduction: CH_OT02_S7comm_Data_Blocks/00_Introduction.md
    - "Exercise 2.1 -- S7comm Data Block Read": CH_OT02_S7comm_Data_Blocks/01_S7comm_Data_Block_Read.md
    - Chapter Review: CH_OT02_S7comm_Data_Blocks/02_Chapter_Review.md
  - "Free training and certifications": FREE-TRAINING-AND-CERTIFICATIONS.md
