<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">How you reach an OpenCyberRange lab</title>
  <desc id="desc">A browser reaches the OpenCyberRange platform over HTTPS. The learner then uses either a browser RangeBox desktop or a VPN-connected Kali or Ubuntu VM. Both paths join the same isolated lab network, which contains the target devices shown by the platform.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .kicker { font: 800 12px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: 1.4px; }
      .card-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .card-body { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .small { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .mono { font: 500 14px "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .badge { font: 800 11px Inter, "Segoe UI", Arial, sans-serif; fill: #1d4ed8; letter-spacing: 1px; }
      .rule { font: 600 15px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="778" rx="18" fill="none" stroke="#e2e8f0"/>

  <text x="60" y="62" class="title">How you reach a lab</text>
  <text x="60" y="94" class="subtitle">Two access paths. One isolated lab network. Only the devices shown by the platform are in scope.</text>

  <!-- Entry row -->
  <rect x="60" y="132" width="220" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="158" class="kicker">YOU</text>
  <text x="76" y="186" class="card-title">Browser</text>
  <text x="76" y="208" class="card-body">HTTPS session</text>

  <line x1="286" y1="178" x2="338" y2="178" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="312" y="164" text-anchor="middle" class="small">HTTPS</text>

  <rect x="344" y="132" width="300" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="362" y="158" class="kicker">PLATFORM</text>
  <text x="362" y="186" class="card-title">OpenCyberRange</text>
  <text x="362" y="208" class="card-body">Control plane, not a target</text>

  <!-- Split from platform to the two access paths -->
  <path d="M 494 226 L 494 258 L 310 258 L 310 286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <path d="M 494 226 L 494 258 L 890 258 L 890 286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text x="600" y="250" text-anchor="middle" class="small">choose one path</text>

  <!-- RangeBox -->
  <rect x="100" y="292" width="420" height="126" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="120" y="310" width="96" height="24" rx="12" fill="#dbeafe"/>
  <text x="168" y="327" text-anchor="middle" class="badge">RANGEBOX</text>
  <text x="120" y="360" class="card-title">Browser desktop</text>
  <text x="120" y="384" class="card-body">A Kali, Ubuntu, or REMnux desktop in your browser.</text>
  <text x="120" y="404" class="card-body">Already attached to the lab network. Nothing to install.</text>

  <text x="610" y="360" text-anchor="middle" class="card-title">or</text>

  <!-- VPN -->
  <rect x="680" y="292" width="420" height="126" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="700" y="310" width="64" height="24" rx="12" fill="#dbeafe"/>
  <text x="732" y="327" text-anchor="middle" class="badge">VPN</text>
  <text x="700" y="360" class="card-title">Your own Kali / Ubuntu VM</text>
  <text x="700" y="384" class="card-body">The WireGuard tunnel puts your VM on the lab network.</text>
  <text x="700" y="404" class="card-body">Use this when you prefer your own tools and terminal.</text>

  <!-- Merge to the lab network -->
  <path d="M 310 418 L 310 450 L 600 450 L 600 476" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <path d="M 890 418 L 890 450 L 600 450" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="600" y="442" text-anchor="middle" class="small">both paths join the same isolated network</text>

  <!-- Lab network -->
  <rect x="80" y="486" width="1040" height="190" rx="16" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="108" y="520" class="kicker">ISOLATED PER-SESSION NETWORK</text>
  <text x="108" y="550" class="card-title">Lab network</text>
  <text x="108" y="574" class="mono">10.100.x.0/24 (example)</text>

  <rect x="108" y="596" width="310" height="62" rx="10" fill="#ffffff" stroke="#bae6fd"/>
  <text x="124" y="616" class="kicker">SERVER</text>
  <text x="124" y="640" class="card-title">Target server</text>
  <text x="124" y="656" class="mono">10.100.x.10</text>

  <rect x="445" y="596" width="310" height="62" rx="10" fill="#ffffff" stroke="#bae6fd"/>
  <text x="461" y="616" class="kicker">ROUTER / FIREWALL</text>
  <text x="461" y="640" class="card-title">Network device</text>
  <text x="461" y="656" class="mono">10.100.x.1</text>

  <rect x="782" y="596" width="310" height="62" rx="10" fill="#ffffff" stroke="#bae6fd"/>
  <text x="798" y="616" class="kicker">SERVICE</text>
  <text x="798" y="640" class="card-title">App or evidence host</text>
  <text x="798" y="656" class="mono">10.100.x.20</text>

  <text x="108" y="684" class="small">The live Exercise Network panel lists the actual devices and addresses for this lab.</text>

  <!-- Bottom rule -->
  <line x1="80" y1="708" x2="1120" y2="708" stroke="#e2e8f0"/>
  <text x="80" y="736" class="rule">Run commands in RangeBox or your VPN-connected VM. Never run lab commands in the platform page.</text>
  <text x="80" y="760" class="small">Some command-only labs open a lightweight Range shell instead of RangeBox. It also runs inside the lab network.</text>
</svg>
