# SWOCTS Cyber Range version policy and Wave 0 baseline (powered by OpenCyberRange).
#
# Release 1.0.0 is the first supported self-hosted teaching release.
# "latest supported GA" means the newest stable release that is still
# supported upstream and compatible with the rest of the selected stack.
# It does not mean the newest possible release of every package.

# One platform release number; edition names are profiles. See
# docs/decisions/0004-single-platform-release-version.md.
platform:
  name: "SWOCTS Cyber Range"
  version: "4"
  status: "release"
  date: "2026-11-12"

editions:
  community_academic:
    name: "Community / Academic"
    version: "4"
    status: "profile"
    shape: "single-host"
    focus: "teaching platform, lab and workbook improvements, exercise authoring, maintenance, and security"
  professional:
    name: "Professional"
    version: "4"
    status: "release profile"
    shape: "single-host"
    focus: "analytics, reporting, cohort analysis, competency evidence, accreditation support, and research exports"
  enterprise:
    name: "Enterprise"
    version: "4"
    status: "preview profile"
    shape: "single-host or multi-host HA"
    focus: "HA, SSO/identity federation, enterprise reporting, and compliance reporting; multi-tenancy and LMS/LTI are Release 5"

maintenance_lines:
  community_academic_1_1:
    version: "1.1.3"
    status: "supported"
    note: "Existing single-host teaching installs; new installs use the Release 4 tree with the Community / Academic profile."

release:
  version: "4"
  status: "release"
  date: "2026-11-12"

development:
  version: "4"
  focus: "Release 5 planning: LTI 1.3 Advantage, multi-tenancy, per-student accommodations, and procurement artifacts"

policy:
  name: latest-supported-ga
  reviewed: "2026-11-07"
  platform_only: true
  rules:
    - no_alpha_beta_rc_or_nightly_for_platform_services
    - prefer_latest_patch_and_minor_in_a_supported_major
    - major_upgrades_require_their_own_wave
    - pin_exact_versions_and_image_digests
    - freeze_intentionally_vulnerable_lab_software
    - record_every_exception_with_an_expiry

runtime:
  host_os:
    release_1_0: "ubuntu-22.04"
    release_2_0:
      target: "ubuntu-24.04"
      upgrade_source: "ubuntu-22.04"
      status: "24.04-certified-2026-11-08"
    next_candidate:
      requested_label: "ubuntu-26.06"
      target: "ubuntu-26.04"
      status: "test-candidate"
      workflow: ".github/workflows/ubuntu-next.yml"
      docs: "docs/UBUNTU-NEXT-UPGRADE-CANDIDATE.md"
      note: "Ubuntu 26.06 is not an upstream release; the next LTS is 26.04. The GitHub runner test uses ubuntu-26.04."
    plans:
      migration: "docs/V2-UBUNTU-24.04-MIGRATION.md"
      ha: "docs/V3-HA-LAB-POOL.md"
  python:
    current: "3.11"
    target: "3.13"
    candidate: "3.14"
    status: "compatibility-testing"
  node:
    current: "22"
    target: "24"
    status: "compatibility-testing"
  postgres:
    current: "15"
    target: "17"
    status: "planned-major-upgrade"
  valkey:
    current: "9.1.3"
    status: "supported"
    licence: "BSD-3-Clause"

backend:
  fastapi: "0.162.2"
  uvicorn: "0.54.0"
  sqlalchemy: "2.1.8"
  alembic: "1.20.1"
  pydantic: "2.14.3"
  pydantic-settings: "2.16.2"
  psycopg: "3.3.8"
  pyjwt: "2.15.1"
  pwdlib: "0.3.1"
  bcrypt: "5.0.0"
  cryptography: "50.0.2"
  docker-sdk: "7.2.0"
  aiohttp: "3.14.5"
  requests: "2.34.2"
  apscheduler: "3.11.3"
  fpdf2: "2.9.0"
  matplotlib: ">=3.10"
  qrcode: "8.2"
  slowapi: "0.1.10"
  python-multipart: "0.0.33"
  email-validator: "2.3.0"
  pyyaml: "6.0.3"
  redis: "8.1.0"
  pyotp: "2.10.0"
  pywinrm: ">=0.4.3"
  ldap3: "2.9.1"
  python3-saml: "1.16.0"

frontend:
  declared:
    vue: "^3.3.4"
    vue-router: "^5.4.0"
    axios: "^1.21.0"
    chart.js: "^4.4.7"
    vue-chartjs: "^5.3.4"
    marked: "^18.1.2"
    dompurify: "^3.4.17"
    "@novnc/novnc": "^1.7.0"
    sortablejs: "^1.15.7"
    vite: "^8.3.5"
    "@vitejs/plugin-vue": "^6.0.10"
    eslint: "^10.14.0"
    "@eslint/js": "^10.0.1"
    eslint-plugin-vue: "^10.12.0"
    vue-eslint-parser: "^10.4.2"
    globals: "^17.13.0"
  locked:
    vue: "3.5.45"
    vue-router: "5.4.0"
    axios: "1.21.0"
    chart.js: "4.6.1"
    vue-chartjs: "5.3.4"
    marked: "18.1.3"
    dompurify: "3.4.17"
    "@novnc/novnc": "1.7.0"
    sortablejs: "1.15.7"
    vite: "8.3.6"
    "@vitejs/plugin-vue": "6.0.10"
    eslint: "10.14.0"
    "@eslint/js": "10.0.1"
    eslint-plugin-vue: "10.12.0"
    vue-eslint-parser: "10.4.2"
    globals: "17.14.0"

infrastructure:
  backend_base: "python:3.11-slim"
  frontend_builder: "node:22-alpine"
  frontend_server: "nginx:alpine"
  postgres_image: "postgres:15-alpine"
  valkey_image: "valkey/valkey:9.1.3-alpine"
  dex_image: "ghcr.io/dexidp/dex:v2.42.0"
  ldap_image: "osixia/openldap:1.5.0"
  topology_node_image: "ocr-lab/topology-node:latest"
  ci_checkout: "actions/checkout@v7"
  ci_codeql: "github/codeql-action@v4"
  ci_trivy: "aquasecurity/trivy-action@0.36.0"
  docs:
    mkdocs: "1.6.1"
    mkdocs-material: "9.8.0"
    pymdown-extensions: "11.0.1"

out_of_scope:
  - "platform/labs/**"
  - "RangeBox/**"
  - "UbuntuBox/**"
  - "RemnuxBox/**"
