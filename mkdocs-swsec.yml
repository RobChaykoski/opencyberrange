site_name: "Software Security"
site_description: "Software security foundations and safe exploit development for OpenCyberRange"
site_url: ""
docs_dir: Workbook
site_dir: _site_swsec

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js

nav:
  - Home: index.md
  - "CH SWSEC — Software Security":
    - Introduction: CH_SWSEC_Software_Security/00_Introduction.md
    - "Hidden Export Route": CH_SWSEC_Software_Security/01_Hidden_Export_Route.md
    - "Diagnostics Command Injection": CH_SWSEC_Software_Security/02_Diagnostics_Command_Injection.md
    - Chapter Review: CH_SWSEC_Software_Security/03_Chapter_Review.md
