site_name: "SWOCTS Cyber Range - Software Security"
site_description: "Software security foundations and safe exploit development for SWOCTS Cyber Range"
site_url: ""
docs_dir: Workbook
site_dir: _site_swsec
copyright: 'SWOCTS Cyber Range | Powered by <a class="ocr-powered" href="https://github.com/RobChaykoski/opencyberrange">OpenCyberRange</a>'

theme:
  name: material
  logo: assets/swocts-cyber-range-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/embed-mode.js?v=1
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - javascripts/html2pdf.bundle.min.js?v=1

nav:
  - Home: index.md
  - "Curriculum map": CURRICULUM.md
  - Terminology: TERMINOLOGY.md
  - Frameworks: FRAMEWORKS.md
  - "SWSEC01: Software Security Foundations":
    - Introduction: CH_SWSEC_Software_Security/00_Introduction.md
    - "Hidden Export Route": CH_SWSEC_Software_Security/01_Hidden_Export_Route.md
    - "Diagnostics Command Injection": CH_SWSEC_Software_Security/02_Diagnostics_Command_Injection.md
    - Chapter Review: CH_SWSEC_Software_Security/03_Chapter_Review.md
  - "Free training and certifications": FREE-TRAINING-AND-CERTIFICATIONS.md
