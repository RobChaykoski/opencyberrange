schema_version: 1
review_anchor: '2026-11-26'
groups:
- id: governance
  title: Governance, risk and assurance
  purpose: Policy, control mapping, risk, privacy, retention, procurement, audit, and review records.
  csf:
  - GV.OC
  - GV.RM
  - GV.RR
  - GV.PO
  - GV.OV
  nist:
  - PM-1
  - PM-4
  - PM-9
  - CA-2
  - CA-5
  - CA-7
  - RA-3
  - SI-12
  owner: Platform lead with the privacy officer
- id: architecture
  title: Architecture, design and decisions
  purpose: System and data architecture, interfaces, schemas, and architecture decision records.
  csf:
  - ID.AM
  - PR.PS
  - PR.DS
  nist:
  - CM-2
  - CM-3
  - CM-4
  - SA-5
  - SA-8
  - SA-11
  - SI-12
  owner: Architecture lead
- id: operations
  title: Operations and service management
  purpose: Deployment, runbooks, backup and restore, availability, monitoring, database integrity, migrations,
    and upgrade paths.
  csf:
  - PR.PS
  - PR.IR
  - RC.RP
  nist:
  - CM-6
  - CP-10
  - IR-4
  - SI-2
  - SI-4
  - AU-2
  - AU-6
  owner: Platform operator
- id: security
  title: Security engineering and assurance
  purpose: Authentication, authorization, tenancy, consent enforcement, threat and vulnerability work,
    scanning, and security evidence.
  csf:
  - PR.AA
  - PR.DS
  - DE.CM
  - RS.AN
  nist:
  - AC-3
  - AC-6
  - AU-2
  - CA-7
  - RA-5
  - SC-7
  - SI-4
  - IR-4
  owner: Security lead
- id: curriculum
  title: Curriculum, learning and assessment
  purpose: Learning design, tracks and pathways, labs, competencies, assessment, analytics, transcripts,
    achievements, and instructor practice.
  csf:
  - PR.AT
  - ID.AM
  nist:
  - AT-2
  - PM-5
  - SA-11
  owner: Curriculum lead
- id: integrations
  title: Integrations and ecosystem
  purpose: SSO and identity providers, LMS/LTI, OpenGRC and the wider ecosystem, reporting boundaries,
    and evidence exchange.
  csf:
  - GV.SC
  - ID.IM
  nist:
  - SA-9
  - SR-3
  - PM-5
  owner: Integration lead
- id: product
  title: Product, releases and change
  purpose: Scope, releases, deliverables, editions, roadmaps, counts, handoffs, and the published project
    overview.
  csf:
  - GV.RR
  - GV.OV
  nist:
  - CM-3
  - SA-10
  - SI-12
  owner: Product lead
- id: research
  title: Research, pilots and community
  purpose: Pilots, research notes, community events, UI and experience studies, and proposals that are
    not yet product commitments.
  csf:
  - GV.OV
  - ID.IM
  nist:
  - PM-4
  - PM-9
  owner: Research lead
- id: archive
  title: Archive
  purpose: Superseded plans, completed migrations, and historical records kept for provenance. Not current
    operating guidance.
  csf:
  - GV.OV
  nist:
  - SI-12
  - MP-6
  owner: Records custodian
- id: documentation
  title: Documentation system
  purpose: The documentation standard, review form, grouping register, and generated group indexes.
  csf:
  - GV.PO
  - GV.OV
  nist:
  - PM-1
  - CM-2
  - SI-12
  owner: Documentation steward
