name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit (baseline, non-blocking)
    runs-on: ubuntu-latest
    # Wave 0 records the findings. Flip to blocking after the relevant
    # dependency wave has removed the known exceptions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/backend/requirements*.txt

      - name: Python audit
        working-directory: platform/backend
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Dependency currency report
        continue-on-error: true
        run: |
          python -m pip install pyyaml
          python scripts/check-dependency-currency.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: npm audit
        working-directory: platform/frontend
        run: |
          npm ci
          npm audit --omit=dev
