name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "19 3 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the SARIF result to code scanning.
      security-events: write
      # Needed by publish_results to sign the result with the GitHub OIDC token.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a public repository. Private mirrors still get
          # the SARIF artifact for local review.
          publish_results: ${{ github.event.repository.private == false }}

      - name: Upload Scorecard SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload Scorecard findings to code scanning
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecard
