name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "19 3 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the SARIF result to code scanning.
      security-events: write
      # Needed by publish_results to sign the result with the GitHub OIDC token.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires a public repository. Private mirrors still get
          # the SARIF artifact for local review.
          publish_results: ${{ github.event.repository.private == false }}

      - name: Upload Scorecard SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload Scorecard findings to code scanning
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: results.sarif
          category: scorecard
