name: Image vulnerability scan

on:
  schedule:
    # Weekly, after the Monday dependency audit.
    - cron: "23 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platform/backend/Dockerfile"
      - "platform/backend/requirements.txt"
      - "platform/backend/requirements-dev.txt"
      - "platform/frontend/Dockerfile"
      - "platform/frontend/package-lock.json"
      - ".github/workflows/image-scan.yml"

permissions:
  contents: read
  security-events: write

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: platform/backend
          - name: frontend
            context: platform/frontend
    env:
      IMAGE: ocr-scan-${{ matrix.name }}:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        run: docker build -t "$IMAGE" "${{ matrix.context }}"

      - name: Install pinned Syft and Grype
        env:
          SYFT_VERSION: 1.57.1
          SYFT_SHA256: bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c
          GRYPE_VERSION: 0.121.3
          GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85
        run: |
          set -euo pipefail
          curl -fsSL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          curl -fsSL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          sudo tar -xzf syft.tar.gz -C /usr/local/bin syft
          sudo tar -xzf grype.tar.gz -C /usr/local/bin grype
          syft version
          grype version

      - name: Generate SBOM
        run: syft scan "docker:$IMAGE" -o cyclonedx-json="sbom-${{ matrix.name }}.json"

      - name: Scan for fixable critical vulnerabilities
        id: grype
        continue-on-error: true
        run: |
          grype "docker:$IMAGE" \
            --only-fixed \
            --fail-on critical \
            -o sarif="grype-${{ matrix.name }}.sarif"

      - name: Upload SBOM and SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-scan-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}.json
            grype-${{ matrix.name }}.sarif
          if-no-files-found: warn

      - name: Upload findings to code scanning
        # Code scanning needs GitHub Advanced Security on private repositories.
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: grype-${{ matrix.name }}.sarif
          category: grype-${{ matrix.name }}

      - name: Fail on a fixable critical
        if: steps.grype.outcome == 'failure'
        run: |
          echo "Grype found at least one fixable critical vulnerability in the ${{ matrix.name }} image." >&2
          echo "Review the artifact and rebuild or pin the affected package." >&2
          exit 1
