name: Lab harness

on:
  workflow_dispatch:
    inputs:
      labs:
        description: Optional space-separated lab slugs; empty runs every lab
        required: false
        default: ""
      runs:
        description: Clean runs per lab
        required: false
        default: "3"
  schedule:
    # Weekly release-gate run. Requires the self-hosted lab runner labels.
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: lab-harness
  cancel-in-progress: false

jobs:
  harness:
    name: build, start, solve, reset
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install manifest tooling
        run: python -m pip install --upgrade pip pyyaml==6.0.3

      - name: Verify generated manifests are current
        run: python scripts/generate-lab-manifests.py --check

      - name: Validate every lab contract
        run: python scripts/lab_harness.py --validate-all

      - name: Run the lab harness
        env:
          LABS: ${{ inputs.labs }}
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          set -euo pipefail
          args=(--runs "$RUNS" --rebuild --json lab-harness.json)
          if [ -n "$LABS" ]; then
            for slug in $LABS; do
              args+=(--lab "$slug")
            done
          else
            args+=(--all)
          fi
          python scripts/lab_harness.py "${args[@]}"

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-harness-evidence
          path: lab-harness.json
          if-no-files-found: ignore
          retention-days: 90
