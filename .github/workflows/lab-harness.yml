name: Lab harness

on:
  workflow_dispatch:
    inputs:
      labs:
        description: Optional space-separated lab slugs; empty uses the canary/full mode
        required: false
        default: ""
      runs:
        description: Clean runs per lab
        required: false
        default: "1"
      mode:
        description: Canary slice (about 20%) or the full fleet
        required: true
        type: choice
        options:
          - canary
          - full
        default: canary
  schedule:
    # Weekly canary. The five-bucket selector covers the whole fleet every five
    # weeks. A full run is a manual workflow_dispatch with mode=full and runs=3.
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: lab-harness
  cancel-in-progress: false

jobs:
  harness:
    name: build, start, solve, reset
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install manifest tooling
        run: python -m pip install --upgrade pip pyyaml==6.0.3

      - name: Verify generated manifests are current
        run: python scripts/generate-lab-manifests.py --check

      - name: Validate every lab contract
        run: python scripts/lab_harness.py --validate-all

      - name: Select the weekly canary
        id: canary
        env:
          MODE: ${{ inputs.mode || 'canary' }}
          LABS: ${{ inputs.labs }}
        run: |
          set -euo pipefail
          if [ -n "$LABS" ]; then
            printf 'selected=%s\n' "$LABS" >> "$GITHUB_OUTPUT"
            printf 'mode=manual\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MODE" = "full" ]; then
            printf 'selected=\n' >> "$GITHUB_OUTPUT"
            printf 'mode=full\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selected=$(python scripts/select-lab-canary.py --space)
          if [ -z "$selected" ]; then
            echo "Canary selection is empty" >&2
            exit 1
          fi
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
          printf 'mode=canary\n' >> "$GITHUB_OUTPUT"
          echo "Selected $(echo "$selected" | wc -w) labs for the weekly canary."

      - name: Run the lab harness
        env:
          LABS: ${{ steps.canary.outputs.selected }}
          MODE: ${{ steps.canary.outputs.mode }}
          RUNS: ${{ inputs.runs || '1' }}
        run: |
          set -euo pipefail
          args=(--runs "$RUNS" --rebuild --json lab-harness.json)
          if [ -n "$LABS" ]; then
            for slug in $LABS; do
              args+=(--lab "$slug")
            done
          elif [ "$MODE" = "full" ]; then
            args+=(--all)
          else
            echo "No labs selected" >&2
            exit 1
          fi
          python scripts/lab_harness.py "${args[@]}"

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-harness-evidence
          path: lab-harness.json
          if-no-files-found: ignore
          retention-days: 90
