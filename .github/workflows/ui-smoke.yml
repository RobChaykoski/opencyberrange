name: UI smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # noVNC and the SPA are exercised in all three engines. The script also
        # opens desktop and mobile viewports inside each engine.
        browser: [chromium, firefox, webkit]
    env:
      UI_BROWSER: ${{ matrix.browser }}
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      UI_SMOKE_TOKEN: ${{ secrets.UI_SMOKE_TOKEN }}
      UI_SMOKE_USERNAME: ${{ secrets.UI_SMOKE_USERNAME }}
      UI_SMOKE_PASSWORD: ${{ secrets.UI_SMOKE_PASSWORD }}
      UI_PRIVACY_USERNAME: ${{ secrets.UI_PRIVACY_USERNAME }}
      UI_PRIVACY_PASSWORD: ${{ secrets.UI_PRIVACY_PASSWORD }}
      UI_EXPECTED_VERSION: ${{ vars.UI_EXPECTED_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Run deployment smoke checks
        run: |
          if [ -z "$UI_BASE_URL" ]; then
            echo "UI smoke skipped: set the UI_BASE_URL repository variable."
            exit 0
          fi
          if [ -z "$UI_SMOKE_TOKEN" ] && { [ -z "$UI_SMOKE_USERNAME" ] || [ -z "$UI_SMOKE_PASSWORD" ]; }; then
            echo "UI smoke skipped: set UI_SMOKE_TOKEN or UI_SMOKE_USERNAME / UI_SMOKE_PASSWORD."
            exit 0
          fi
          npm install --no-save playwright
          npx playwright install --with-deps "$UI_BROWSER"
          node scripts/ui-smoke.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-smoke-evidence-${{ matrix.browser }}
          path: ui-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 30
