name: UI smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      UI_SMOKE_TOKEN: ${{ secrets.UI_SMOKE_TOKEN }}
      UI_SMOKE_USERNAME: ${{ secrets.UI_SMOKE_USERNAME }}
      UI_SMOKE_PASSWORD: ${{ secrets.UI_SMOKE_PASSWORD }}
      UI_EXPECTED_VERSION: ${{ vars.UI_EXPECTED_VERSION }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run deployment smoke checks
        run: |
          if [ -z "$UI_BASE_URL" ]; then
            echo "UI smoke skipped: set the UI_BASE_URL repository variable."
            exit 0
          fi
          if [ -z "$UI_SMOKE_TOKEN" ] && { [ -z "$UI_SMOKE_USERNAME" ] || [ -z "$UI_SMOKE_PASSWORD" ]; }; then
            echo "UI smoke skipped: set UI_SMOKE_TOKEN or UI_SMOKE_USERNAME / UI_SMOKE_PASSWORD."
            exit 0
          fi
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/ui-smoke.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-evidence
          path: ui-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 30
