name: Publish documentation

# Build the user manual and package it with checksums. The manual is the only
# site published by default: workbook and course sites are authenticated in the
# live platform and must not be mirrored to a static host.
#
# Hosting decision: artifacts are the publish target. An internal web root can
# consume the tarball; see docs/MANUAL-PUBLISHING.md. Nothing is pushed to
# GitHub Pages, because Pages cannot enforce the workbook auth model.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "manual (default) or all sites for inspection"
        required: true
        default: manual
        type: choice
        options:
          - manual
          - all
      retention_days:
        description: "Artifact retention in days"
        required: true
        default: "90"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install the pinned documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install \
            pyyaml==6.0.3 \
            mkdocs==1.6.1 \
            mkdocs-material==9.8.0 \
            pymdown-extensions==13.0

      - name: Source checks
        run: |
          python scripts/check-doc-assets.py
          python scripts/check-links.py Manual-Lite docs Workbook --mkdocs

      - name: Build sites
        id: build
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'manual' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sites"
          rm -rf "$out"
          if [ "$SCOPE" = "manual" ]; then
            mkdir -p "$out/reference/manual"
            mkdocs build -f mkdocs-manual-lite.yml -d "$out/reference/manual"
          else
            for config in mkdocs-*.yml; do
              name="${config%.yml}"
              mkdir -p "$out/$name"
              mkdocs build -f "$config" -d "$out/$name"
            done
          fi

      - name: Check built output
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'manual' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sites"
          if [ "$SCOPE" = "manual" ]; then
            python scripts/check-built-docs.py --root "$out" --require reference/manual
          else
            python scripts/check-built-docs.py --root "$out" --skip-root-absolute
          fi

      - name: Package with checksums
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'manual' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sites"
          package="$RUNNER_TEMP/docs-${SCOPE}-${GITHUB_SHA}.tar.gz"
          tar -czf "$package" -C "$out" .
          (
            cd "$out"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$RUNNER_TEMP/SHA256SUMS"
          python - "$out" "$SCOPE" "$package" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          out, scope, package = sys.argv[1:4]
          files = [path for path in Path(out).rglob("*") if path.is_file()]
          manifest = {
              "scope": scope,
              "commit": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "mkdocs": "1.6.1",
              "mkdocs_material": "9.8.0",
              "pymdown_extensions": "13.0",
              "sites": sorted(
                  {
                      str(path.parent.relative_to(out)).replace(os.sep, "/")
                      for path in files
                      if path.name == "index.html"
                      and (path.parent / "search" / "search_index.json").is_file()
                  }
              ),
              "files": len(files),
              "bytes": sum(path.stat().st_size for path in files),
              "sha256": hashlib.sha256(Path(package).read_bytes()).hexdigest(),
          }
          Path(os.environ["RUNNER_TEMP"], "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'manual' }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/docs-*.tar.gz
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/manifest.json
          retention-days: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_days || 90 }}
          if-no-files-found: error
