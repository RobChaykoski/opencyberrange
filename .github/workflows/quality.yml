name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly external-link sweep; internal checks still run on every PR.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labs-and-docs:
    name: labs, links, and docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install documentation tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            pyyaml==6.0.3 \
            mkdocs==1.6.1 \
            mkdocs-material==9.8.0 \
            pymdown-extensions==11.0.1

      - name: Verify supply-chain lock
        run: |
          python scripts/supply_chain.py --check \
            --signature supply-chain.lock.json.asc \
            --gpg-public-key docs/release-signing-key.asc \
            --gpg-fingerprint 68A817762C831475F00DB54E775050A4C4921814

      - name: Verify RBAC/PBAC matrix is current
        run: python scripts/generate-rbac-matrix.py --check

      - name: Verify competency contracts are current
        run: python scripts/generate-competency-contracts.py --check

      - name: Verify competency review queue is current
        run: python scripts/generate-competency-review-queue.py --check

      - name: Validate competency contract structure
        run: python scripts/validate-competency-contracts.py

      - name: Audit Release 6 object coverage
        run: python scripts/audit-release6-coverage.py --fail-on-gaps

      - name: Guard the Alembic revision graph
        run: python scripts/check-alembic-safety.py

      - name: Smoke-check the host-agent spike
        run: python scripts/check-labd-agent.py

      - name: Validate rubric registry
        run: python scripts/validate-rubrics.py

      - name: Verify lab test manifests are current
        run: python scripts/generate-lab-manifests.py --check

      - name: Validate lab test contracts
        run: python scripts/lab_harness.py --validate-all

      - name: Lab freshness gate
        run: python scripts/check-lab-freshness.py

      - name: Audit publication metadata and answer keys
        run: python scripts/audit-publication.py --summary

      - name: Audit flag exposure
        run: python scripts/audit_flag_exposure.py --fail-on-leaks

      - name: Verify runtime integrity manifest is current
        run: |
          python scripts/generate-integrity-manifest.py
          git diff --exit-code -- platform/backend/app/data/software-integrity.json

      - name: Check licence compliance
        run: python scripts/check-licences.py

      - name: Audit Windows media and activation material
        run: python scripts/check-windows-artifacts.py

      - name: Verify reviewed URL bindings use safeHttpUrl
        run: python scripts/check-safe-links.py

      - name: ShellCheck install and upgrade scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/*.sh

      - name: Verify the inline-script CSP hash
        run: python scripts/check-csp-hash.py

      - name: Reject external images in learner content
        run: python scripts/check-external-images.py

      - name: Report unpinned base images
        continue-on-error: true
        run: python scripts/supply_chain.py --check-pins

      - name: Validate every lab
        run: python scripts/validate-lab.py --all

      - name: Validate workbook accuracy and path plans
        run: python scripts/lab_qa.py --static

      - name: Lint lab manifests, workbooks, and compose files
        run: python scripts/lint_labs.py --check

      - name: Verify the documentation map and group pages
        run: python scripts/documentation_map.py --check

      - name: Check internal links and MkDocs nav
        run: python scripts/check-links.py --mkdocs

      - name: Build every documentation site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          set -euo pipefail
          for config in mkdocs-*.yml; do
            name="${config%.yml}"
            echo "::group::mkdocs build $config"
            mkdocs build -f "$config" -d "$RUNNER_TEMP/site/$name"
            echo "::endgroup::"
          done

  external-links:
    name: external links (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install link checker
        run: pip install pyyaml==6.0.3

      - name: Probe external links
        run: python scripts/check-links.py --external --mkdocs --timeout 15
