# Local-only preview of the staging Moodle on https://localhost:9444.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Caddy uses its internal CA, so the browser will warn until you trust it. This
# file must only be used on a workstation, never on the staging or production
# host.

services:
  moodle:
    environment:
      MOODLE_SITE_URL: https://localhost:9444

  caddy:
    environment:
      MOODLE_TLS_HOST: localhost
      ACME_EMAIL: admin@example.invalid
    ports: !override
      - "127.0.0.1:9080:80"
      - "127.0.0.1:9444:443"
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
