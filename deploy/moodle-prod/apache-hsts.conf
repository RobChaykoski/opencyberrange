# HSTS for the public Moodle host.
#
# NPM terminates TLS and passes origin response headers through, so setting
# HSTS here covers the public host without needing the NPM admin UI. Keep the
# directive conditional on the headers module so a stripped image still boots.
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>
