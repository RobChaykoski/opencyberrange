# Dev-only LTI embed headers for the Docker Desktop showcase.
#
# Moodle frames the Deep Linking picker and the launch callback through
# host.docker.internal over HTTP. The standard frontend snippet allows loopback
# HTTP for local LMS testing; this variant adds the Docker host alias.
#
# Apply only to a disposable local frontend container:
#   docker cp deploy/ecosystem-test/lti-embed-headers.host-docker.conf \
#     ocr-r5-frontend:/etc/nginx/snippets/lti-embed-headers.conf
#   docker exec ocr-r5-frontend nginx -s reload
#
# A production deployment uses HTTPS hostnames and must keep the standard
# platform/frontend/lti-embed-headers.conf.

add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self)" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gcDMZ3reqFDcIeJU3IEsVra//K/ibAKdfKgN6qChfv4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors https: http://localhost:* http://127.0.0.1:* http://host.docker.internal:*; base-uri 'self'; form-action 'self' https: http://localhost:* http://127.0.0.1:* http://host.docker.internal:*;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
