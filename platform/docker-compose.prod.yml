services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --workers
    - '1'
    container_name: ocr-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_SECRET: ${JWT_SECRET}
      LABS_HOST_PATH: ${LABS_HOST_PATH}
      WG_API_KEY: ${WG_API_KEY}
      WG_API_URL: ${WG_API_URL}
      WG_CLIENT_BASE: ${WG_CLIENT_BASE:-10.0.0}
      WG_ENCRYPTION_KEY: ${WG_ENCRYPTION_KEY}
      WG_NETWORK_BASE: ${WG_NETWORK_BASE:-10.100}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT}
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY}
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 127.0.0.1:8000:8000
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${LABS_HOST_PATH}:/labs
    - ./templates:/app/templates:ro
  db:
    container_name: ocr-db
    entrypoint:
    - /usr/local/bin/ensure-db-password.sh
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck: {}
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./db/ensure-db-password.sh:/usr/local/bin/ensure-db-password.sh:ro
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    depends_on:
    - backend
    image: ocr-frontend:latest
    ports:
    - 80:80
    - 443:443
    restart: unless-stopped
    volumes:
    - ./certs:/etc/nginx/certs:ro
version: '3.8'
volumes:
  postgres_data: null
