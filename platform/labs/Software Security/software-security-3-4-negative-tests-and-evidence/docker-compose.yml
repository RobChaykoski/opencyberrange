services:
  api:
    mem_limit: 96m
    cpus: 0.15
    build:
      context: ../../_karate_shared
      dockerfile: Dockerfile
    hostname: api
    labels:
      ip_offset: "95"
    environment:
      LAB_MODE: "negative"
      FLAG: "OCR{k4r4t3_n3g4t1v3_r3v34ls_b0l4}"
      COMPANY: "Northwind Training API"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
