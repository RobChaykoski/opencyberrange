title: "Authenticate Once, Reuse Everywhere"
category: authentication
difficulty: intermediate
estimated_time: 40
prerequisites:
  - software-security-3-2-assertions-and-examples
# By completion students will be able to:
learning_outcomes:
  - Send a JSON login request from a Karate feature
  - Extract a token from the response and send it as a Bearer header
  - Reuse one login across scenarios with callSingle or a reusable call feature
  - Prove that the protected endpoint rejects a missing or invalid token
mapped_skills:
  - identity_access
  - web_api
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
  - Submit the feature file with one login feature and one reusable token call.
  - Explain why logging in for every scenario is slower and harder to audit.
learning_concepts:
  - "authentication"
  - "session management"
  - "identity assurance"
  - "authenticate once, reuse everywhere"
  - "send a json login request from a"
competency_tags:
  - "identity.security_authentication_and_reuse"
  - "identity.and_reuse"
  - "identity.access"
  - "web.api"
  - "identity.fundamentals"
defensive_skills:
  - "treat_tokens_as_credentials_keep_them_out_of_logs"
  - "scope_them_to_the_task"
  - "expire_them"
  - "test_both_the_positive_path"
  - "the_missing_token_path"
evidence_required:
  - "flag"
  - "request_and_response"
  - "configuration_review"
  - "interpretation"
