services:
  api:
    mem_limit: 96m
    cpus: 0.15
    build:
      context: ../../_karate_shared
      dockerfile: Dockerfile
    hostname: api
    labels:
      ip_offset: "92"
    environment:
      LAB_MODE: "first_test"
      FLAG: "OCR{k4r4t3_f1rst_f34tur3_p4ss3d}"
      COMPANY: "Northwind Training API"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
