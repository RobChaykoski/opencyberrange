services:
  intake:
    mem_limit: 192m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: trailguard
    labels:
      ip_offset: "73"
    environment:
      LAB_MODE: "agent_hijack"
      FLAG: "OCR{tr41ll1n3_4ud1t_3xf1l}"
      BOT_NAME: "TrailGuard AI"
      COMPANY: "Trailline Security & GRC"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
