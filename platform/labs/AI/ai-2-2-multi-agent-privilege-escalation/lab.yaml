title: "Shadow Deputy: Multi-Agent Privilege Escalation Capstone"
category: ai
difficulty: expert
estimated_time: 90
prerequisites:
  - ai-2-1-agent-hijacking
  - identity-1-3-nhi-oauth-abuse
# By completion students will be able to:
learning_outcomes:
  - Enumerate a public agent API and recover a leaked non-human identity credential
  - Trace the agent-to-agent trust boundary and explain the confused-deputy failure
  - Exploit an indirect tool directive that makes a privileged agent read the audit vault
  - Reconstruct the decision chain from agent telemetry and identify missing provenance
  - Recommend workload identity, mTLS, scoped OAuth, and policy-as-code controls
mapped_skills:
  - ai_security
  - identity_access
  - incident_forensics
assessment_criteria:
  - Submit the final flag from the Meridian Capital audit record.
  - Pass every automated test step in the lab manifest.
  - Record the leaked identity, the trust gap, the decision chain, and the control change in the capstone evidence table.
  - Explain why the stage 1 marker is evidence rather than the graded flag.
learning_concepts:
  - "AI security"
  - "prompt and tool trust"
  - "agent boundaries"
  - "shadow deputy: multi-agent privilege escalation capstone"
  - "enumerate a public agent api and recover"
