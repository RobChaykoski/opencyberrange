certification:
  name: "OpenCyberRange track benchmark"
  code: ""
  url: ""
  scope: "General AI-security benchmark for this track. Not a certification exam item."

questions:
  - id: "ai-track-1"
    prompt: "What is prompt injection?"
    options: [
      "Manipulating a model's instructions or context through crafted input.",
      "Injecting SQL into a database.",
      "Installing a rootkit.",
      "Capturing packets."
    ]
    correct: 0
    explanation: "Prompt injection tries to make the model follow attacker-controlled instructions instead of the application's intended instructions."
    reference:
      label: "OWASP LLM01: Prompt Injection"
      url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"

  - id: "ai-track-2"
    prompt: "Why should model output be treated as untrusted input?"
    options: [
      "It can be manipulated and may contain unsafe instructions or data.",
      "It is always encrypted.",
      "It can never contain text.",
      "It is generated by a firewall."
    ]
    correct: 0
    explanation: "Model output can be influenced by the prompt and retrieved content. Validate it and constrain any downstream action."
    reference:
      label: "OWASP LLM05: Improper Output Handling"
      url: "https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/"

  - id: "ai-track-3"
    prompt: "What is excessive agency?"
    options: [
      "Giving a model more permissions or tool access than the task requires.",
      "Giving a model a short prompt.",
      "Running a model offline.",
      "Using a small context window."
    ]
    correct: 0
    explanation: "Excessive agency increases impact when a model is manipulated. Use least privilege, scoped tools, and human confirmation for high-impact actions."
    reference:
      label: "OWASP LLM06: Excessive Agency"
      url: "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/"

  - id: "ai-track-4"
    prompt: "What is indirect prompt injection?"
    options: [
      "Malicious instructions hidden in content the model retrieves or processes.",
      "A user typing a direct prompt.",
      "A network scan.",
      "A password brute-force attack."
    ]
    correct: 0
    explanation: "Indirect injection hides instructions in documents, web pages, emails, or tool results that the model treats as context."
    reference:
      label: "OWASP LLM01: Prompt Injection"
      url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"

  - id: "ai-track-5"
    prompt: "Which is the safest place to test an AI application for prompt injection?"
    options: [
      "An isolated lab with mock targets and no production secrets.",
      "A live production API.",
      "A public customer portal.",
      "A real email inbox."
    ]
    correct: 0
    explanation: "Test in an isolated environment with simulated data. Never probe systems without explicit authorisation."
    reference:
      label: "OWASP LLM Top 10"
      url: "https://genai.owasp.org/llm-top-10/"
