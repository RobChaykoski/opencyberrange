title: Topology Forensics - Guided Path Reconstruction
category: forensics
difficulty: beginner
estimated_time: 25
prerequisites:
  - forensics-2-1-voip-call-reconstruction
# By completion students will be able to:
learning_outcomes:
  - Read a three-node topology from the node status endpoint
  - Distinguish a management address from a link address
  - Follow a host default route to a service through one router
  - Record the link, peer, and subnet that carried the evidence request
  - Explain why the path record matters to a forensic finding
mapped_skills:
  - incident_forensics
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Discovery
    technique: T1016
    technique_name: System Network Configuration Discovery
    detection: Alert on topology and route discovery from an investigation workstation.

owner: "OpenCyberRange Curriculum"
content_version: "4.0"
reviewed_at: "2026-11-12"
review_status: "engine unit tests and live dev smoke; learner walkthrough pending"
description: "A guided forensic reconstruction: follow a workstation-to-service request through one router, record the link evidence, and recover the case token."
scenario: |
  A workstation contacted a protected case service through a router. Your task
  is to reconstruct the path in the order a forensic analyst would: identify the
  devices, read the host route, confirm the router forwarded the traffic, then
  follow the link address to the service. This is the guided version: every step
  includes the command to run.
credentials:
  - role: "analyst"
    username: "analyst"
    # Demo lab credential; security-delta: allow credential-like assignment
    password: "Topology2026"
    description: "SSH access to each topology node"
hints:
  - text: |
      Start with `curl http://<router-management-ip>:8080/status`. The status
      document lists each peer, the local link address, the peer address, and
      the /29 subnet.
  - text: |
      On the workstation, `ip route` should show a default route via the router's
      link address. That is the first hop.
  - text: |
      On the router, `cat /proc/sys/net/ipv4/ip_forward` should return `1`.
      `ip route` shows the connected link to the case service.
  - text: |
      Use the case service's **link** address, not its management address, for
      the final request. The link address is the evidence that traffic crossed
      the router.
flag: "OCR{f0r3ns1c_p4th_gu1d3d}"

visibility: public
week: 2
troubleshooting: "If the status endpoint is unreachable, confirm the lab is running and use the management IP shown in the exercise. If the flag request fails, verify you are using the service link address from the router status."
defensive_takeaways: "A path record should name each hop, interface, peer, and subnet. That record lets another analyst reproduce the finding without guessing."
difficulty_evidence: "Engine unit tests and live dev smoke; learner walkthrough pending."
difficulty_evidence_source: "automated_and_manual_smoke"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-12"
workbook: "wiki/range/forensics/CH_FOR03_Topology_Forensics/01_Guided_Path/"

topology:
  nodes:
    - id: "workstation"
      label: "Investigation Workstation"
      type: "workstation"
      ip_offset: "21"
      ports: [22, 8080]
      services: ["OpenSSH", "Status"]
      x: 1
      y: 2
    - id: "router"
      label: "Case Router"
      type: "router"
      ip_offset: "22"
      ports: [22, 8080]
      services: ["OpenSSH", "IPv4 forwarding"]
      x: 2
      y: 2
    - id: "case-svc"
      label: "Protected Case Service"
      type: "server"
      ip_offset: "23"
      ports: [22, 80, 8080]
      services: ["OpenSSH", "HTTP case token"]
      x: 3
      y: 2
  edges:
    - from: "workstation"
      to: "router"
      label: "workstation link /29"
      access: "direct"
    - from: "router"
      to: "case-svc"
      label: "case link /29"
      access: "routed"

test:
  steps:
    - name: "SSH to the investigation workstation"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.workstation} 'echo connected' 2>&1"
      expect: "connected"
      timeout: 20

    - name: "Router reports its role"
      command: "curl -s --connect-timeout 5 http://{target.router}:8080/status"
      expect: '"role": "router"'
      timeout: 15

    - name: "Workstation uses the router"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.workstation} 'ip route | grep default' 2>&1"
      expect: "default via"
      timeout: 20

    - name: "Router forwards IPv4"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.router} 'cat /proc/sys/net/ipv4/ip_forward' 2>&1"
      expect: "1"
      timeout: 20

    - name: "Recover the case token through the routed path"
      command: "IP=$(curl -s --connect-timeout 5 http://{target.router}:8080/status | jq -r '.links[] | select(.peer==\"case-svc\") | .peer_ip'); sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.workstation} \"wget -qO- http://$IP/flag\" 2>&1"
      expect: "OCR{f0r3ns1c_p4th_gu1d3d}"
      timeout: 30
