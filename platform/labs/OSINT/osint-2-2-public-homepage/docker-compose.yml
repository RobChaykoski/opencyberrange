services:
  publicsite:
    mem_limit: 128m
    cpus: 0.15
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: swocts
    labels:
      ip_offset: "83"
    environment:
      LAB_MODE: "public_site"
      FLAG: "OCR{swocts_v13w_s0urc3}"
      COMPANY: "SWOCTS Hub"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
