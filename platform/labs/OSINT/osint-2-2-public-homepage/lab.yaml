title: The Public Homepage
category: osint
difficulty: beginner
estimated_time: 25
prerequisites:
  - osint-2-1-source-code-intelligence
# By completion students will be able to:
learning_outcomes:
  - Treat a public homepage as an OSINT source
  - Inventory author, generator, keywords, Open Graph, Twitter card, and custom metadata
  - Explain what each metadata field reveals to an outsider
  - Decide which metadata field provides the most useful information
  - Record the exact URL and source location of the finding
mapped_skills:
  - osint
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
  - Name the metadata field that revealed the most useful information, and explain why.
learning_concepts:
  - web metadata enumeration
  - Open Graph and social previews
  - generator and author disclosure
  - source-code OSINT
competency_tags:
  - osint.metadata_enumeration
  - osint.web_metadata
  - web.open_graph
  - evidence.analysis
defensive_skills:
  - review_page_metadata_before_publication
  - remove_unnecessary_author_and_generator_fields
  - treat_source_as_public
  - review_social_preview_data
evidence_required:
  - metadata_inventory
  - most_useful_field
  - interpretation
report_questions:
  - Which metadata field revealed the most useful information, and why?
  - What does the generator field tell an outsider?
  - How can Open Graph or Twitter card data expose internal context?
  - Which fields would you remove before publishing the page?
mitre_attack:
  - tactic: Reconnaissance
    technique: T1593
    technique_name: Search Open Websites/Domains
    detection: Monitor public content, DNS, and certificate-transparency sources for exposure.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "A real community site is part of the target surface. Inspect the source of www.swocts.com, find the flag left in its metadata, and explain why source-code clues are still OSINT."
visibility: course
audience: adult
offline_only: true
external_targets: []
personal_data: synthetic
free_text: false
public_profiles: false
phone_required: false
analytics: aggregate_only
minor_safe_defaults: false
flag: "OCR{swocts_v13w_s0urc3}"

tools:
  - browser
  - curl
  - grep

scenario: |
  SWOCTS Hub is a public community homepage. Like any modern site, it ships
  metadata and source code to every visitor.

  A flag has been placed in the reviewed offline mirror for this exercise. The
  rendered page looks ordinary; the flag is in the document metadata.

  The mirror at http://connect.lab:8080 is the assessed target and works
  offline. The live page is retired from the lab; the mirror is the only target.
  No personal data is used in this lab.

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Review page metadata before publication. Custom meta tags, Open Graph data, comments, and source code can disclose information that is not visible in the rendered page. Treat website source as public information."
difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'beginner' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-08"
workbook: "wiki/range/osint/CH_OSINT01_OSINT_Foundations/05_The_Public_Homepage/"

hostnames:
  - ip_offset: "83"
    hostname: "connect.lab"
    description: "SWOCTS public homepage mirror (HTTP 8080)"

topology:
  nodes:
    - id: "publicsite"
      label: "SWOCTS Hub mirror"
      type: "server"
      ip_offset: "83"
      ports: [8080]
      services: ["http"]
      x: 1
      y: 1

hints:
  - text: |
      Open the mirror in a browser and use View Page Source:

      curl -s http://connect.lab:8080/

    unlock_after_minutes: 4

  - text: |
      Build a metadata inventory before you search for the flag:

      curl -s http://connect.lab:8080/ | grep -iE '<title|<meta'

      Record the author, generator, keywords, Open Graph (`og:`), Twitter card,
      and any custom `x-` tag. Then ask which field reveals the most useful
      information to an outsider.
    unlock_after_minutes: 10

  - text: |
      The marker is a custom meta tag in the page head. Look for a name that
      starts with x- and a content value containing OCR{...}. Submit the whole
      flag exactly as it appears.
    unlock_after_minutes: 16

test:
  steps:
    - name: "Mirror homepage responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.publicsite}:8080/"
      expect: "200"
      timeout: 20

    - name: "Metadata inventory includes a generator"
      command: "curl -s http://{target.publicsite}:8080/ | grep -c 'name=\"generator\"'"
      expect: "1"
      timeout: 20

    - name: "Open Graph preview metadata is present"
      command: "curl -s http://{target.publicsite}:8080/ | grep -c 'property=\"og:title\"'"
      expect: "1"
      timeout: 20

    - name: "Twitter card metadata is present"
      command: "curl -s http://{target.publicsite}:8080/ | grep -c 'name=\"twitter:card\"'"
      expect: "1"
      timeout: 20

    - name: "Flag is present in the page metadata"
      command: "curl -s http://{target.publicsite}:8080/ | grep -o 'OCR{[^}]*}'"
      expect: "OCR{swocts_v13w_s0urc3}"
      timeout: 20
