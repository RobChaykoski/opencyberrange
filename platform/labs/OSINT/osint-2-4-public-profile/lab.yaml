title: The Public Profile
category: osint
difficulty: beginner
estimated_time: 20
prerequisites:
  - osint-1-1-public-footprint
# By completion students will be able to:
learning_outcomes:
  - Treat a public professional profile as an OSINT source
  - Separate visible fields from less-obvious correlation fields
  - Correlate the profile with a public conference page
  - Map each field to the exposure it enables
  - Explain why a public marker is not a secret and recover it
mapped_skills:
  - osint
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
  - Build an exposure map and name one cross-source correlation.
learning_concepts:
  - exposure mapping
  - identity correlation
  - public profile review
  - remediation prioritisation
competency_tags:
  - osint.exposure_mapping
  - osint.identity_correlation
  - privacy.profile_review
  - remediation.prioritisation
defensive_skills:
  - inventory_visible_and_less_obvious_fields
  - correlate_identifiers_across_sources
  - remove_contact_details_the_role_does_not_need
  - separate_personal_and_professional_presence
evidence_required:
  - profile_inventory
  - exposure_map
  - correlation_field
  - remediation
report_questions:
  - What information could be correlated across the profile and the conference page?
  - Which field enables the most cross-source correlation, and why?
  - Which field is the highest risk, and why?
  - What would you remove first, and what would you keep for professional contact?
mitre_attack:
  - tactic: Reconnaissance
    technique: T1593.001
    technique_name: "Search Open Websites/Domains: Social Media"
    detection: Review public profiles and social posts for intentional and unintentional exposure.
  - tactic: Reconnaissance
    technique: T1589.002
    technique_name: "Gather Victim Identity Information: Email Addresses"
    detection: Minimise public contact details and review them periodically.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-11"
review_status: "automated static proof; live walkthrough pending"
description: "A marker has been placed in the public About section of a fictional training profile. Read the local mirror, find the marker, and explain why a public field is not a secret. The lab is offline and collects no personal data."
visibility: course
audience: adult
offline_only: true
external_targets: []
personal_data: synthetic
free_text: false
public_profiles: false
phone_required: false
analytics: aggregate_only
minor_safe_defaults: false
flag: "OCR{f1ct10n4l_pr0f1l3_0s1nt_2026}"

tools:
  - phone
  - browser

scenario: |
  A fictional community cloud engineer has a public profile. The marker is in
  the public About section. The profile is invented for this exercise; there is
  no real social-media account, no QR code, and no phone required.

  Read the local mirror served by this lab and recover the marker. Do not search
  for a real person, send connection requests, or collect personal data.

troubleshooting: "If the live profile is unreachable, use the training mirror at the lab target. If the marker is rejected, copy it exactly as it appears and confirm the uppercase OCR prefix."
defensive_takeaways: "Treat every public profile field as permanent and copyable. Map visible and less-obvious fields to the exposure they enable, correlate identifiers across sources, remove contact details the role does not need, and separate personal and professional presence."
difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'beginner' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-11"
workbook: "wiki/range/osint/CH_OSINT02_Mobile_OSINT/02_The_Public_Profile/"

hostnames:
  - ip_offset: "85"
    hostname: "connect.lab"
    description: "Public profile training mirror (HTTP 8080)"

topology:
  nodes:
    - id: "profile"
      label: "Public Profile Mirror"
      type: "server"
      ip_offset: "85"
      ports: [8080]
      services: ["http"]
      x: 1
      y: 1

hints:
  - text: |
      Open the local mirror at the lab target. The marker is in the public About
      section of the fictional profile.
    unlock_after_minutes: 4

  - text: |
      The mirror is at http://connect.lab:8080/. Look for the "Research marker"
      line in the About card.
    unlock_after_minutes: 10

  - text: |
      The marker is the flag. Copy it exactly, including the uppercase OCR
      prefix, and submit it on the exercise page.
    unlock_after_minutes: 15

test:
  steps:
    - name: "Training mirror responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.profile}:8080/"
      expect: "200"
      timeout: 20

    - name: "Training mirror names the fictional organisation"
      command: "curl -s http://{target.profile}:8080/ | grep -o 'Northstar Community Cloud'"
      expect: "Northstar Community Cloud"
      timeout: 20

    - name: "Profile exposes the public email and handle"
      command: "curl -s http://{target.profile}:8080/ | grep -c 'riley.chen@northstar-community.example'"
      expect: "1"
      timeout: 20

    - name: "Conference page repeats the handle and travel dates"
      command: "curl -s http://{target.profile}:8080/talk | grep -c '@rileybuilds'"
      expect: "1"
      timeout: 20

    - name: "Profile API returns the same identifier"
      command: "curl -s http://{target.profile}:8080/api/profile | grep -o '@rileybuilds'"
      expect: "@rileybuilds"
      timeout: 20

    - name: "Training mirror contains the marker"
      command: "curl -s http://{target.profile}:8080/ | grep -o 'OCR{[^}]*}'"
      expect: "OCR{f1ct10n4l_pr0f1l3_0s1nt_2026}"
      timeout: 20
