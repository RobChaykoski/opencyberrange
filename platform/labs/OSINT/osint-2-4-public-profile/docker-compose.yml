services:
  intranet:
    mem_limit: 160m
    cpus: 0.2
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: connect
    labels:
      ip_offset: "85"
    environment:
      LAB_MODE: "public_profile_external"
      FLAG: "OCR{f1ct10n4l_pr0f1l3_0s1nt_2026}"
      COMPANY: "Kestrel Ridge"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
