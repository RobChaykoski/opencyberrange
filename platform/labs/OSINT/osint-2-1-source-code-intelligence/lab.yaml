title: The Developer's Trail
category: osint
difficulty: intermediate
estimated_time: 35
prerequisites:
  - osint-1-1-public-footprint
  - osint-1-2-image-intelligence
  - osint-1-3-exif-metadata
# By completion students will be able to:
learning_outcomes:
  - Inspect a site's static assets instead of only its rendered pages
  - Read JavaScript comments and build metadata
  - Recognise why secrets do not belong in client-side code
  - Recover the staging token and the bonus public-repository flag
mapped_skills:
  - osint
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "The Kestrel Connect front end ships a small JavaScript bundle. A leftover developer comment still carries a staging token. Review the code like an outside researcher and recover the flag."
visibility: public
flag: "OCR{c0d3_c0mm3nts_l34k_s3cr3ts}"

tools:
  - browser
  - curl
  - grep

scenario: |
  Kestrel Connect's dashboard is built from a handful of static files. The
  visible pages are deliberately ordinary, but the front end shipped with a
  developer note that was supposed to be removed before launch.

  This is the bonus challenge in the OSINT track. Treat the public web
  surface as a source: JavaScript, CSS, comments, source maps, and the public
  repository are all fair game.

  A second bonus flag has escaped into the public OpenCyberRange repository.
  Search for Kestrel Ridge or the badge ID KR-0421 to find the staging note.
  That flag is not required to complete this exercise.

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Minimise public metadata and review what the organisation publishes about people, systems, and suppliers."
difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'intermediate' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-08"
workbook: "wiki/range/osint/CH_OSINT01_OSINT_Foundations/04_The_Developers_Trail/"

hostnames:
  - ip_offset: "82"
    hostname: "connect.lab"
    description: "Kestrel Connect intranet (HTTP 8080)"

topology:
  nodes:
    - id: "intranet"
      label: "Kestrel Connect"
      type: "server"
      ip_offset: "82"
      ports: [8080]
      services: ["http"]
      x: 1
      y: 1

hints:
  - text: |
      Open http://connect.lab:8080 and view the page source. The page loads a
      script from /static/app.js. Static assets are part of the public attack
      surface even when they are not linked in the navigation.
    unlock_after_minutes: 5

  - text: |
      Fetch the script and search it for comments or staging strings:

      curl -s http://connect.lab:8080/static/app.js
      curl -s http://connect.lab:8080/static/app.js | grep -n -i 'TODO\|token\|staging\|OCR'
    unlock_after_minutes: 12

  - text: |
      The flag is in a block comment near the bottom of app.js. Submit it from
      the exercise panel. For the bonus flag, search the public OpenCyberRange
      repository for "Kestrel Ridge" or "KR-0421" and read the staging note.
    unlock_after_minutes: 20

test:
  steps:
    - name: "Dashboard responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.intranet}:8080/"
      expect: "200"
      timeout: 20

    - name: "JavaScript asset is served"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.intranet}:8080/static/app.js"
      expect: "200"
      timeout: 20

    - name: "Flag is present in a JavaScript comment"
      command: "curl -s http://{target.intranet}:8080/static/app.js | grep -o 'OCR{[^}]*}'"
      expect: "OCR{c0d3_c0mm3nts_l34k_s3cr3ts}"
      timeout: 20
