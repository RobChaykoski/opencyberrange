title: Zenith Global - Capstone CTF
category: assessment
difficulty: advanced
estimated_time: 120
prerequisites:
  - linux-5-4-suricata-live-detection
# By completion students will be able to:
learning_outcomes:
  - Perform comprehensive reconnaissance across multiple target systems
  - Exploit a web application vulnerability to gain initial access
  - Escalate privileges on a compromised server
  - Move laterally to additional internal systems using discovered credentials
  - Extract data from a backend database to prove full compromise
mapped_skills:
  - incident_forensics
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Initial Access
    technique: T1190
    technique_name: Exploit Public-Facing Application
    detection: Monitor web/WAF logs for exploit payloads and abnormal application errors.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "Conduct a full red team engagement against Zenith Global Corp. Chain web exploitation, privilege escalation, and lateral movement across three servers to achieve complete infrastructure compromise."

randomize_ip_offsets: true
visibility: course
week: 15
flag: "OCR{z3n1th_pwn3d_v1ct0ry}"

scenario: |
  Zenith Global Corp is a multinational logistics company headquartered in
  Chicago. They've engaged your elite red team for a full-scope penetration
  test as part of their annual security program. This is the capstone
  assessment - everything you've learned this semester comes together here.

  Briefing from Diane Holloway (CISO): "We have three tiers of infrastructure.
  The web frontend handles customer tracking and order management. Behind that,
  our application server runs the business logic. And at the core, our database
  server holds everything - customer data, financial records, shipping manifests.
  I want you to demonstrate whether an external attacker can reach our data.
  Our architecture team says it's impossible without insider access."

  Prove them wrong. Three flags are planted across all three tiers. This is your
  final exam - no hints for the first 30 minutes. Good luck.

credentials: []

hints:
  - text: |
      Start with the web frontend. Enumerate all services with nmap. The web
      application has an API that serves order data. One API endpoint has an
      IDOR (Insecure Direct Object Reference) vulnerability - it returns data
      for any order ID without authorization. Interesting data might include
      internal system credentials.
    unlock_after_minutes: 30
  - text: |
      Try /api/orders/1 through /api/orders/10. Order #7 contains internal
      notes with SSH credentials for the appserver. Marker 1 is in the web
      frontend's config. SSH to the appserver as the discovered user. The
      appserver has python3 with SUID - use it for privesc. Then find the
      database credentials and query the datastore.
    unlock_after_minutes: 50
  - text: |
      Frontend: curl http://<webfront>/api/orders/7 - gives SSH creds
      Also: curl http://<webfront>/api/config (broken access) - marker 1
      Appserver: ssh appuser@<appserver> with discovered password.
      Privesc: python3 -c "import os;os.setuid(0);os.system('/bin/sh')"
      Marker 2 in /root/marker.txt. DB creds in /opt/zenith/db.conf.
      Datastore: mysql -h <datastore> -u zenith_app -p'...' zenith -e "SELECT * FROM flags"
    unlock_after_minutes: 70

