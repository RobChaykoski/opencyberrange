topology:
  nodes:
    - id: "target-alpha"
      label: "DMZ Host Alpha"
      type: "server"
      ip_offset: "14"
      ports: [22, 80]
      services: ["OpenSSH", "nginx"]
      x: 1
      y: 1
    - id: "target-bravo"
      label: "DMZ Host Bravo"
      type: "server"
      ip_offset: "29"
      ports: [21, 80]
      services: ["vsftpd", "Apache"]
      x: 2
      y: 1
    - id: "target-charlie"
      label: "DMZ Host Charlie"
      type: "server"
      ip_offset: "43"
      ports: [21, 80, 9999]
      services: ["nginx", "vsftpd", "Custom Service"]
      x: 3
      y: 1
  edges:
    - from: "attacker"
      to: "target-alpha"
      label: "All Ports"
      access: "direct"
    - from: "attacker"
      to: "target-bravo"
      label: "All Ports"
      access: "direct"
    - from: "attacker"
      to: "target-charlie"
      label: "All Ports"
      access: "direct"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "Verify target-alpha responds"
      command: "nmap -sn {target.target-alpha} 2>&1 | grep -c 'Host is up'"
      expect: "1"
      timeout: 15

    - name: "Verify target-bravo responds"
      command: "nmap -sn {target.target-bravo} 2>&1 | grep -c 'Host is up'"
      expect: "1"
      timeout: 15

    - name: "Verify target-charlie responds"
      command: "nmap -sn {target.target-charlie} 2>&1 | grep -c 'Host is up'"
      expect: "1"
      timeout: 15

    - name: "Target-charlie web page contains Vanguard"
      command: "curl -s http://{target.target-charlie}/ | grep -q 'Vanguard' && echo yes"
      expect: "yes"
      timeout: 15

    - name: "Extract token 1 from target-charlie web page"
      command: "curl -s http://{target.target-charlie}/ | grep -o 'Token: [a-z0-9_]*' | awk '{print $2}'"
      expect: "tr14g3"
      timeout: 15

    - name: "Extract token 2 from target-charlie FTP"
      command: "curl -s ftp://{target.target-charlie}/token.txt --connect-timeout 10"
      expect: "r34l"
      timeout: 20

    - name: "Extract token 3 from target-charlie port 9999"
      command: "timeout 3 bash -c 'cat < /dev/tcp/{target.target-charlie}/9999' 2>&1 | grep -o 'Token: [a-z0-9_]*' | awk '{print $2}'"
      expect: "t4rg3t"
      timeout: 15

    - name: "Verify complete flag"
      command: "echo 'OCR{tr14g3_r34l_t4rg3t}'"
      expect: "OCR{"
