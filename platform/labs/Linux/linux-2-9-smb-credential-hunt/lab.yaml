title: Hargrove Medical Group - SMB Credential Hunt
category: enumeration
difficulty: intermediate
estimated_time: 40
prerequisites:
  - linux-2-8-snmp-community-strings
# By completion students will be able to:
learning_outcomes:
  - Enumerate SMB shares available on the target using anonymous access
  - Access public shares and identify embedded assessment tokens
  - Discover service account credentials through misconfigured file shares
  - Authenticate to a restricted share using discovered credentials
  - Assemble the complete flag from tokens found across multiple shares
mapped_skills:
  - network_systems
  - identity_access
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Credential Access
    technique: T1552
    technique_name: Unsecured Credentials
    detection: Review file, configuration, and secret-store access for exposed credentials.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "A medical group's Samba server has multiple shares with varying access levels. Enumerate shares, discover credentials through information disclosure, and pivot to restricted clinical data."

randomize_ip_offsets: true
visibility: course
week: 2
flag: "OCR{smb_hunt_cr3ds}"

scenario: |
  Hargrove Medical Group is a multi-location healthcare practice based in
  Nashville, Tennessee. After a recent infrastructure upgrade, their IT
  department deployed a new Linux-based file server running Samba to
  centralize document sharing across their three clinic locations.

  Your security consultancy has been engaged to assess the file server's
  share permissions. The practice manager, Dr. Ellen Hargrove, is concerned
  that sensitive clinical data may be accessible to unauthorized users.

  "We store patient assessment forms and internal audit documents on that
  server. Our IT contractor said guest access is limited to the welcome
  materials, but I want proof."

  Two assessment tokens have been placed across the shares. Enumerate all
  shares, discover any leaked credentials, and retrieve both tokens.

credentials:
  - username: "medsvc"
    password: "H4rgr0v3_M3d#"
    role: "clinical"
    description: "Medical service account credentials (discovered in records share)"

hints:
  - text: |
      Begin by discovering what SMB shares the server exposes. Use smbclient
      to list shares with anonymous access: smbclient -L //<target_ip> -N
      The -N flag sends a null (no password) authentication. Look for shares
      that are marked as Disk type.
    unlock_after_minutes: 15
  - text: |
      There are multiple shares allowing guest access. Connect to each one
      and download all files. One share contains a notes file with an
      embedded audit token. Another share has a configuration file that leaks
      service account credentials for a restricted share.
    unlock_after_minutes: 25
  - text: |
      The "records" share contains a backup_config.ini with credentials for
      the medsvc account. Use those credentials to access the "clinical"
      share: smbclient //<target_ip>/clinical -U medsvc%<password>
      The second token is in a file on that share.
    unlock_after_minutes: 35

difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'intermediate' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-08"
workbook: "wiki/range/linpt/CH_LIN02B_SMB_SNMP/03_SMB_Credential_Hunt/"

topology:
  nodes:
    - id: "target"
      label: "File Server"
      type: "server"
      ip_offset: "27"
      ports: [445, 139]
      services: ["Samba"]
      x: 2
      y: 1
  edges:
    - from: "attacker"
      to: "target"
      label: "SMB:445"
      access: "direct"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "SMB port is accessible"
      command: "nmap -p 445 --open {target.target} 2>&1 | grep -c '445.*open'"
      expect: "1"
      timeout: 15

    - name: "List SMB shares anonymously"
      command: "smbclient -L //{target.target} -N 2>&1 | grep -c Disk"
      expect: "3"
      timeout: 15

    - name: "Access public share and extract token 1"
      command: "smbclient //{target.target}/public -N -c 'get it_notes.txt /tmp/smb_itnotes.txt' 2>&1 && grep -o 'audit_token=[^ ]*' /tmp/smb_itnotes.txt | cut -d= -f2"
      expect: "smb_hunt"
      timeout: 15

    - name: "Access records share and find credentials"
      command: "smbclient //{target.target}/records -N -c 'get backup_config.ini /tmp/smb_config.txt' 2>&1 && grep 'password' /tmp/smb_config.txt | sed 's/.*= *//' | head -1"
      expect: "H4rgr0v3_M3d#"
      timeout: 15

    - name: "Use credentials to access clinical share and get token 2"
      command: "smbclient //{target.target}/clinical -U medsvc%H4rgr0v3_M3d# -c 'get assessment_marker.txt /tmp/smb_marker.txt' 2>&1 && cat /tmp/smb_marker.txt"
      expect: "cr3ds"
      timeout: 15

    - name: "Verify assembled flag"
      command: "echo 'OCR{smb_hunt_cr3ds}'"
      expect: "OCR{"
