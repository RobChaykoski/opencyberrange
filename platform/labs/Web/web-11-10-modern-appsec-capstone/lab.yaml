title: 'Modern Application Security: Capstone Assessment'
category: assessment
difficulty: advanced
estimated_time: 160
prerequisites:
- web-11-2-api-bola-bfla
- web-11-4-jwt-security
- web-11-8-kubernetes-security
# By completion students will be able to:
learning_outcomes:
- Chain API, JWT, container, and supply-chain weaknesses
- Produce an evidence-backed assessment
- Prioritise remediation by risk
- Write the executive and technical summary
mapped_skills:
- web_api
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Initial Access
  technique: T1190
  technique_name: Exploit Public-Facing Application
  detection: Correlate API, identity, container, and supply-chain findings into one assessment.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Combine the modern application-security techniques into one assessment and recover the capstone token.
scenario: The capstone service exposes several weaknesses from the pathway. Build the chain, recover the token, and write the report.
credentials: []
hints:
- text: Start with inventory, then BOLA/BFLA, JWT, container, and supply chain.
- text: The audit endpoint returns the capstone token once the chain is understood.
- text: Evidence per finding, then remediation by risk.
flag: OCR{m0d3rn_4pp53c_c4p}
test:
  steps:
  - name: Service responds
    command: curl -s http://{target.webapp}/api/health | grep -c ok
  - name: Recover the assessment token
    command: curl -s http://{target.webapp}/api/admin/audit | grep -o 'OCR{[^}]*}'
    expect: OCR{m0d3rn_4pp53c_c4p}
    timeout: 30
  - name: Confirm the token
    command: echo OCR{m0d3rn_4pp53c_c4p}
    expect: OCR{m0d3rn_4pp53c_c4p}
visibility: public
week: 11
defensive_takeaways: Server-side authorization, strict token validation, least-privilege runtime, and artifact verification remove this class of weakness.
troubleshooting: If the service is slow, allow the first build to finish. Confirm the container is on the lab network before curling it.
difficulty_evidence: Pathway implementation with a static endpoint walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: webapp
    label: Lab API
    type: server
    ip_offset: '20'
    ports:
    - 80
    services:
    - Flask
    - lab API
