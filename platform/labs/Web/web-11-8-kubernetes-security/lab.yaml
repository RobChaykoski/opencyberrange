title: 'DevSecOps: Kubernetes Security'
category: web
difficulty: advanced
estimated_time: 120
prerequisites:
- web-11-7-container-security
# By completion students will be able to:
learning_outcomes:
- Review service-account RBAC for least privilege
- Identify privileged pods and hostPath mounts
- Design default-deny network policy
- Recommend workload identity and admission controls
mapped_skills:
- web_api
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
learning_concepts:
  - "web application security"
  - "HTTP request and response"
  - "attack surface mapping"
  - "devsecops: kubernetes security"
  - "service-account rbac for least privilege"
competency_tags:
  - "web.kubernetes_security"
  - "web.api"
  - "web.fundamentals"
defensive_skills:
  - "server_side_authorization"
  - "strict_token_validation"
  - "least_privilege_runtime"
  - "artifact_verification_remove_this_class_of_weakness"
evidence_required:
  - "flag"
  - "request_and_response"
  - "evidence"
  - "interpretation"
  - "report"
report_questions:
  - "Which request or response shows the weakness?"
  - "What does the evidence not prove?"
  - "Which control would have prevented or detected the issue?"
  - "What would you record before escalating?"

mitre_attack:
- tactic: Privilege Escalation
  technique: T1611
  technique_name: Escape to Host
  detection: Alert on privileged pods, hostPath mounts, and broad service-account RBAC.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Review a Kubernetes workload, identify the RBAC and pod-security gaps, and recover the assessment token.
scenario: The workload uses a broad service account. Inspect /api/k8s/secrets, recover the token, and propose RBAC and pod-security fixes.
credentials: []
hints:
- text: The service account has wide list/get permissions.
- text: Privileged pods and hostPath mounts turn a workload bug into a host escape.
- text: The token is in the secrets endpoint response.
flag: OCR{k8s_rb4c_3sc}
test:
  steps:
  - name: Service responds
    command: curl -s http://{target.webapp}/api/health | grep -c ok
  - name: Recover the assessment token
    command: curl -s http://{target.webapp}/api/k8s/secrets | grep -o 'OCR{[^}]*}'
    expect: OCR{k8s_rb4c_3sc}
    timeout: 30
  - name: Confirm the token
    command: echo OCR{k8s_rb4c_3sc}
    expect: OCR{k8s_rb4c_3sc}
visibility: public
week: 11
defensive_takeaways: "Server-side authorization, strict token validation, least-privilege runtime, and artifact verification remove this class of weakness. In this lab, apply that to devsecops: kubernetes security and record the evidence before recommending the fix."
troubleshooting: If the service is slow, allow the first build to finish. Confirm the container is on the lab network before curling it.
difficulty_evidence: Pathway implementation with a static endpoint walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: webapp
    label: Lab API
    type: server
    ip_offset: '20'
    ports:
    - 80
    services:
    - Flask
    - lab API
workbook: wiki/range/webpt/CH_WEB11_AppSec_Pathway/08_Kubernetes_Security/
