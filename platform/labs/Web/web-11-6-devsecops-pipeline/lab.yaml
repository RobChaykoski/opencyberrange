title: 'DevSecOps: CI/CD Pipeline Security'
category: web
difficulty: intermediate
estimated_time: 90
prerequisites:
- web-11-1-api-inventory
# By completion students will be able to:
learning_outcomes:
- Review a CI pipeline for secret exposure
- Identify over-broad workflow tokens
- Recommend secret scanning and provenance
- Write a remediation plan
mapped_skills:
- web_api
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Credential Access
  technique: T1552.001
  technique_name: Credentials In Files
  detection: Scan repositories and build logs for committed secrets and over-broad CI tokens.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Find a leaked CI secret, recover the assessment token, and harden the pipeline.
scenario: A CI service exposes a build artefact. Inspect it, recover the token, and recommend least-privilege workflow permissions.
credentials: []
hints:
- text: Check /ci/secrets and the pipeline description.
- text: Committed secrets and broad GITHUB_TOKEN permissions are the common gaps.
- text: Rotate the secret and add a pre-commit scan.
flag: OCR{c1_s3cr3t_l34k}
test:
  steps:
  - name: Service responds
    command: curl -s http://{target.webapp}/api/health | grep -c ok
  - name: Recover the assessment token
    command: curl -s http://{target.webapp}/ci/secrets | grep -o 'OCR{[^}]*}'
    expect: OCR{c1_s3cr3t_l34k}
    timeout: 30
  - name: Confirm the token
    command: echo OCR{c1_s3cr3t_l34k}
    expect: OCR{c1_s3cr3t_l34k}
visibility: public
week: 11
defensive_takeaways: Server-side authorization, strict token validation, least-privilege runtime, and artifact verification remove this class of weakness.
troubleshooting: If the service is slow, allow the first build to finish. Confirm the container is on the lab network before curling it.
difficulty_evidence: Pathway implementation with a static endpoint walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: webapp
    label: Lab API
    type: server
    ip_offset: '20'
    ports:
    - 80
    services:
    - Flask
    - lab API
workbook: wiki/range/webpt/CH_WEB11_AppSec_Pathway/06_DevSecOps_Pipeline/
