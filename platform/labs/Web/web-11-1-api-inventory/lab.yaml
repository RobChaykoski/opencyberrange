title: 'API Security: Inventory and Attack Surface Mapping'
category: web
difficulty: beginner
estimated_time: 60
prerequisites:
- web-2-2-insecure-api-endpoints
# By completion students will be able to:
learning_outcomes:
- Build an API inventory from documentation and responses
- Identify undocumented and internal endpoints
- Classify endpoints by authentication and data sensitivity
- Record the inventory as assessment evidence
mapped_skills:
- web_api
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Reconnaissance
  technique: T1595.002
  technique_name: Vulnerability Scanning
  detection: Monitor for automated endpoint discovery and documentation scraping.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Map a public API, find the undocumented internal inventory endpoint, and recover the assessment token.
scenario: A public API ships with documentation, but an internal inventory endpoint is exposed. Enumerate the surface and recover the token.
credentials: []
hints:
- text: Read /api/docs and the root response.
- text: Try /api/internal/inventory and other internal paths.
- text: The inventory response contains the assessment_token.
flag: OCR{4p1_1nv3nt0ry}
test:
  steps:
  - name: Service responds
    command: curl -s http://{target.webapp}/api/health | grep -c ok
  - name: Recover the assessment token
    command: curl -s http://{target.webapp}/api/internal/inventory | grep -o 'OCR{[^}]*}'
    expect: OCR{4p1_1nv3nt0ry}
    timeout: 30
  - name: Confirm the token
    command: echo OCR{4p1_1nv3nt0ry}
    expect: OCR{4p1_1nv3nt0ry}
visibility: public
week: 11
defensive_takeaways: Server-side authorization, strict token validation, least-privilege runtime, and artifact verification remove this class of weakness.
troubleshooting: If the service is slow, allow the first build to finish. Confirm the container is on the lab network before curling it.
difficulty_evidence: Pathway implementation with a static endpoint walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: webapp
    label: Lab API
    type: server
    ip_offset: '20'
    ports:
    - 80
    services:
    - Flask
    - lab API
