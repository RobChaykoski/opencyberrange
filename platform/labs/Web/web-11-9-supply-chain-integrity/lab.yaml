title: 'DevSecOps: Supply Chain and Artifact Integrity'
category: web
difficulty: intermediate
estimated_time: 80
prerequisites:
- web-11-6-devsecops-pipeline
# By completion students will be able to:
learning_outcomes:
- Read an SBOM and identify components
- Verify an artifact signature and provenance
- Identify an unsigned or substituted artefact
- Recommend signing and verification gates
mapped_skills:
- web_api
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
learning_concepts:
  - "web application security"
  - "HTTP request and response"
  - "attack surface mapping"
  - "devsecops: supply chain and artifact integrity"
  - "sbom and identify components"
competency_tags:
  - "web.supply_chain_integrity"
  - "web.chain_integrity"
  - "web.api"
  - "web.fundamentals"
defensive_skills:
  - "server_side_authorization"
  - "strict_token_validation"
  - "least_privilege_runtime"
  - "artifact_verification_remove_this_class_of_weakness"
evidence_required:
  - "flag"
  - "request_and_response"
  - "evidence"
  - "interpretation"
report_questions:
  - "Which request or response shows the weakness?"
  - "What does the evidence not prove?"
  - "Which control would have prevented or detected the issue?"
  - "What would you record before escalating?"

mitre_attack:
- tactic: Initial Access
  technique: T1195.002
  technique_name: Compromise Software Supply Chain
  detection: Verify signatures, provenance, and SBOM hashes before deployment.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Review an SBOM and artefact signature, identify the integrity gap, and recover the assessment token.
scenario: A registry serves an artefact without a valid signature. Inspect the SBOM, recover the token, and add the verification gate.
credentials: []
hints:
- text: Compare the SBOM hash with the served artefact.
- text: The sbom response shows whether the artefact is signed.
- text: Sign artefacts and verify before deploy.
flag: OCR{sb0m_s1gn4tur3}
test:
  steps:
  - name: Service responds
    command: curl -s http://{target.webapp}/api/health | grep -c ok
  - name: Recover the assessment token
    command: curl -s http://{target.webapp}/api/sbom | grep -o 'OCR{[^}]*}'
    expect: OCR{sb0m_s1gn4tur3}
    timeout: 30
  - name: Confirm the token
    command: echo OCR{sb0m_s1gn4tur3}
    expect: OCR{sb0m_s1gn4tur3}
visibility: public
week: 11
defensive_takeaways: "Server-side authorization, strict token validation, least-privilege runtime, and artifact verification remove this class of weakness. In this lab, apply that to devsecops: supply chain and artifact integrity and record the evidence before recommending the fix."
troubleshooting: If the service is slow, allow the first build to finish. Confirm the container is on the lab network before curling it.
difficulty_evidence: Pathway implementation with a static endpoint walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: webapp
    label: Lab API
    type: server
    ip_offset: '20'
    ports:
    - 80
    services:
    - Flask
    - lab API
workbook: wiki/range/webpt/CH_WEB11_AppSec_Pathway/09_Supply_Chain_Integrity/
