title: 'API Security: OAuth and OIDC Abuse'
category: web
difficulty: advanced
estimated_time: 100
prerequisites:
- web-11-4-jwt-security
# By completion students will be able to:
learning_outcomes:
- Map an OAuth authorization-code flow
- Test redirect URI validation
- Explain state, PKCE, and nonce controls
- Recommend exact redirect matching and token binding
mapped_skills:
- web_api
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
learning_concepts:
  - "web application security"
  - "HTTP request and response"
  - "attack surface mapping"
  - "api security: oauth and oidc abuse"
  - "oauth authorization-code flow"
competency_tags:
