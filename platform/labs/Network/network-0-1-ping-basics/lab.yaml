scenario: |
  You are on the help desk at Northwind School Board. A teacher reports that the
  internal portal is "down." Your first check is simple: can your workstation
  reach the server at all?

  The portal host is `{target.target}`. Ping it, read the reply, then open the
  maintenance note at `http://{target.target}/` to confirm whether the web
  service itself is running.

  A reply proves the host is reachable. It does not prove the service is up.
  Keep that distinction in mind when you write your answer.

