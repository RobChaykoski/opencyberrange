# Authoritative DNS for the range.local lab zone.
# Do not forward queries upstream; this server only answers for range.local.

port=53
no-resolv
no-hosts
domain-needed
bogus-priv
local=/range.local/

# __SELF_IP__ is replaced at startup with this container's address, so the
# A records follow the lab's per-student IP assignment.
# A non-zero TTL is part of the lesson: the student reads it and reasons about
# caching, so it must not be 0 ("do not cache").
local-ttl=300
address=/portal.range.local/__SELF_IP__
address=/files.range.local/__SELF_IP__
address=/mail.range.local/__SELF_IP__

# Alias and mail records for teaching common record types.
cname=alias.range.local,portal.range.local
mx-host=range.local,mail.range.local,10

# The deployment note holds the flag.
txt-record=_note.range.local,"OCR{dns_1s_th3_ph0n3b00k}"

# A second TXT record shows that a domain can publish policy text too.
txt-record=range.local,"v=spf1 -all"
