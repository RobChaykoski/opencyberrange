services:
  target:
    build:
      context: ./containers/target
      dockerfile: Dockerfile
    hostname: internal-dns
    labels:
      ip_offset: "10"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
