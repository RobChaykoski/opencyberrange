title: Device Topology - Routed Path to a Protected Service
category: network
difficulty: intermediate
estimated_time: 45
prerequisites:
  - network-12-1-firewall-fundamentals
learning_outcomes:
  - Map a three-node topology from the lab metadata and the node status endpoint
  - Explain how a host uses a default route to reach a remote subnet
  - Verify IPv4 forwarding on a Linux router
  - Reach a protected HTTP service through the router rather than directly
  - Describe why a routed path is a control point for segmentation and monitoring
mapped_skills:
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Discovery
    technique: T1016
    technique_name: System Network Configuration Discovery
    detection: Alert on unexpected route and interface discovery from a learner workstation.

owner: "OpenCyberRange Curriculum"
content_version: "4.0"
reviewed_at: "2026-11-12"
review_status: "engine unit tests and live dev smoke; learner walkthrough pending"
description: "A protected service sits behind a Linux router. Map the topology, confirm the host default route and router forwarding, then reach the service through the routed path and recover the flag."
scenario: |
  A small training network has three devices: a learner workstation (h1), a
  Linux router (r1), and a protected HTTP service (svc). The workstation and the
  service are on different point-to-point links, so traffic has to cross r1.
  Your task is to map the topology, prove that the host uses the router, and
  reach the flag service through that path.

  The engine allocates a private /29 for each link at spawn time. The node
  status endpoint on port 8080 reports the role, links, peer addresses, and
  default gateway for that device.
credentials:
  - role: "analyst"
    username: "analyst"
    # Demo lab credential; security-delta: allow credential-like assignment
    password: "Topology2026"
    description: "SSH access to each topology node"
hints:
  - text: |
      Start with the status endpoint on each management IP:
      `curl http://{target.r1}:8080/status`. It reports the router role and its
      links.
  - text: |
      From h1, `ip route` shows the default route. The router's link address is
      the next hop.
  - text: |
      On r1, `cat /proc/sys/net/ipv4/ip_forward` should be `1`. Connected routes
      for both links appear in `ip route`.
  - text: |
      The service listens on port 80 on its link address. Use the peer address
      reported by r1's status endpoint, not the management address, to prove the
      routed path.
flag: "OCR{t0p0l0gy_r0ut3d}"

visibility: public
week: 12
troubleshooting: "If a node is unreachable, confirm the lab is running and use the management IP shown in the exercise. If the status endpoint fails, the node image may not be built on this host; rebuild ocr-lab/topology-node:latest. Report a persistent failure to the instructor."
defensive_takeaways: "A routed segment is a natural enforcement and monitoring point. Default routes and forwarding are configuration that should be reviewed and logged."
difficulty_evidence: "Engine unit tests and a live dev spawn; learner walkthrough pending."
difficulty_evidence_source: "automated_and_manual_smoke"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-12"
workbook: "wiki/range/netfor/CH_NET12_Device_Topology/00_Introduction/"

topology:
  nodes:
    - id: "h1"
      label: "Learner Workstation"
      type: "workstation"
      ip_offset: "21"
      ports: [22, 8080]
      services: ["OpenSSH", "Status"]
      x: 1
      y: 2
    - id: "r1"
      label: "Linux Router"
      type: "router"
      ip_offset: "22"
      ports: [22, 8080]
      services: ["OpenSSH", "IPv4 forwarding"]
      x: 2
      y: 2
    - id: "svc"
      label: "Protected Service"
      type: "server"
      ip_offset: "23"
      ports: [22, 80, 8080]
      services: ["OpenSSH", "HTTP flag"]
      x: 3
      y: 2
  edges:
    - from: "h1"
      to: "r1"
      label: "point-to-point /29"
      access: "direct"
    - from: "r1"
      to: "svc"
      label: "point-to-point /29"
      access: "routed"

test:
  steps:
    - name: "SSH to the workstation"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} 'echo connected' 2>&1"
      expect: "connected"
      timeout: 20

    - name: "Router reports its role"
      command: "curl -s --connect-timeout 5 http://{target.r1}:8080/status"
      expect: '"role": "router"'
      timeout: 15

    - name: "Router forwards IPv4"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.r1} 'cat /proc/sys/net/ipv4/ip_forward' 2>&1"
      expect: "1"
      timeout: 20

    - name: "Workstation has a default route"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} 'ip route | grep default' 2>&1"
      expect: "default via"
      timeout: 20

    - name: "Protected service returns the flag"
      command: "curl -s --connect-timeout 5 http://{target.svc}/flag"
      expect: "OCR{t0p0l0gy_r0ut3d}"
      timeout: 15

