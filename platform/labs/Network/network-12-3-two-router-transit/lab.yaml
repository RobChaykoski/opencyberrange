title: Two-Router Transit - Static Routes Across a Transit Link
category: network
difficulty: intermediate
estimated_time: 60
prerequisites:
  - network-12-2-device-topology-engine
# By completion students will be able to:
learning_outcomes:
  - Explain why two routers need a route to each other's downstream subnet
  - Read a transit link and a service link from the node status endpoint
  - Verify static routes and forwarding on both routers
  - Prove end-to-end reachability from a host to a service behind two routers
  - Describe the failure mode when a return route is missing
mapped_skills:
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Discovery
    technique: T1016
    technique_name: System Network Configuration Discovery
    detection: Alert on route and interface discovery from a learner workstation.

owner: "OpenCyberRange Curriculum"
content_version: "4.0"
reviewed_at: "2026-11-12"
review_status: "engine unit tests and live dev smoke; learner walkthrough pending"
description: "A service sits two routed hops from the workstation. Map both routers, confirm the transit and return routes, then retrieve the flag through the two-router path."
scenario: |
  The training network now has two routers. The workstation (h1) connects to
  r1, r1 connects to r2 over a transit link, and r2 connects to the protected
  service (svc). Each router needs a route to the far side of the other router,
  or the request may leave but the reply cannot return.

  Map the links, read the route tables, and prove that h1 reaches svc through
  r1 and r2.
credentials:
  - role: "analyst"
    username: "analyst"
    # Demo lab credential; security-delta: allow credential-like assignment
    password: "Topology2026"
    description: "SSH access to each topology node"
hints:
  - text: |
      Query the status endpoint on r1 and r2. Each link reports its local and
      peer address and the /29 subnet.
  - text: |
      On r1, look for a route to the service-side /29 through r2. On r2, look
      for a route to the workstation-side /29 through r1.
  - text: |
      `ip route` shows the routes. On a router, a missing return route is the
      usual reason a forward path appears to work but replies never arrive.
  - text: |
      The flag is on svc's link address, not its management address.
flag: "OCR{tw0_r0ut3rs_0n3_p4th}"

visibility: public
week: 12
troubleshooting: "If r1 can reach r2 but h1 cannot reach svc, check the return route on r2 and forwarding on both routers. Use the status endpoint to confirm the link subnets before changing anything."
defensive_takeaways: "Transit links are a natural inspection point. Static routes should be documented, monitored, and paired with a return path; missing return routes are a common outage."
difficulty_evidence: "Engine unit tests and live dev smoke; learner walkthrough pending."
difficulty_evidence_source: "automated_and_manual_smoke"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-12"
workbook: "wiki/range/netfor/CH_NET12_Device_Topology/02_Two_Router_Transit/"

topology:
  nodes:
    - id: "h1"
      label: "Learner Workstation"
      type: "workstation"
      ip_offset: "21"
      ports: [22, 8080]
      services: ["OpenSSH", "Status"]
      x: 1
      y: 2
    - id: "r1"
      label: "Edge Router"
      type: "router"
      ip_offset: "22"
      ports: [22, 8080]
      services: ["OpenSSH", "Static routing"]
      x: 2
      y: 2
    - id: "r2"
      label: "Transit Router"
      type: "router"
      ip_offset: "23"
      ports: [22, 8080]
      services: ["OpenSSH", "Static routing"]
      x: 3
      y: 2
    - id: "svc"
      label: "Protected Service"
      type: "server"
      ip_offset: "24"
      ports: [22, 80, 8080]
      services: ["OpenSSH", "HTTP flag"]
      x: 4
      y: 2
  edges:
    - from: "h1"
      to: "r1"
      label: "workstation link /29"
      access: "direct"
    - from: "r1"
      to: "r2"
      label: "transit link /29"
      access: "direct"
    - from: "r2"
      to: "svc"
      label: "service link /29"
      access: "routed"

test:
  steps:
    - name: "SSH to the workstation"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} 'echo connected' 2>&1"
      expect: "connected"
      timeout: 20

    - name: "Workstation uses r1 as its default route"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} 'ip route | grep default' 2>&1"
      expect: "default via"
      timeout: 20

    - name: "Both routers forward IPv4"
      command: "for h in {target.r1} {target.r2}; do sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@$h 'cat /proc/sys/net/ipv4/ip_forward' 2>&1; done"
      expect: "1"
      timeout: 30

    - name: "r1 has a route to the service link"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.r1} 'ip route' 2>&1"
      expect: "via"
      timeout: 20

    - name: "Retrieve the flag through both routers"
      command: "IP=$(curl -s --connect-timeout 5 http://{target.r2}:8080/status | jq -r '.links[] | select(.peer==\"svc\") | .peer_ip'); sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} \"wget -qO- http://$IP/flag\" 2>&1"
      expect: "OCR{tw0_r0ut3rs_0n3_p4th}"
      timeout: 30
