title: Multi-Service Router - Map and Reach Two Services
category: network
difficulty: intermediate
estimated_time: 70
prerequisites:
  - network-12-2-device-topology-engine
# By completion students will be able to:
learning_outcomes:
  - Map a three-link router topology from the status endpoint
  - Distinguish management addresses from per-link service addresses
  - Reach two services through one router without direct host links
  - Produce a short topology record with node, link, and subnet evidence
  - Explain why a host needs only a default route when the router is connected
mapped_skills:
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Discovery
    technique: T1016
    technique_name: System Network Configuration Discovery
    detection: Alert on repeated topology and service discovery from a learner workstation.

owner: "OpenCyberRange Curriculum"
content_version: "4.0"
reviewed_at: "2026-11-12"
review_status: "engine unit tests and live dev smoke; learner walkthrough pending"
description: "A router connects the workstation to two services on separate links. Map all three links, document the subnets, and retrieve the flag from the correct service."
scenario: |
  One router connects three networks: the workstation link, a flag service, and
  a second status service. The workstation has only a default route; the
  router knows all three connected subnets. Your task is to map the links,
  record the topology, and prove that both services are reachable through the
  router.
credentials:
  - role: "analyst"
    username: "analyst"
    # Demo lab credential; security-delta: allow credential-like assignment
    password: "Topology2026"
    description: "SSH access to each topology node"
hints:
  - text: |
      The router status endpoint lists three links. Each link has a peer, local
      address, peer address, and /29 subnet.
  - text: |
      Use the router status to get the service link addresses. Test from h1, not
      from the management network.
  - text: |
      svc2 has no flag. Its status endpoint is still useful to prove reachability.
  - text: |
      A topology record should list each node, each link, and the subnet. Keep it
      short and factual.
flag: "OCR{mult1_s3rv1c3_r0ut3}"

visibility: public
week: 12
troubleshooting: "If only one service is reachable, compare the router's connected routes with the status links. A missing link or address means the node did not attach to that network."
defensive_takeaways: "Multi-service routers concentrate reachability. Document every link and service, then monitor the paths you actually intend to expose."
difficulty_evidence: "Engine unit tests and live dev smoke; learner walkthrough pending."
difficulty_evidence_source: "automated_and_manual_smoke"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-12"
workbook: "wiki/range/netfor/CH_NET12_Device_Topology/04_Multi_Service_Router/"

topology:
  nodes:
    - id: "h1"
      label: "Learner Workstation"
      type: "workstation"
      ip_offset: "21"
      ports: [22, 8080]
      services: ["OpenSSH", "Status"]
      x: 1
      y: 2
    - id: "r1"
      label: "Service Router"
      type: "router"
      ip_offset: "22"
      ports: [22, 8080]
      services: ["OpenSSH", "Connected routes"]
      x: 2
      y: 2
    - id: "svc1"
      label: "Flag Service"
      type: "server"
      ip_offset: "23"
      ports: [22, 80, 8080]
      services: ["OpenSSH", "HTTP flag"]
      x: 3
      y: 1
    - id: "svc2"
      label: "Status Service"
      type: "server"
      ip_offset: "24"
      ports: [22, 8080]
      services: ["OpenSSH", "Status"]
      x: 3
      y: 3
  edges:
    - from: "h1"
      to: "r1"
      label: "workstation link /29"
      access: "direct"
    - from: "r1"
      to: "svc1"
      label: "flag link /29"
      access: "routed"
    - from: "r1"
      to: "svc2"
      label: "status link /29"
      access: "routed"

test:
  steps:
    - name: "Router reports three links"
      command: "curl -s --connect-timeout 5 http://{target.r1}:8080/status | jq -r '.links | length'"
      expect: "3"
      timeout: 15

    - name: "Workstation uses the router"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} 'ip route | grep default' 2>&1"
      expect: "default via"
      timeout: 20

    - name: "Status service is reachable through the router"
      command: "IP=$(curl -s --connect-timeout 5 http://{target.r1}:8080/status | jq -r '.links[] | select(.peer==\"svc2\") | .peer_ip'); sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} \"wget -qO- http://$IP:8080/status\" 2>&1"
      expect: '"node": "svc2"'
      timeout: 30

    - name: "Flag service is reachable through the router"
      command: "IP=$(curl -s --connect-timeout 5 http://{target.r1}:8080/status | jq -r '.links[] | select(.peer==\"svc1\") | .peer_ip'); sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.h1} \"wget -qO- http://$IP/flag\" 2>&1"
      expect: "OCR{mult1_s3rv1c3_r0ut3}"
      timeout: 30
