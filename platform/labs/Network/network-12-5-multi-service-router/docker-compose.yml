x-ocr-topology:
  training_user: analyst
  training_password: "Topology2026"
  nodes:
    h1:
      service: h1
      role: host
    r1:
      service: r1
      role: router
    svc1:
      service: svc1
      role: service
      flag: "OCR{mult1_s3rv1c3_r0ut3}"
      http_port: 80
    svc2:
      service: svc2
      role: service
  links:
    - from: h1
      to: r1
    - from: r1
      to: svc1
    - from: r1
      to: svc2

services:
  h1:
    image: ocr-lab/topology-node:latest
    hostname: h1
    labels:
      ip_offset: "21"
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.20
    pids_limit: 96
    restart: unless-stopped

  r1:
    image: ocr-lab/topology-node:latest
    hostname: r1
    labels:
      ip_offset: "22"
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 96
    restart: unless-stopped

  svc1:
    image: ocr-lab/topology-node:latest
    hostname: svc1
    labels:
      ip_offset: "23"
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.20
    pids_limit: 96
    restart: unless-stopped
    environment:
      FLAG: "OCR{mult1_s3rv1c3_r0ut3}"

  svc2:
    image: ocr-lab/topology-node:latest
    hostname: svc2
    labels:
      ip_offset: "24"
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.20
    pids_limit: 96
    restart: unless-stopped
