# Authoritative DNS for the range.local lab zone.
# The stale record is deliberately outside the lab network so ping fails.

port=53
no-resolv
no-hosts
domain-needed
bogus-priv
local=/range.local/

# The ticket points at this stale name. 192.0.2.99 is TEST-NET-1.
address=/stale.range.local/192.0.2.99

# __SELF_IP__ is replaced at startup with this container's address, so the
# current portal follows the lab's per-student IP assignment.
address=/portal.range.local/__SELF_IP__

# Operational note: where the portal moved.
txt-record=_note.range.local,"The portal moved. Resolve portal.range.local, not stale.range.local."
