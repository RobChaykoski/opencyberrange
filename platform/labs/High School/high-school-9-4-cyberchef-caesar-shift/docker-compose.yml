services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: cyberchef-rot
    labels:
      ip_offset: "94"
    environment:
      LAB_MODE: "cyberchef_caesar"
      FLAG: "OCR{r0t13_is_not_s3cur3}"
      TITLE: "CyberChef Caesar Shift"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
