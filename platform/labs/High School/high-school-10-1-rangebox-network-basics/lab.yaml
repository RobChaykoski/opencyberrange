title: RangeBox Network Basics
category: network
difficulty: beginner
estimated_time: 25
prerequisites:
  - high-school-9-1-rangebox-first-steps
  - high-school-9-2-rangebox-file-hunt
# By completion students will be able to:
learning_outcomes:
  - Explain the difference between a hostname and an IP address
  - Request a URL with curl and read the status line
  - Inspect HTTP response headers
  - Run one bounded service observation against the assigned port
  - Describe why response metadata matters in investigations
mapped_skills:
  - network_systems
  - identity_access
  - web_api
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Discovery
    technique: T1016
    technique_name: System Network Configuration Discovery
    detection: Review host network-configuration and interface changes.

owner: "OpenCyberRange Curriculum"
content_version: "2.6.0"
reviewed_at: "2026-11-11"
review_status: "automated static proof; live walkthrough pending"
description: "Use the RangeBox terminal to talk to a small web service. Read a status code, inspect response headers, and find the training token that never appears in the page body."
visibility: public
counts_toward_certificate: true
flag: "OCR{h34d3rs_t3ll_st0r13s}"

tools:
  - rangebox
  - terminal
  - browser
  - nmap

scenario: |
  A small classroom service reports whether it is healthy. The page says very
  little, but the response headers carry a training token for this exercise.

  You will use RangeBox to ask the service for its status and then read the
  whole response, not just the body. This is a basic skill for web
  troubleshooting and incident triage.

  The service is fictional and isolated. You cannot affect anything outside the
  lab.

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Verify the account or device with a trusted adult, report suspicious activity, and keep software updated."
difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'beginner' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-11"
workbook: "wiki/range/high-school/CH_HS10_Grade_10_RangeBox_Basics/05_Network_Communication_and_Ports/"

hostnames:
  - ip_offset: "93"
    hostname: "network.lab"
    description: "RangeBox network-basics target (HTTP 8080)"

topology:
  nodes:
    - id: "network"
      label: "RangeBox network-basics target"
      type: "server"
      ip_offset: "93"
      ports: [8080]
      services: ["http"]
      x: 1
      y: 1

hints:
  - text: |
      Launch RangeBox and open a terminal. Ask the service for its status:

      curl -i http://network.lab:8080/status.json

      The -i option tells curl to include the response headers.
    unlock_after_minutes: 0

  - text: |
      Read the response from top to bottom:

      1. The status line, for example HTTP/1.1 200 OK
      2. The headers, one per line
      3. A blank line
      4. The response body

      Look for a header named X-OCR-Token.
    unlock_after_minutes: 8

  - text: |
      If the header is hard to read, filter for it:

      curl -s -D - -o /dev/null http://network.lab:8080/status.json | grep -i x-ocr-token

      The value after the colon is the training token.
    unlock_after_minutes: 15

test:
  steps:
    - name: "Status endpoint responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.network}:8080/status.json"
      expect: "200"
      timeout: 20

    - name: "Response includes the training-token header"
      command: >-
        curl -s -D - -o /dev/null http://{target.network}:8080/status.json
        | python3 -c "import sys; print(next(line.split(':', 1)[1].strip() for line in sys.stdin if line.lower().startswith('x-ocr-token:')))"
      expect: "OCR{h34d3rs_t3ll_st0r13s}"
      timeout: 20
