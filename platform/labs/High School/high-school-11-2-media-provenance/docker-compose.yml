services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: provenance
    labels:
      ip_offset: "88"
    environment:
      LAB_MODE: "provenance"
      FLAG: "OCR{provenance_beats_visual_tells}"
      TITLE: "Media Provenance"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
