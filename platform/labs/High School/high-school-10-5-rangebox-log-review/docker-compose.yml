services:
  events:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: rangebox-events
    labels:
      ip_offset: "100"
    environment:
      LAB_MODE: "logs"
      FLAG: "OCR{l0gs_ar3_3v1d3nc3}"
      TITLE: "RangeBox Log Review"
      TARGET_HOST: "events.lab"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
