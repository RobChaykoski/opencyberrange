services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: cyberchef-layers
    labels:
      ip_offset: "95"
    environment:
      LAB_MODE: "cyberchef_layers"
      FLAG: "OCR{l4y3r5_ar3_not_s3curity}"
      TITLE: "CyberChef Layered Message"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
