services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: crypto
    labels:
      ip_offset: "89"
    environment:
      LAB_MODE: "rugpull"
      FLAG: "OCR{follow_the_liquidity_not_the_hype}"
      TITLE: "Crypto Rug Pull"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
