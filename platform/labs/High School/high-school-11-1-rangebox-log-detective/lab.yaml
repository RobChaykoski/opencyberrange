title: RangeBox Log Detective
category: network
difficulty: beginner
estimated_time: 20
prerequisites:
  - high-school-10-1-rangebox-network-basics
  - high-school-10-2-rangebox-browser-and-source
# By completion students will be able to:
learning_outcomes:
  - Read a web server access log
  - Compare successful and failed requests
  - Spot a repeated source address probing for admin pages
  - Recover the training token and explain the evidence
mapped_skills:
  - incident_forensics
  - network_systems
assessment_criteria:
  - Submit the correct flag.
  - Pass every automated test step in the lab manifest.
mitre_attack:
  - tactic: Discovery
    technique: T1046
    technique_name: Network Service Discovery
    detection: Monitor IDS/flow logs for service and port scanning.

owner: "OpenCyberRange Curriculum"
content_version: "2.5.3"
reviewed_at: "2026-11-08"
review_status: "automated static proof; live walkthrough pending"
description: "Read a small web server access log, spot the probing requests, and recover the training token from the one request that should never have succeeded."
visibility: public
flag: "OCR{l0gs_t3ll_th3_st0ry}"

tools:
  - rangebox
  - browser
  - terminal

scenario: |
  A classroom web service keeps a short access log. Most of the entries are
  ordinary page views from the practice network. A few requests stand out:
  repeated failures from one address, followed by a request with an unusual
  query string.

  You will read the log, separate normal traffic from probing, and explain what
  the evidence shows. This is defensive work: you are not attacking the service,
  you are interpreting what it already recorded.

  The service and the log are fictional and isolated.

troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Verify the account or device with a trusted adult, report suspicious activity, and keep software updated."
difficulty_evidence: "Static student-tester walkthrough of the workbook and lab definition; live lab run not recorded; declared difficulty 'beginner' retained as provisional."
difficulty_evidence_source: "reviewer_walkthrough"
difficulty_evidence_sample: 1
difficulty_evidence_quality: "provisional"
difficulty_evidence_reviewed_at: "2026-11-08"
workbook: "wiki/range/high-school/CH_HS11_Grade_11_Defensive_Security/01_Log_Detective/"

hostnames:
  - ip_offset: "95"
    hostname: "logs.lab"
    description: "RangeBox log-analysis target (HTTP 8080)"

topology:
  nodes:
    - id: "logs"
      label: "RangeBox log-analysis target"
      type: "server"
      ip_offset: "95"
      ports: [8080]
      services: ["http"]
      x: 1
      y: 1

hints:
  - text: |
      Launch RangeBox and open the lab browser or a terminal. Fetch the log:

      curl http://logs.lab:8080/access.log
    unlock_after_minutes: 0

  - text: |
      A web access log records the source address, time, request, status code,
      response size, and user agent. Start by looking at the status codes.

      Most normal requests return **200**. Requests that were not found return
      **404**.
    unlock_after_minutes: 6

  - text: |
      Filter the log to show only the failed requests:

      grep " 404 " access.log

      Notice which source address appears repeatedly and what paths it tried.
    unlock_after_minutes: 12

  - text: |
      One request from that same source address returned **200** instead of
      **404**. It carries a training token in the query string.

      Collect the token in `OCR{...}` format and submit it as the flag.
    unlock_after_minutes: 18

test:
  steps:
    - name: "Access log responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.logs}:8080/access.log"
      expect: "200"
      timeout: 20

    - name: "Log contains the training token"
      command: "curl -s http://{target.logs}:8080/access.log | grep -o 'OCR{l0gs_t3ll_th3_st0ry}'"
      expect: "OCR{l0gs_t3ll_th3_st0ry}"
      timeout: 20
