services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: mfa
    labels:
      ip_offset: "87"
    environment:
      LAB_MODE: "mfa_recovery"
      FLAG: "OCR{recovery_is_part_of_mfa}"
      TITLE: "MFA and the Lost Phone"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
