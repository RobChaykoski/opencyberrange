title: Pivot to a Local-Only Service
category: post-exploitation
difficulty: advanced
estimated_time: 120
prerequisites:
- metasploit-2-2-database-credentials
# By completion students will be able to:
learning_outcomes:
- Identify the local-only service and explain why it is not externally reachable.
- Connect to a Meterpreter session on the target.
- Configure a local port forward through the session.
- Retrieve the flag from the forwarded service.
- Document the forward and remove it after collecting evidence.
