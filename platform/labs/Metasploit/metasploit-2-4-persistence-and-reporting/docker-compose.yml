x-ocr-requires-kvm: true
x-ocr-reviewed-image: ocr-metasploitable2:latest
services:
  target:
    image: ocr-metasploitable2:latest
    hostname: msf-target
    labels:
      ip_offset: "10"
    environment:
      LAB_FLAG: "OCR{msf_report_3e8b}"
      LAB_PROFILE: "root"
    devices:
      - /dev/kvm:/dev/kvm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
