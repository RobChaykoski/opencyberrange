title: Auxiliary Service Discovery
category: reconnaissance
difficulty: beginner
estimated_time: 90
prerequisites:
- metasploit-1-1-workspace-and-modules
# By completion students will be able to:
learning_outcomes:
- Perform a TCP port scan with a Metasploit auxiliary module.
- Identify SSH, FTP, HTTP, and MySQL versions with service-specific scanners.
- Document the discovered services in the workspace database.
- Explain why version evidence matters before exploitation.
- Retrieve the web flag from the target.
mapped_skills:
- network_systems
- identity_access
assessment_criteria:
- Submit the correct flag.
- Record the commands and observations requested in the workbook.
- Explain the defensive lesson in your own words.
