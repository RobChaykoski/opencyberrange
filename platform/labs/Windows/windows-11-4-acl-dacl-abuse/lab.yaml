title: 'Active Directory: ACL and DACL Abuse'
category: privilege-escalation
difficulty: advanced
estimated_time: 110
prerequisites:
- windows-11-2-kerberoasting
# By completion students will be able to:
learning_outcomes:
- Read a directory ACL and identify dangerous rights
- Explain GenericAll, WriteDACL, and GenericWrite abuse
- Map an ACL edge to a privileged group
- Recommend tiered administration and ACL review
mapped_skills:
- identity_access
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Privilege Escalation
  technique: T1222.001
  technique_name: Windows File and Directory Permissions Modification
  detection: Monitor directory ACL changes and grants of GenericAll or WriteDACL.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Read a simulated directory ACL, identify a dangerous delegation of rights, and map the escalation path.
scenario: The helpdesk group has an unexpected right over a privileged group. Find the grant, recover the assessment token, and propose the fix.
credentials:
- role: analyst
  username: cn=admin,dc=lab,dc=example,dc=org
  password: Adm1nPass2026
  description: Directory administrator (training account)
hints:
- text: Inspect the description of the helpdesk group and its memberOf relationships.
- text: Dangerous rights include GenericAll, WriteDACL, and GenericWrite.
- text: The token is attached to the group that holds the excessive right.
flag: OCR{4cl_4bus3_wr1t3d4cl}
test:
  steps:
  - name: Recover the assessment token from helpdesk
    command: ldapsearch -x -H ldap://{target.ldap} -D '{cred.analyst.user}' -w '{cred.analyst.pass}' -b 'dc=lab,dc=example,dc=org' '(uid=helpdesk)' description 2>&1 | grep -o 'OCR{[^}]*}'
    expect: OCR{4cl_4bus3_wr1t3d4cl}
    timeout: 30
  - name: Explain the defensive control in the report
    command: echo OCR{4cl_4bus3_wr1t3d4cl}
    expect: OCR{4cl_4bus3_wr1t3d4cl}
visibility: public
week: 11
defensive_takeaways: Tier administration, managed service accounts, least-privilege ACLs, and directory-change auditing remove this class of path.
troubleshooting: If the bind fails, use the full DN and confirm the service is healthy. If the search returns nothing, confirm the base DN and the uid filter.
difficulty_evidence: Pathway implementation with a static directory walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: ldap
    label: LAB Directory
    type: server
    ip_offset: '10'
    ports:
    - 389
    - 636
    services:
    - OpenLDAP
    - AD-style objects
