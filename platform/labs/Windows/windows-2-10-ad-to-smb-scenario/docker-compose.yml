services:
  ldap:
    image: osixia/openldap:1.5.0
    hostname: ldap
    labels:
      ip_offset: "10"
    environment:
      LDAP_ORGANISATION: "LAB"
      LDAP_DOMAIN: "lab.example.org"
      LDAP_ADMIN_PASSWORD: "Adm1nPass2026"
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: /seed
    volumes:
      - ./ldap:/seed:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    restart: unless-stopped

  files:
    build:
      context: ./containers/files
      dockerfile: Dockerfile
    hostname: files
    labels:
      ip_offset: "20"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    restart: unless-stopped

volumes:
  ldap_data:
  ldap_config:
