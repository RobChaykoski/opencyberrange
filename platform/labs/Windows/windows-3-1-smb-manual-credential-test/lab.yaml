credentials:
  - username: "admin"
    password: "password"
    role: "smb-user"
    description: "SMB authenticated user"

test:
  steps:
    - name: "Verify SMB port 445 is open"
      command: "nmap -Pn -p 445 {target.target} | grep '445/tcp'"
      expect: "open"

    - name: "Authenticate to SMB with valid credentials"
      command: "smbclient //{target.target}/private -U '{cred.smb-user.user}%{cred.smb-user.pass}' -c 'ls' 2>&1"
      expect: "flag.txt"

    - name: "Retrieve flag from SMB private share"
      command: "smbclient //{target.target}/private -U '{cred.smb-user.user}%{cred.smb-user.pass}' -c 'get flag.txt -' 2>&1"
      expect: "OCR{"
