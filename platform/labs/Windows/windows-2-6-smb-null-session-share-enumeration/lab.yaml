test:
  steps:
    - name: "Verify SMB port 445 is open"
      command: "nmap -Pn -p 445 {target.target} | grep '445/tcp'"
      expect: "open"

    - name: "Enumerate shares via null session using smbclient"
      command: "smbclient -L //{target.target} -N 2>&1"
      expect: "admin_backup"

    - name: "Enumerate shares via rpcclient null session"
      command: "rpcclient -U '' -N {target.target} -c 'netshareenum' 2>&1"
      expect: "public"

    - name: "Retrieve flag from share listing comments"
      command: "smbclient -L //{target.target} -N 2>&1"
      expect: "OCR{"
