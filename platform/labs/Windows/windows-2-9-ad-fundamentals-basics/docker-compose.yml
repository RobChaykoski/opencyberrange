services:
  ldap:
    build:
      context: ./containers/ldap
      dockerfile: Dockerfile
    hostname: ldap
    labels:
      ip_offset: "10"
    environment:
      LDAP_ORGANISATION: "LAB"
      LDAP_DOMAIN: "lab.example.org"
      LDAP_ADMIN_PASSWORD: "Adm1nPass2026"
      LDAP_TLS: "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    restart: unless-stopped

volumes:
  ldap_data:
  ldap_config:
