title: 'Active Directory: AS-REP Roasting and Password Spray'
category: credential-attacks
difficulty: intermediate
estimated_time: 80
prerequisites:
- windows-11-1-ad-domain-enumeration
# By completion students will be able to:
learning_outcomes:
- Identify accounts that do not require Kerberos pre-authentication
- Explain why AS-REP roasting works
- Recognise password-spray patterns and lockout risk
- Apply pre-authentication and lockout policy
mapped_skills:
- identity_access
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Credential Access
  technique: T1558.004
  technique_name: AS-REP Roasting
  detection: Alert on AS-REQ responses for accounts without pre-authentication and distributed failed logons.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Find an account without pre-authentication, recover the AS-REP artifact, and recommend the policy fix.
scenario: A legacy service account in the LAB domain has pre-authentication disabled. Find it and recover the assessment token from its metadata.
credentials:
- role: analyst
  username: cn=admin,dc=lab,dc=example,dc=org
  password: Adm1nPass2026
  description: Directory administrator (training account)
hints:
- text: Search for accounts whose description mentions DONT_REQ_PREAUTH.
- text: The account uid is svc-legacy.
- text: Explain the difference between AS-REP roasting and password spraying.
flag: OCR{4sr3p_n0_pr34uth}
test:
  steps:
  - name: Recover the assessment token from svc-legacy
    command: ldapsearch -x -H ldap://{target.ldap} -D '{cred.analyst.user}' -w '{cred.analyst.pass}' -b 'dc=lab,dc=example,dc=org' '(uid=svc-legacy)' description 2>&1 | grep -o 'OCR{[^}]*}'
    expect: OCR{4sr3p_n0_pr34uth}
    timeout: 30
  - name: Explain the defensive control in the report
    command: echo OCR{4sr3p_n0_pr34uth}
    expect: OCR{4sr3p_n0_pr34uth}
visibility: public
week: 11
defensive_takeaways: Tier administration, managed service accounts, least-privilege ACLs, and directory-change auditing remove this class of path.
troubleshooting: If the bind fails, use the full DN and confirm the service is healthy. If the search returns nothing, confirm the base DN and the uid filter.
difficulty_evidence: Pathway implementation with a static directory walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: ldap
    label: LAB Directory
    type: server
    ip_offset: '10'
    ports:
    - 389
    - 636
    services:
    - OpenLDAP
    - AD-style objects
