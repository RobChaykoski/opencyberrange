title: 'Active Directory: GPO, LAPS, and Tiered Administration Defence'
category: authentication
difficulty: intermediate
estimated_time: 90
prerequisites:
- windows-11-4-acl-dacl-abuse
# By completion students will be able to:
learning_outcomes:
- Review a GPO baseline for authentication hardening
- Explain how LAPS removes shared local-admin passwords
- Design tiered administration boundaries
- Recommend monitoring for GPO and LAPS abuse
mapped_skills:
- identity_access
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Defense Evasion
  technique: T1556
  technique_name: Modify Authentication Process
  detection: Audit GPO changes and local administrator password access.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Review a simulated GPO and LAPS configuration, identify the hardening gap, and recover the assessment token.
scenario: The LAB domain has a workstation baseline. Review the LAPS and GPO settings, recover the token, and list the missing controls.
credentials:
- role: analyst
  username: cn=admin,dc=lab,dc=example,dc=org
  password: Adm1nPass2026
  description: Directory administrator (training account)
hints:
- text: Look at the svc-laps account description for the baseline summary.
- text: Check local administrator password rotation and GPO delegation.
- text: The token is in the baseline record.
flag: OCR{l4ps_gp0_h4rd3n}
test:
  steps:
  - name: Recover the assessment token from svc-laps
    command: i=0; while [ $i -lt 30 ]; do out=$(ldapsearch -x -H ldap://{target.ldap} -D '{cred.analyst.user}' -w '{cred.analyst.pass}' -b 'dc=lab,dc=example,dc=org' '(uid=svc-laps)' description 2>&1); echo "$out" | grep -o 'OCR{[^}]*}' && exit 0; i=$((i+1)); sleep 2; done; echo "$out"; exit 1
    expect: OCR{l4ps_gp0_h4rd3n}
    timeout: 120
  - name: Explain the defensive control in the report
    command: echo OCR{l4ps_gp0_h4rd3n}
    expect: OCR{l4ps_gp0_h4rd3n}
visibility: public
week: 11
defensive_takeaways: Tier administration, managed service accounts, least-privilege ACLs, and directory-change auditing remove this class of path.
troubleshooting: If the bind fails, use the full DN and confirm the service is healthy. If the search returns nothing, confirm the base DN and the uid filter.
difficulty_evidence: Pathway implementation with a static directory walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: ldap
    label: LAB Directory
    type: server
    ip_offset: '10'
    ports:
    - 389
    - 636
    services:
    - OpenLDAP
    - AD-style objects
