hostnames:
  - ip_offset: "10"
    hostname: "windows-target.lab"
    description: "FinanceCorp service simulator (HTTP 80, SMB 445, RDP 3389)"
  - ip_offset: "11"
    hostname: "shell.lab"
    description: "Browser terminal with nmap, curl, and ping (HTTP 7681)"

topology:
  nodes:
    - id: "target"
      label: "FinanceCorp Windows target"
      type: "server"
      ip_offset: "10"
      ports: [80, 445, 3389]
      services: ["http", "smb", "rdp"]
      x: 1
      y: 1
    - id: "shell"
      label: "Range shell"
      type: "workstation"
      ip_offset: "11"
      ports: [7681]
      services: ["http"]
      x: 2
      y: 1

test:
  steps:
    - name: "Verify multiple ports are open (445, 3389, 80)"
      command: "nmap -Pn -p 80,445,3389 {target.target} | grep 'open'"
      expect: "open"

    - name: "Confirm HTTP service on port 80"
      command: "nmap -Pn -p 80 {target.target} | grep '80/tcp'"
      expect: "open"

    - name: "Confirm SMB service on port 445"
      command: "nmap -Pn -p 445 {target.target} | grep '445/tcp'"
      expect: "open"

    - name: "Confirm HTTP service serves content"
      command: "curl -s http://{target.target}/"
      expect: "flag"

    - name: "Retrieve flag via HTTP"
      command: "curl -s http://{target.target}/flag.txt"
      expect: "OCR{"
