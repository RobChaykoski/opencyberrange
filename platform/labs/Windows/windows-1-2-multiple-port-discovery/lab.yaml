description: Continuing your FinanceCorp assessment, start with a focused scan of the exposed Windows service ports, retrieve the flag, then compare the focused result with a broader scan.
scenario: |
  Continuing your penetration test for FinanceCorp, your initial port scan revealed
  that the Windows server is running multiple services. James Mitchell wants an
  inventory of the exposed services, starting with the ports a Windows server
  commonly exposes.

  Start with the focused list so you get a result quickly:

  ```bash
  nmap -Pn -p 80,445,3389 <target>
  curl http://<target>/flag.txt
  ```

  Replace `<target>` with the address in **Active Lab View**. The full-range scan
  is an optional comparison after you have the flag; it is not required to finish
  the exercise. The target is a deterministic service simulator: port 80 serves
  the flag, while 445 and 3389 are open for discovery practice.


flag: "OCR{mult1pl3_p0rts}"

hints:
  - text: |
      **Start here (5 minutes)**

      Launch the lab, copy the target from **Active Lab View**, then run:

      ```bash
      nmap -Pn -p 80,445,3389 <target>
      curl http://<target>/flag.txt
      ```

      The focused scan returns quickly and shows the three exposed ports. The
      flag is on the HTTP service. If the scan says the host is down, keep `-Pn`
      and confirm the target is **Running**.
    unlock_after_minutes: 0

  - text: |
      **Multi-port scanning** expands beyond single-port reconnaissance to discover all services running on a target system. Windows servers often run multiple services simultaneously, each on different ports.

      **Common Windows service ports:**
      - Port 80/443: HTTP/HTTPS (web services)
      - Port 445: SMB (file sharing)
      - Port 3389: RDP (remote desktop)
      - Port 135: RPC (remote procedure calls)
      - Port 5985/5986: WinRM (Windows Remote Management)
      - Port 1433: MS-SQL (database)
      - Port 389/636: LDAP (directory services)

      Your goal is to discover the exposed ports on the FinanceCorp Windows
      server and explain what each one represents.
    unlock_after_minutes: 3

  - text: |
      **nmap port scanning strategies** vary based on thoroughness vs speed requirements:

      **Common scanning approaches:**
      - **Top ports**: Scan the most common 100/1000 ports (fast)
      - **Specific range**: Scan ports 1-1000 or other custom ranges
      - **Full scan**: All 65535 ports (slow but comprehensive)
      - **Service-specific**: Target known Windows service ports

      For this lab, start with the focused list `80,445,3389`; the full range is
      an optional comparison after you have the flag.
    unlock_after_minutes: 6

  - text: |
      **nmap port specification flags** control which ports to scan:

      ```bash
      nmap -p <port_spec> <target>
      ```

      **Port specification options:**
      - `-p 80`: Single port
      - `-p 80,443,445`: Multiple specific ports
      - `-p 1-1000`: Port range
      - `-p-`: All 65535 ports (same as `-p 1-65535`)
      - `--top-ports 100`: Most common 100 ports
      - `-p U:161,T:80-443`: UDP and TCP ports

      Example: `nmap -Pn -p 80,445,3389 <target>`
    unlock_after_minutes: 10

  - text: |
      For Windows servers, scan common service ports:

      ```bash
      nmap -p 80,135,139,445,3389,5985 <target>
      ```

      Or scan a broader range to catch all common services:

      ```bash
      nmap -p 1-10000 <target>
      ```

      **Additional useful flags:**
      - `-Pn`: Skip ping (assume host is up)
      - `-v`: Verbose output (shows ports as found)
      - `-T4`: Faster timing (aggressive)

      Example: `nmap -p 1-10000 -Pn -v <target>`
    unlock_after_minutes: 15

  - text: |
      To scan the FinanceCorp Windows server for multiple ports:

      ```bash
      nmap -p 1-10000 <target>
      ```

      This command:
      - Scans ports 1 through 10000
      - Covers all common Windows services
      - Identifies which ports are open
      - Reports service names for recognized ports

      For the fastest scan of just Windows services:

      ```bash
      nmap -Pn -p 80,135,139,445,3389,5985,1433,389 <target>
      ```
    unlock_after_minutes: 20

  - text: |
      nmap output shows all discovered open ports:

      ```
      PORT     STATE SERVICE
      80/tcp   open  http
      135/tcp  open  msrpc
      445/tcp  open  microsoft-ds
      3389/tcp open  ms-wbt-server
      ```

      **Interpret the results:**
      - **PORT**: Port number and protocol (TCP/UDP)
      - **STATE**: Port status (open, closed, filtered)
      - **SERVICE**: nmap's guess at the service name

      **Count the open ports** - the flag relates to discovering multiple services. Each open port represents a potential attack vector. Document all discovered ports for the next assessment phase.
    unlock_after_minutes: 25

  - text: |
      **If you only have ten minutes**

      Run the focused scan, then retrieve the flag:

      ```bash
      nmap -Pn -p 80,445,3389 <target>
      curl http://<target>/flag.txt
      ```

      The full `nmap -p-` comparison is optional. It is useful for the analysis
      questions, but it is not required to submit the flag.
    unlock_after_minutes: 10
troubleshooting: "If the target is unreachable, confirm the lab is running and use the hostname shown in the exercise. If a command returns an unexpected error, check the port, path, and credentials before assuming the technique failed. Report a persistent technical failure to the instructor so it is not mistaken for learning difficulty."
defensive_takeaways: "Require MFA and least privilege on the exposed service, monitor authentication and lateral-movement events, and remove anonymous or default access. In this lab, apply that to multiple port discovery and record the evidence before recommending the fix."
difficulty_evidence: "Test101 reported n=6 and 9.7% completion. The brief was reordered around a focused 80,445,3389 scan, the estimated time was reduced from 120 to 35 minutes, the heavy Samba/xrdp/nginx image was replaced with a deterministic three-listener target, and the full-range scan was made optional."
