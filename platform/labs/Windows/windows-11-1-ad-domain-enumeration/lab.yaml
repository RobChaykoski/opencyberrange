title: 'Active Directory: Domain Enumeration and Attack-Path Mapping'
category: enumeration
difficulty: beginner
estimated_time: 60
prerequisites:
- windows-2-9-ad-fundamentals-basics
# By completion students will be able to:
learning_outcomes:
- Bind to a directory and enumerate users, groups, and computers
- Identify service accounts and their group membership
- Map a path from a low-privilege account to a privileged group
- Record the evidence needed for a defensive report
mapped_skills:
- identity_access
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Discovery
  technique: T1087
  technique_name: Account Discovery
  detection: Alert on directory searches that enumerate users, groups, and service accounts at scale.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Enumerate an AD-style directory, identify service accounts, and map one attack path to a privileged group.
scenario: The range hosts a simulated LAB domain. You have a training analyst account. Enumerate the directory, find the service account, and recover the assessment token from its description.
credentials:
- role: analyst
  username: cn=admin,dc=lab,dc=example,dc=org
  password: Adm1nPass2026
  description: Directory administrator (training account)
hints:
- text: The base DN is dc=lab,dc=example,dc=org. Users are under ou=People.
- text: ldapsearch -x -H ldap://{target.ldap} -D '{cred.analyst.user}' -w '{cred.analyst.pass}' -b 'dc=lab,dc=example,dc=org' '(uid=svc-sql)' description
- text: Read the description attribute; careless documentation often leaks the token.
flag: OCR{4d_d0m41n_3num}
test:
  steps:
  - name: Recover the assessment token from svc-sql
    command: ldapsearch -x -H ldap://{target.ldap} -D '{cred.analyst.user}' -w '{cred.analyst.pass}' -b 'dc=lab,dc=example,dc=org' '(uid=svc-sql)' description 2>&1 | grep -o 'OCR{[^}]*}'
    expect: OCR{4d_d0m41n_3num}
    timeout: 30
  - name: Explain the defensive control in the report
    command: echo OCR{4d_d0m41n_3num}
    expect: OCR{4d_d0m41n_3num}
visibility: public
week: 11
defensive_takeaways: Tier administration, managed service accounts, least-privilege ACLs, and directory-change auditing remove this class of path.
troubleshooting: If the bind fails, use the full DN and confirm the service is healthy. If the search returns nothing, confirm the base DN and the uid filter.
difficulty_evidence: Pathway implementation with a static directory walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: ldap
    label: LAB Directory
    type: server
    ip_offset: '10'
    ports:
    - 389
    - 636
    services:
    - OpenLDAP
    - AD-style objects
