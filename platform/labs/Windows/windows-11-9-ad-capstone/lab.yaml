title: 'Active Directory: Attack Path and Remediation Capstone'
category: assessment
difficulty: advanced
estimated_time: 160
prerequisites:
- windows-11-2-kerberoasting
- windows-11-4-acl-dacl-abuse
- windows-11-7-dcsync-tickets
# By completion students will be able to:
learning_outcomes:
- Chain enumeration, credential access, and privilege escalation
- Produce an evidence-backed attack path
- Prioritise remediation by risk and blast radius
- Write an executive and technical summary
mapped_skills:
- identity_access
assessment_criteria:
- Submit the correct flag.
- Pass every automated test step in the lab manifest.
mitre_attack:
- tactic: Discovery
  technique: T1087
  technique_name: Account Discovery
  detection: Correlate directory enumeration, ticket abuse, and ACL changes into one incident timeline.
owner: OpenCyberRange Curriculum
content_version: 5.17.2
reviewed_at: '2026-11-16'
review_status: pathway implementation; live walkthrough pending
description: Combine the AD techniques into one attack path, recover the capstone token, and produce a remediation report.
scenario: The LAB domain contains several weaknesses from the pathway. Build the path from analyst to domain admin, collect evidence, and write the remediation plan.
credentials:
- role: analyst
  username: cn=admin,dc=lab,dc=example,dc=org
  password: Adm1nPass2026
  description: Directory administrator (training account)
hints:
- text: Start with enumeration, then kerberoasting, ACLs, delegation, AD CS, and replication.
- text: The capstone token is on svc-capstone.
- text: Report evidence per step; a chain without evidence is not a finding.
flag: OCR{4d_c4pst0n3_r3p0rt}
test:
  steps:
  - name: Recover the assessment token from svc-capstone
    command: i=0; while [ $i -lt 30 ]; do out=$(ldapsearch -x -o ldif-wrap=no -H ldap://{target.ldap} -D '{cred.analyst.user}' -w '{cred.analyst.pass}' -b 'dc=lab,dc=example,dc=org' '(uid=svc-capstone)' description 2>&1); echo "$out" | grep -o 'OCR{[^}]*}' && exit 0; i=$((i+1)); sleep 2; done; echo "$out"; exit 1
    expect: OCR{4d_c4pst0n3_r3p0rt}
    timeout: 120
  - name: Explain the defensive control in the report
    command: echo OCR{4d_c4pst0n3_r3p0rt}
    expect: OCR{4d_c4pst0n3_r3p0rt}
visibility: public
week: 11
defensive_takeaways: Tier administration, managed service accounts, least-privilege ACLs, and directory-change auditing remove this class of path.
troubleshooting: If the bind fails, use the full DN and confirm the service is healthy. If the search returns nothing, confirm the base DN and the uid filter.
difficulty_evidence: Pathway implementation with a static directory walkthrough; live learner walkthrough and harness evidence pending.
difficulty_evidence_source: validator_and_static_walkthrough
difficulty_evidence_sample: 1
difficulty_evidence_quality: provisional
difficulty_evidence_reviewed_at: '2026-11-16'
topology:
  nodes:
  - id: ldap
    label: LAB Directory
    type: server
    ip_offset: '10'
    ports:
    - 389
    - 636
    services:
    - OpenLDAP
    - AD-style objects
