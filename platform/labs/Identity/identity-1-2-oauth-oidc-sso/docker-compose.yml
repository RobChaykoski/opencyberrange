services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: identity-oauth
    labels:
      ip_offset: "92"
    environment:
      LAB_MODE: "oauth"
      FLAG: "OCR{redirect_uri_trust_is_not_authentication}"
      TITLE: "OAuth/OIDC: Redirects, State, and Token Trust"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
