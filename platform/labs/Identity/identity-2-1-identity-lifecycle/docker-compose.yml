services:
  portal:
    mem_limit: 128m
    cpus: 0.15
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    build:
      context: ../_shared
      dockerfile: Dockerfile
    hostname: identity-life
    labels:
      ip_offset: "93"
    environment:
      LAB_MODE: "lifecycle"
      FLAG: "OCR{leavers_keep_access_until_you_revoke_it}"
      TITLE: "Identity Lifecycle"
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
