services:
  db:
    image: postgres:15-alpine
    container_name: ocr-db
    entrypoint: ["/usr/local/bin/ensure-db-password.sh"]
    # Overriding entrypoint clears the image CMD, so the server argument
    # must come back explicitly or docker-entrypoint.sh starts nothing
    # and the container exits before a single log line.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-2GB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-32MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-200}"
      - "-c"
      - "idle_in_transaction_session_timeout=${PG_IDLE_TX_TIMEOUT:-60s}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpass}
      POSTGRES_DB: ${POSTGRES_DB:-labdb}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/ensure-db-password.sh:/usr/local/bin/ensure-db-password.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labuser} -d ${POSTGRES_DB:-labdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    # Valkey is the BSD-3-Clause fork of Redis 7.2 and is RESP-compatible.
    image: valkey/valkey:9.1.3-alpine
    container_name: ocr-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  docker-socket-proxy:
    # The proxy is unauthenticated HTTP on 2375. Only the backend joins the
    # docker_control network; lab containers and the frontend stay off it.
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ocr-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      POST: 1
      EXEC: 1
      BUILD: 0
    networks:
      - docker_control
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    # The bind-mounted tree is owned by the host user; run as that user so
    # /app/backups and the workbook volume stay writable.
    user: "${OCR_UID:-1000}:${OCR_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://labuser:labpass@db:5432/labdb}
      JWT_SECRET: ${JWT_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT}
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY}
      WG_API_URL: ${WG_API_URL}
      WG_API_KEY: ${WG_API_KEY}
      WG_ENCRYPTION_KEY: ${WG_ENCRYPTION_KEY}
      WG_ENCRYPTION_KEY_PREVIOUS: ${WG_ENCRYPTION_KEY_PREVIOUS:-}
      WG_NETWORK_BASE: ${WG_NETWORK_BASE:-10.100}
      WG_CLIENT_BASE: ${WG_CLIENT_BASE:-10.255}
      LABS_HOST_PATH: ${LABS_HOST_PATH}
      SERVER_PUBLIC_HOST: ${SERVER_PUBLIC_HOST:-localhost}
      # Stable external origin used to build SSO callback URLs. Leave blank to
      # fall back to SERVER_PUBLIC_HOST.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # The dev stack serves HTTPS with a self-signed certificate, so the OIDC
      # discovery/token calls must accept that certificate.
      SSO_ALLOW_INSECURE_HTTP: ${SSO_ALLOW_INSECURE_HTTP:-false}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-privacy@example.org}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost}
      # Report plots are generated headlessly; never probe for a display.
      MPLBACKEND: Agg
      OCR_UVICORN_WORKERS: ${OCR_UVICORN_WORKERS:-1}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://valkey:6379/0}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      TZ: UTC
    volumes:
      - ./backend:/app
      - ${LABS_HOST_PATH}:/labs:ro
      - workbook_data:/workbook
      # Exercise Studio template catalog lives outside the backend build
      # context, so it is mounted in read-only. (The Studio publish-gate
      # linters are baked into the backend image, not mounted.)
      - ./templates:/app/templates:ro
      - ./curriculum-manifest.yaml:/app/curriculum-manifest.yaml:ro
      - ./curriculum-frameworks.yaml:/app/curriculum-frameworks.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - default
      - docker_control
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The user manual and workbook wiki are built into this volume by the
      # wiki-builder. The source image carries only a placeholder.
      - wiki_data:/usr/share/nginx/wiki:ro
      # Self-signed TLS: the entrypoint enables HTTPS when these files exist.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Works with both HTTP-only and self-signed HTTPS deployments.
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/ -o /dev/null || curl -fsSk http://127.0.0.1/ -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --- Optional SSO stack (profile: sso) ---
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ocr-ldap
    profiles: ["sso"]
    environment:
      LDAP_ORGANISATION: "SWOCTS Cyber Range"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: ${SSO_LDAP_ADMIN_PASSWORD:-SsoDemoAdmin!2026}
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ${SSO_DIR:-./deploy/sso}/openldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif
    restart: unless-stopped

  dex:
    image: ghcr.io/dexidp/dex:v2.42.0
    container_name: ocr-dex
    profiles: ["sso"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ${SSO_DIR:-./deploy/sso}/dex/runtime/config.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  workbook_data:
  wiki_data:
  ldap_data:
  ldap_config:

networks:
  docker_control:
    internal: true
