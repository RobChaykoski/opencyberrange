# Security headers for the LTI Deep Linking picker.
#
# The picker runs inside the institution's LMS iframe and posts a signed
# LtiDeepLinkingResponse back to that LMS, so it needs a different policy from
# the rest of the SPA:
#   - frame-ancestors https: lets an HTTPS LMS embed it; every other SPA page
#     keeps frame-ancestors 'self'.
#   - form-action 'self' https: allows the return POST to the LMS deep-link
#     return URL. The URL itself is validated server-side and again with
#     safeHttpUrl before submission.
# X-Frame-Options is intentionally omitted: it cannot express an allow-list and
# would block the LMS frame in browsers that prefer it over frame-ancestors.
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gcDMZ3reqFDcIeJU3IEsVra//K/ibAKdfKgN6qChfv4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors https:; base-uri 'self'; form-action 'self' https:;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
