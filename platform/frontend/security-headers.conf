# Security headers for the SPA document and deep-link fallback.
#
# nginx does not inherit server-level add_header directives into a location
# that declares any of its own. Include this file in every location that
# serves the SPA so CSP and the other controls are always present.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gcDMZ3reqFDcIeJU3IEsVra//K/ibAKdfKgN6qChfv4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
