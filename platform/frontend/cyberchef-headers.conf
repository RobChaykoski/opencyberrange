# Security headers for the self-hosted CyberChef build at /tools/cyberchef/.
#
# CyberChef is a static, same-origin page, but its build contains two inline
# scripts and creates blob: workers. The rest of the policy stays as strict as
# the SPA. The two script hashes are pinned to CyberChef 11.5.0; if the version
# in platform/frontend/Dockerfile changes, recompute them from the release's
# CyberChef_v<version>.html and update this file in the same commit.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xxZfw3TFM4mFo5/gbZbzRpdAS6J4XjjcnSAHtoMZ6lw=' 'sha256-CapynVzvcZM11EyRQKFhBUd9OY4V+OMMZ2IcvIt43nE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
