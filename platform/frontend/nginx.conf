log_format no_tokens '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

# Cache wiki static assets (images/css/js) but keep HTML uncached, so a workbook
# edit shows immediately while images are not re-fetched on every page view.
# Consumed by the generated wiki location blocks via add_header Cache-Control.
map $uri $wiki_cache_control {
    default                                                     "no-cache, no-store, must-revalidate";
    # Fonts, CSS and JS are versioned with ?v=<hash> in mkdocs.yml, so a long
    # TTL is safe: a change moves the URL.
    "~*\.(css|js|woff2?|ttf|eot)$"                              "public, max-age=2592000";
    # Workbook figures are NOT versioned. Their filenames are stable and their
    # contents change on every rebuild, so a long TTL pins a stale screenshot at
    # the CDN for a month. That is exactly what happened after the Flask figures
    # were replaced: the origin held the new capture and Cloudflare kept serving
    # the old one with cf-cache-status HIT. Short TTL, revalidated.
    "~*\.(webp|png|jpe?g|gif|svg|ico)$"                         "public, max-age=300, must-revalidate";
}

# When a TLS-terminating reverse proxy is in front of the platform, preserve
# the public scheme it reports. Direct requests fall back to the local scheme.
map $http_x_forwarded_proto $ocr_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# OpenCyberRange is a private training platform. Refuse crawlers and AI
# scrapers by user agent as well as by robots.txt and X-Robots-Tag. This is
# defence in depth: the real control is authentication on every route.
# Keep this list in step with public/robots.txt and docs/ANTI-SCRAPING.md.
map $http_user_agent $ocr_blocked_crawler {
    default 0;
    "~*(GPTBot|OAI-SearchBot|ChatGPT-User|Google-Extended|ClaudeBot|Claude-Web|anthropic-ai|PerplexityBot|CCBot|Bytespider|Amazonbot|Applebot-Extended|Meta-ExternalAgent|Meta-ExternalFetcher|cohere-ai|YouBot|Diffbot|omgili|omgilibot|Scrapy|AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|Barkrowler|DataForSeoBot|Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|Qwantify|SeznamBot|NaverBot|Yeti|ia_archiver)" 1;
}

server {
    # Docker's embedded DNS. The optional Dex/SSO stack is resolved at
    # request time so nginx still starts when the sso profile is off.
    resolver 127.0.0.11 valid=10s;
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    if ($ocr_blocked_crawler) {
        return 403;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    
    # Content Security Policy for the Vue SPA.
    # script-src carries no 'unsafe-inline'/'unsafe-eval': the production build uses the
    # Vue runtime (templates precompiled by Vite, no in-browser eval), and the only inline
    # script is the theme bootstrap in index.html, allowed by the sha256 hash below.
    # If that inline script changes, recompute the hash:
    #   python3 -c "import hashlib,base64,re,sys; s=re.search(r'<script>(.*?)</script>', open('index.html').read(), re.S).group(1); print('sha256-'+base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
    # style-src keeps 'unsafe-inline' because Vue dynamic :style bindings and component
    # libraries set element style attributes at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gcDMZ3reqFDcIeJU3IEsVra//K/ibAKdfKgN6qChfv4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    
    # HSTS - enforce HTTPS for 1 year, including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Wiki authentication subrequest ──────────────────────────────
    # Validates the wiki_auth cookie against the backend JWT endpoint.
    # Returns 200 if valid, 401 if not — used by auth_request below.
    location = /_wiki_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;

        # Read JWT from the wiki_auth cookie and pass as Bearer token
        set $wiki_token $cookie_wiki_session;
        proxy_set_header Authorization "Bearer $wiki_token";
    }

    # ── Course-aware wiki auth subrequest ─────────────────────────
    # Validates JWT AND checks course enrollment for course-only chapters.
    # Used by /wiki/CH_COURSE* paths; returns 200/401/403.
    location = /_wiki_course_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/wiki-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;

        set $wiki_token $cookie_wiki_session;
        proxy_set_header Authorization "Bearer $wiki_token";
    }

    # ── Admin-only wiki auth subrequest ───────────────────────────
    # Validates JWT AND checks that the user has the admin role.
    # Used by /wiki-admin/ path; returns 200/401/403.
    location = /_wiki_admin_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/wiki-admin-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;

        set $wiki_token $cookie_wiki_session;
        proxy_set_header Authorization "Bearer $wiki_token";
    }

    # === BEGIN generated wiki blocks (tools/wiki-gen) -- do not edit by hand ===

    # Wiki auth outcomes -> real redirects (see error_page above).
    location @wiki_login {
        return 302 /login;
    }
    location @wiki_denied {
        return 302 /courses;
    }

    # /wiki/ landing index (range tracks only; no chapter content here)
    location = /wiki/ {
        auth_request /_wiki_auth;
        auth_request_set $wiki_frame_ancestor $upstream_http_x_wiki_frame_ancestor;
        error_page 401 =302 /login;
        error_page 403 =302 /login;

        alias /usr/share/nginx/wiki/;
        index index.html;
        try_files /index.html =404;

        add_header Cache-Control $wiki_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' $wiki_frame_ancestor; base-uri 'self'; form-action 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    }

    # range/* (student) -- serves any slug in this namespace.
    # Baked at build time: ai, forensics, high-school, identity, linpt, malware, netfor, osint, ot, software-security, webpt, winpt
    location ~ ^/wiki/range/[a-z0-9][a-z0-9._-]*/ {
        auth_request /_wiki_auth;
        auth_request_set $wiki_frame_ancestor $upstream_http_x_wiki_frame_ancestor;
        # Named locations, not "error_page 401 =302 /login". That form makes
        # nginx serve /login's CONTENT with a 302 status and no Location
        # header, so the browser is told to redirect with nowhere to go and
        # renders a blank page. A named location that returns 302 sends a real
        # Location.
        error_page 401 = @wiki_login;
        # 403 is authenticated but not entitled: not enrolled, or the chapter
        # belongs to a week that has not opened. The course list shows the
        # release dates, so it answers the question they arrive with.
        error_page 403 = @wiki_denied;

        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;

        # HTML stays uncached (a workbook edit shows immediately); static
        # assets (images/css/js) are cacheable so they are not re-downloaded on
        # every page view. Driven by the $wiki_cache_control map on $uri.
        add_header Cache-Control $wiki_cache_control always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' $wiki_frame_ancestor; base-uri 'self'; form-action 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    }

    # reference/* (student) -- serves any slug in this namespace.
    # Baked at build time: manual
    location ~ ^/wiki/reference/[a-z0-9][a-z0-9._-]*/ {
        auth_request /_wiki_auth;
        auth_request_set $wiki_frame_ancestor $upstream_http_x_wiki_frame_ancestor;
        # Named locations, not "error_page 401 =302 /login". That form makes
        # nginx serve /login's CONTENT with a 302 status and no Location
        # header, so the browser is told to redirect with nowhere to go and
        # renders a blank page. A named location that returns 302 sends a real
        # Location.
        error_page 401 = @wiki_login;
        # 403 is authenticated but not entitled: not enrolled, or the chapter
        # belongs to a week that has not opened. The course list shows the
        # release dates, so it answers the question they arrive with.
        error_page 403 = @wiki_denied;

        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;

        # HTML stays uncached (a workbook edit shows immediately); static
        # assets (images/css/js) are cacheable so they are not re-downloaded on
        # every page view. Driven by the $wiki_cache_control map on $uri.
        add_header Cache-Control $wiki_cache_control always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' $wiki_frame_ancestor; base-uri 'self'; form-action 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    }

    # === END generated wiki blocks ===

    # Serve wstunnel binaries for VPN setup (no auth required)
    location /downloads/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/downloads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Self-hosted CyberChef. Same-origin so it works without internet access;
    # the tailored CSP lives in cyberchef-headers.conf.
    location = /tools/cyberchef/ {
        include /etc/nginx/snippets/cyberchef-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /tools/cyberchef/index.html =404;
    }

    location ^~ /tools/cyberchef/ {
        include /etc/nginx/snippets/cyberchef-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri $uri/ =404;
    }

    # SPA entry point — never cache so deploys take effect immediately
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    }


    # Optional SSO identity provider (Dex). The sso compose profile runs dex
    # on the app network; nginx resolves it per request so the SPA still works
    # when the profile is off.
    location = /idp {
        return 301 /idp/;
    }
    location /idp/ {
        # Dex derives its route prefix from the issuer path (/idp), so the
        # prefix must reach Dex unchanged. Resolve the upstream per request so
        # nginx still starts when the sso profile is off.
        set $dex_upstream http://dex:5556;
        proxy_pass $dex_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API documentation is not exposed on the public origin. The backend also
    # gates these paths, but nginx should not serve the SPA with a misleading
    # 200 if someone probes them.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /docs/oauth2-redirect { return 404; }

    # Serve static files
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    # Uses no_tokens log format to strip query params (prevents JWT/ticket leakage)
    location /api {
        access_log /var/log/nginx/access.log no_tokens;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ocr_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Vite-hashed assets (/assets/) — no-cache during active development
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Images/fonts in root (public dir, not hashed) — short cache so updates appear quickly
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}

