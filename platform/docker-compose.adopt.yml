# Local side-by-side test stack for opencyberrange-next.
#
# Runs a second full stack next to the existing ocr-* one without touching it:
#   - distinct container names
#   - frontend on 8080/8443, backend on 127.0.0.1:8001
#   - project name "ocr-next" keeps volumes and networks separate
#
# Usage (from platform/):
#   docker compose -p ocr-next --env-file .env \
#     -f docker-compose.prod.yml -f <this file> up -d --build

services:
  db:
    container_name: ocr-next-db

  redis:
    container_name: ocr-next-redis

  backend:
    container_name: ocr-next-backend
    ports: !override
      - "127.0.0.1:8001:8000"

  frontend:
    container_name: ocr-next-frontend
    image: ocr-next-frontend:local
    ports: !override
      - "8080:80"
      - "8443:443"
