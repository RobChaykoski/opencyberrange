version: "1.0"
note: >
  Achievements are recognition, not currency. They never add to the Legacy
  Score. Before an achievement is earned the API returns only its tier and
  clue; it never returns the trigger. A planned rule is not awardable until
  the platform collects the signal honestly.
whispers:
  - "Not all achievements come from solving problems."
  - "Someone earned an achievement this year that has only been awarded twice."
  - "The rarest achievement here has nothing to do with cybersecurity."
  - "There is at least one person in this community whose story is different because you were here."
