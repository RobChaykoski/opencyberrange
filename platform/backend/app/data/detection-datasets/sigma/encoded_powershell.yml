title: Encoded PowerShell from an Office Parent
id: 5f0c2b0e-4b1f-4a6e-9d1a-ocr-det-001
status: test
description: Detects PowerShell using an encoded command launched by an Office process.
author: OpenCyberRange Detection Pathway
date: 2026-11-16
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\\WINWORD.EXE'
      - '\\EXCEL.EXE'
      - '\\POWERPNT.EXE'
  selection_powershell:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - ' -enc'
      - ' -encodedcommand'
  condition: selection_parent and selection_powershell and selection_encoded
falsepositives:
  - Approved Office macros that launch signed administrative scripts.
level: high
