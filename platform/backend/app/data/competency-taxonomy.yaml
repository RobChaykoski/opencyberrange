version: "1.0"
status: "master framework"
notes: >
  OpenCyberRange Competency Taxonomy v1.0. Domains contain categories, and
  categories contain competencies. Proficiency levels are descriptive practice
  levels, not grades or hiring predictions. The taxonomy is the shared
  vocabulary for workbooks, assessments, pathways, badges, readiness, capstones,
  and employer transcripts.

proficiency_scale:
  - id: awareness
    label: Awareness
    description: Recognises the term and can explain why it matters.
  - id: foundational
    label: Foundational
    description: Can follow a guided procedure and explain the result.
  - id: practitioner
    label: Practitioner
    description: Can apply the competency in a new but familiar exercise.
  - id: specialist
    label: Specialist
    description: Can adapt the competency under friction and explain trade-offs.
  - id: lead
    label: Lead
    description: Can design, review, and teach the competency to others.

