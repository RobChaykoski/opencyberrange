version: "1.0"
status: "reviewed mapping scaffold"
notes: >
  Maps workbook chapters, tracks, and lab categories to OpenCyberRange
  Competency Taxonomy v1.0 IDs. Chapter mappings win over track mappings; a lab
  with no explicit mapping falls back to its primary competency axis. Extend the
  chapter entries as new workbooks are authored.

