# External open dataset registry
#
# This file records the open datasets that lab authors may use to build
# detection, DFIR, malware-analysis, and network exercises. It is a provenance
# and handling register, not a copy of the data.
#
# Rules:
#   * raw datasets are not committed to this repository;
#   * a fetchable dataset is pinned to a commit and every file has a SHA-256;
#   * citation-required sources must be cited in the lab and in the workbook;
#   * live malware is never redistributed here;
#   * a source with no declared licence is reference-only.
#
# Run `python scripts/check-external-datasets.py` after changing this file.

version: 1
policy:
  cache_root: platform/backend/app/data/external-datasets/cache
  raw_data_committed: false
  require_sha256_when_fetchable: true
  live_malware_committed: false
  real_pii: false
  citation_required: true
  redistributable_sources_only: false
  notes: >-
    Public visibility is not the same as a licence. Security Datasets (MIT) and
    Splunk attack_data (Apache-2.0) may be redistributed with their notices.
    UNB CIC datasets may be redistributed with the dataset citation and paper.
    theZoo malware samples are expressly excluded from its GPL licence and are
    never copied here. PCAP-ATTACK declares no licence and stays reference-only.

