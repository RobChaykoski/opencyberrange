version: 1
title: Active Directory Attack and Remediation
status: reviewed pathway specification
audience: Intermediate Windows learners who can enumerate SMB, LDAP, RDP, and WinRM and want to move from service enumeration into domain attack paths and defence.
prerequisites:
  completed_pathways:
  - WIN02
  - WIN07
  baseline_competencies:
  - WIN-005
  - WIN-009
  - WIN-012
  - WIN-013
  - NET-027
principles:
- 'Map the domain before attacking it: identity, groups, trusts, and delegation are the path.'
- Every attack step names the misconfiguration it abuses and the control that would stop it.
- Use a disposable synthetic domain with no egress, no real accounts, and no production trust.
- Tickets and hashes are evidence, not trophies. Record provenance, time, and scope.
- A path is not complete until the learner writes the remediation for each hop.
data_policy:
  synthetic_only: true
  real_pii: false
  real_credentials: false
  domain: lab.example
  notes: The planned labs use a synthetic Samba AD DC or an approved disposable Windows evaluation domain. They never join a real domain or reuse a real credential.
pathway_contract:
  evidence_required: true
  report_required: true
  attack_path_required: true
  defensive_fix_required: true
modules:
- id: AD-01
  title: Directory Fundamentals and Trust Boundaries
  difficulty: beginner
  estimated_minutes: 60
  prerequisites: []
  datasets: []
  existing_labs:
  - windows-2-9-ad-fundamentals-basics
  - windows-2-10-ad-to-smb-scenario
  planned_labs: []
  competencies:
  - id: WIN-009
    weight: 0.35
  - id: WIN-012
    weight: 0.25
  - id: WIN-013
    weight: 0.2
  - id: NET-027
    weight: 0.2
  evidence:
  - directory_map
  - evidence_artifact
  - defensive_report
  report_required: true
  attack:
  - T1087.002
  - T1069.002
  outcomes:
  - Explain domain, forest, OU, distinguished name, and service account.
  - Map users, groups, and computers from the directory.
  - Identify the trust boundary between the learner host and the domain.
  - State why a directory description or group membership is not proof of access.
  safety: Use the training directory administrator account only; no real domain data.
- id: AD-02
  title: Domain Enumeration and Attack-Path Mapping
  difficulty: beginner
  estimated_minutes: 90
  prerequisites:
