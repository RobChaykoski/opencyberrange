    weight: 0.4
  - id: WIN-009
    weight: 0.2
  - id: WIN-013
    weight: 0.2
  - id: TH-003
    weight: 0.2
  evidence:
  - directory_map
  - attack_path
  - evidence_artifact
  report_required: true
  attack:
  - T1087.002
  - T1069.002
  - T1018
  - T1482
  outcomes:
  - Enumerate domains, trusts, users, groups, computers, and sessions with ldapdomaindump or netexec.
  - Collect BloodHound-compatible data with bloodhound-python in the isolated lab.
  - Explain nodes, edges, and why one edge is not yet an exploit.
  - Rank three paths by required privilege and likely impact.
  safety: Collector output stays in the lab; no upload to a public BloodHound instance.
- id: AD-03
  title: Kerberoasting
  difficulty: intermediate
  estimated_minutes: 100
  prerequisites:
  - AD-02
  datasets: []
  existing_labs:
  - windows-11-2-kerberoasting
  planned_labs: []
  competencies:
