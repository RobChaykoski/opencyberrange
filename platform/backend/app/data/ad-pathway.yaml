  - policy_analysis
  - defensive_report
  report_required: true
  attack:
  - T1558.004
  - T1110.003
  outcomes:
  - Find accounts that do not require Kerberos pre-authentication.
  - Request an AS-REP and explain what the encrypted part proves.
  - Test a bounded spray against the synthetic domain and respect lockout policy.
  - Recommend pre-authentication enforcement, lockout, and honey accounts.
  safety: Use a single test password and a bounded account set; never spray a real domain.
