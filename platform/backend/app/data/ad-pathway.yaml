  - T1098
  - T1484
  outcomes:
  - Read ACLs and identify GenericAll, WriteDACL, ForceChangePassword, and AddMember.
  - Turn one ACL edge into a controlled lab action.
  - Show the resulting group or account change in the directory.
  - Recommend tiered administration, ACL review, and change alerting.
  safety: Modify only the synthetic lab object named in the brief; restore or reset after.
