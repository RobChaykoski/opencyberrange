    weight: 0.45
  - id: WIN-013
    weight: 0.25
  - id: WIN-020
    weight: 0.15
  - id: TH-003
    weight: 0.15
  evidence:
  - command_transcript
  - ticket_artifact
  - defensive_report
  report_required: true
  attack:
  - T1558.003
  - T1110.002
  outcomes:
  - Find accounts with a service principal name and request a service ticket.
  - Extract the ticket hash in the lab and explain the offline cracking model.
  - Identify the weak service-account password policy that made it possible.
  - Recommend gMSA, rotation, and service-account tiering.
  safety: Crack only the synthetic lab hash; do not use a real wordlist or credential.
- id: AD-04
