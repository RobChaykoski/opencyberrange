# External OSINT targets and their offline mirrors.
#
# A live target is optional evidence. The offline mirror is the assessed path
# and must always be present, reviewed, and hash-checked. The daily job records
# drift; it never treats a public page as a place to collect personal data.

version: 1
policy:
  offline_mirror_required: true
  allow_personal_data: false
  live_target_use: read_only
  audience: adult
  check_frequency: daily

targets:
  - id: swocts-public-homepage
    lab: osint-2-2-public-homepage
    kind: retired_public_homepage
    status: retired
    live_check: false
    url: https://www.swocts.com/
    method: GET
    expected_status: 200
    expected_marker: "x-swocts-osint: OCR{swocts_v13w_s0urc3}"
    offline_marker: "OCR{swocts_v13w_s0urc3}"
    marker_required: false
    marker_status: absent
    raw_sha256: 43cc97657dc027a2d649daaa98eb40c09d6a87a3694b574e237aa6b5b8ed669c
    stable_sha256: fb3785a091260692a59042ba068d9d5150b362a4f3165ada93e9be97dadcf45e
    checked_at: "2026-11-16"
    offline_mirror: platform/labs/OSINT/_shared/mirrors/swocts-public-homepage.html
    offline_mirror_sha256: fd326044759bad7ec19cd4622cee73d54ed98c9f60a2715219676c38004c98a3
    pii: none
    audience: adult
    authorization: >-
      Read-only use of a public community homepage. No personal data is
      collected. The offline mirror is the assessed path; the live page is an
      optional adult-only extension.
    notes: >-
      The live marker was absent on 2026-11-16 and the live path is retired. The
      mirror is the only assessed target; the daily job checks its hash.

  - id: opencyberrange-osint-repository-clue
