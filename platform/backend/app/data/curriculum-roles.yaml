version: "1.0"
status: "development preview"
notes: >
  Career pathways are curriculum guidance built from the OpenCyberRange
  Competency Taxonomy v1.0. Readiness is a descriptive coverage estimate, not a
  prediction of job performance, a hiring decision, or a claim that a learner is
  ready for a role. Gold, Silver, and Bronze are curriculum targets, not grades.

readiness_model:
  version: "1.0"
  components:
    workbook: 0.30
    lab_assessment: 0.20
    independent: 0.20
    scenario: 0.10
    capstone: 0.20
  rating_scale:
    - {min: 0, max: 59, label: "Not Ready", description: "Build the foundations and start the pathway workbooks."}
    - {min: 60, max: 69, label: "Emerging", description: "Early evidence across the pathway; keep practising the gaps."}
    - {min: 70, max: 79, label: "Developing", description: "Broad evidence; the capstone and weaker domains are the next step."}
    - {min: 80, max: 89, label: "Career Ready", description: "Strong curriculum evidence; prepare the portfolio and interview story."}
    - {min: 90, max: 100, label: "Highly Prepared", description: "Deep, repeated evidence across the pathway; keep it current."}
  disclaimer: >
    "Career Ready" is a curriculum-readiness label, not a guarantee of
    employment. Employers make their own decisions and must review the evidence.

level_targets:
  Gold: 75
  Silver: 60
  Bronze: 45

pathways:
  - id: cybersecurity-foundations
    title: Cybersecurity Foundations
    family: defensive
    flagship: true
    aliases: ["Foundations", "Cybersecurity Foundations", "Entry Pathway"]
    summary: "A first pathway for high-school students, first-year college learners, career changers, and IT professionals moving into security."
    career_ready_threshold: 70
    domain_floor: 60
    level_requirements:
      NET: Silver
      LIN: Silver
      WIN: Bronze
      OSINT: Bronze
      IR: Bronze
      AI: Bronze
      PROF: Silver
    critical_competencies:
      - NET-001
      - NET-002
      - NET-011
      - NET-013
      - NET-021
      - NET-022
      - LIN-001
      - LIN-003
      - LIN-005
      - LIN-011
      - LIN-014
      - LIN-018
      - WIN-005
      - OSINT-001
      - IR-001
      - AI-001
      - PROF-001
    tracks: [high-school, netfor, linpt, identity, osint, ai]
    categories: [general, network, authentication, osint, ai]
    capstone:
      title: "Small Business Cyber Assessment"
      description: "Evaluate a small business network, endpoints, users, and basic controls, then produce a prioritized remediation plan."
      deliverables: ["Asset and user summary", "Prioritized findings", "Remediation plan", "Executive summary"]
      track: high-school
      slug_hint: capstone
    certifications:
      entry: ["CompTIA ITF+", "ISC2 Certified in Cybersecurity (CC)"]
      core: ["CompTIA Security+", "Microsoft SC-900", "CompTIA CySA+"]
      advanced: ["CompTIA SecurityX (CASP+)", "ISC2 CISSP"]
    evidence:
      - "A completed network and Linux foundation workbook"
      - "A small-business assessment capstone"
      - "A short written finding for a non-specialist"

