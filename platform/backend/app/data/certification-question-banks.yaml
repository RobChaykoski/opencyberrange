  questions:
  - id: cysa-1-01
    domain: '1'
    objective: 1.2 Given a scenario, analyze indicators of potentially malicious activity.
    difficulty: standard
    style: scenario
    prompt: A host suddenly sends large outbound transfers to a new external IP every night at 02:00. Which indicator
      is MOST relevant?
    options:
    - A recurring off-hours data transfer to an unfamiliar destination
    - A single failed login during business hours
    - A scheduled operating-system update
    - A full disk on a backup server
    correct: 0
    explanation: Regular off-hours transfers to a new external destination are a classic exfiltration indicator.
      A single failed login or a scheduled update is common benign activity, and a full backup disk is an availability
      issue.
    reference:
      label: 'MITRE ATT&CK: Exfiltration'
      url: https://attack.mitre.org/tactics/TA0010/
    career: SOC analyst
  - id: cysa-2-01
    domain: '2'
    objective: 2.1 Given a scenario, implement vulnerability scanning methods and concepts.
    difficulty: advanced
    style: scenario
    prompt: A scanner reports a critical vulnerability on a production host, but the service is not exposed and
      the vendor confirms the code path is unreachable. What is the BEST next step?
    options:
    - Validate the finding with context and document the compensating conditions
    - Ignore every critical finding from that scanner
    - Disable the scanner to reduce noise
    - Patch immediately without a change window
    correct: 0
    explanation: Vulnerability management requires validation and context. A finding that is not reachable may be
      a false positive or lower risk, but the decision and compensating controls must be documented. Disabling the
      scanner or ignoring findings removes evidence.
    reference:
      label: 'NIST SP 800-40: Enterprise Patch Management'
      url: https://csrc.nist.gov/pubs/sp/800/40/r4/final
    career: SOC analyst
  - id: cysa-3-01
    domain: '3'
    objective: 3.2 Given a scenario, apply the appropriate incident response procedure.
    difficulty: standard
    style: scenario
    prompt: During an active ransomware incident, which action should come FIRST?
    options:
    - Contain affected systems to limit spread
    - Publish a public statement
    - Rebuild every server
    - Close the ticket as resolved
    correct: 0
    explanation: Containment limits damage and preserves the ability to investigate. Communication and recovery
      follow, and the incident is not resolved until recovery and lessons learned are complete.
    reference:
      label: 'CISA: Ransomware Guide'
      url: https://www.cisa.gov/stopransomware/ransomware-guide
    career: SOC analyst
  - id: cysa-4-01
    domain: '4'
    objective: 4.1 Explain the importance of vulnerability management reporting and communication.
    difficulty: standard
    style: scenario
    prompt: An executive asks for the business impact of a finding. Which report element is MOST useful?
    options:
    - The affected asset, likelihood, and potential business consequence
    - The raw scanner plugin ID only
    - A list of every open port
    - The analyst's personal opinion of the vendor
    correct: 0
    explanation: 'Executives need risk in business terms: what is affected, how likely exploitation is, and what
      the consequence would be. Raw plugin IDs and port lists lack context.'
    reference:
      label: NIST Cybersecurity Framework 2.0
      url: https://www.nist.gov/cyberframework
    career: SOC analyst
  - id: cysa-1-02
    domain: '1'
    objective: 1.2 Analyze indicators of potentially malicious activity.
    difficulty: standard
    style: scenario
    prompt: A service account authenticates successfully from a new country at 03:00. Which first step BEST reduces
      false positives?
    options:
    - Correlate the sign-in with change tickets and the account's baseline history
    - Disable the account immediately
    - Block the entire country at the firewall
    - Reset every user's password
    correct: 0
    explanation: Baseline and change context separate a legitimate migration or vendor change from compromise. Immediate
      disablement, country blocks, and mass resets are disruptive and may destroy evidence.
    reference:
      label: 'NIST SP 800-61 Rev. 2: Incident Handling Guide'
      url: https://csrc.nist.gov/pubs/sp/800/61/r2/final
    career: SOC analyst
  - id: cysa-1-03
    domain: '1'
    objective: 1.4 Explain threat intelligence and threat-hunting concepts.
    difficulty: standard
    style: scenario
    prompt: Which MITRE ATT&CK tactic covers dumping credentials from LSASS?
    options:
    - Credential Access
    - Discovery
    - Lateral Movement
    - Exfiltration
    correct: 0
    explanation: LSASS credential dumping is Credential Access (TA0006). Discovery maps the environment, Lateral
      Movement moves between hosts, and Exfiltration removes data.
    reference:
      label: 'MITRE ATT&CK: Credential Access'
      url: https://attack.mitre.org/tactics/TA0006/
    career: Threat hunter
  - id: cysa-2-02
    domain: '2'
    objective: 2.3 Prioritize and mitigate vulnerabilities using risk-based approaches.
    difficulty: advanced
    style: scenario
    prompt: 'Two findings exist: CVSS 9.8 on an isolated development host and CVSS 6.5 on an internet-facing VPN.
      Which should be remediated first?'
    options:
    - The internet-facing VPN, using exposure and threat context
    - The 9.8 because the score is highest
    - Neither, because both are only scan results
    - The development host because it is easier to patch
    correct: 0
    explanation: Risk-based prioritization considers exposure, reachability, threat activity, and business impact,
      not the base score alone. An internet-facing VPN with a known exploited weakness can outrank an isolated high-score
      lab host.
    reference:
      label: CISA Known Exploited Vulnerabilities Catalog
      url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    career: Vulnerability analyst
  - id: cysa-3-02
    domain: '3'
    objective: 3.3 Implement incident response techniques.
    difficulty: standard
    style: scenario
    prompt: Which action BEST preserves evidence during an incident?
    options:
    - Capture volatile memory and a disk image before remediation, with chain of custody
    - Reimage the host immediately
    - Delete suspicious logs to reduce noise
    - Ask users to keep working on the host
    correct: 0
    explanation: Volatile memory and disk images preserve state that remediation can destroy. Chain of custody keeps
      the evidence defensible; reimaging, deleting logs, and continued use all lose or contaminate evidence.
    reference:
      label: 'NIST SP 800-86: Integrating Forensic Techniques'
      url: https://csrc.nist.gov/pubs/sp/800/86/final
    career: Incident responder
  - id: cysa-4-02
    domain: '4'
    objective: 4.2 Describe security operations, incident response reporting, and communication.
    difficulty: standard
    style: scenario
    prompt: Which metric BEST demonstrates faster detection over time?
    options:
    - Median time from first telemetry to alert
    - Number of alerts closed per analyst
    - Total tickets opened
    - Number of scanners deployed
    correct: 0
    explanation: Detection time measures how quickly the team notices an event. Ticket and alert counts can rise
      with noise, and scanner counts are inputs, not outcomes.
    reference:
      label: 'NIST SP 800-137: Information Security Continuous Monitoring'
      url: https://csrc.nist.gov/pubs/sp/800/137/final
    career: SOC lead
  careers:
  - SOC analyst
  - Threat hunter
  - Incident responder
  - Vulnerability analyst
  - SOC lead
- id: comptia-pentest-plus
  name: CompTIA PenTest+
  code: PT0-003
  url: https://www.comptia.org/certifications/pentest
  objectives_url: https://www.comptia.org/certifications/pentest#examdetails
  tracks:
  - web
  - software-security
  - linux
  - windows
  - network
  domains:
  - id: '1'
    name: Engagement Management
    weight: 13
  - id: '2'
    name: Reconnaissance and Enumeration
    weight: 21
  - id: '3'
    name: Vulnerability Discovery and Analysis
    weight: 17
  - id: '4'
    name: Attacks and Exploits
    weight: 35
  - id: '5'
    name: Post-exploitation and Lateral Movement
    weight: 14
  questions:
  - id: pentest-1-01
    domain: '1'
    objective: 1.1 Given a scenario, plan and scope a penetration test.
    difficulty: standard
    style: scenario
    prompt: Before testing a client's web application, what document MOST clearly defines permitted targets, timing,
      and escalation contacts?
    options:
    - Rules of engagement
    - A public blog post
    - A vulnerability scanner licence
    - An internal chat message
    correct: 0
    explanation: Rules of engagement define scope, authorized targets, timing, constraints, and contacts. The other
      options do not establish authorization or boundaries.
    reference:
      label: 'NIST SP 800-115: Technical Guide to Information Security Testing'
      url: https://csrc.nist.gov/pubs/sp/800/115/final
    career: Penetration tester
  - id: pentest-3-01
    domain: '4'
    objective: 3.1 Given a scenario, research and use attack techniques.
    difficulty: advanced
    style: scenario
    prompt: A tester finds a web form that builds a shell command from user input. Which test is the SAFEST way
      to confirm command injection in an authorized lab?
    options:
    - Send a harmless command that writes a unique marker file
    - Run a destructive recursive delete
    - Launch a denial-of-service against production
    - Exfiltrate real customer data
    correct: 0
    explanation: A harmless, reversible proof (such as a marker file) confirms the flaw without damaging systems
      or exposing data. Destructive or availability-impacting tests exceed safe validation.
    reference:
      label: 'OWASP Testing Guide: Command Injection'
      url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/12-Testing_for_Command_Injection
    career: Penetration tester
  - id: pentest-4-01
    domain: '1'
    objective: 4.2 Given a scenario, analyze and report findings.
    difficulty: standard
    style: scenario
    prompt: Which finding description is MOST useful to a remediation team?
    options:
    - Reproduction steps, evidence, impact, and a specific remediation
    - Only a severity score
    - A screenshot with no context
    - The tester's tool version
    correct: 0
    explanation: 'A useful finding is reproducible and actionable: steps, evidence, impact, and a concrete fix.
      A score or screenshot alone does not tell the team what to change.'
    reference:
      label: OWASP Vulnerability Disclosure Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Vulnerability_Disclosure_Cheat_Sheet.html
    career: Penetration tester
  - id: pentest-2-01
    domain: '2'
    objective: 2.2 Given a scenario, perform information gathering.
    difficulty: standard
    style: scenario
    prompt: A tester needs to identify services on an authorized host without triggering a full TCP connect scan.
      Which approach is MOST appropriate?
    options:
    - A SYN scan within the agreed scope
    - A scan of the entire internet
    - A password spray against the client's staff
    - A phishing campaign against the client
    correct: 0
    explanation: A SYN scan is a standard service-discovery technique when it is inside the authorized scope. Scanning
      unrelated systems or attacking people is out of scope and unethical.
    reference:
      label: 'Nmap: Port Scanning Techniques'
      url: https://nmap.org/book/man-port-scanning-techniques.html
    career: Penetration tester
  - id: pentest-1-02
    domain: '1'
    objective: 1.1 Plan and scope a penetration test.
    difficulty: standard
    style: scenario
    prompt: A client asks you to test a SaaS application hosted by a third party. What authorization is required?
    options:
    - Written permission from both the client and the SaaS provider
    - The client's verbal approval only
    - A public bug-bounty page
    - No authorization if testing is read-only
    correct: 0
    explanation: The asset owner and the hosting provider both control part of the environment. Written authorization
      from both prevents contract, legal, and availability surprises; verbal approval and read-only status are not
      enough.
    reference:
      label: 'NIST SP 800-115: Technical Guide to Security Testing'
      url: https://csrc.nist.gov/pubs/sp/800/115/final
    career: Penetration tester
  - id: pentest-2-02
    domain: '2'
    objective: 2.1 Perform passive reconnaissance.
    difficulty: standard
    style: scenario
    prompt: Which source can reveal subdomains without sending traffic to the target?
    options:
    - Certificate Transparency logs
    - A full TCP connect scan
    - A login brute-force attempt
    - A DNS zone transfer from an unrelated server
    correct: 0
    explanation: Certificate Transparency logs are public records of certificates and often include subdomains.
      A connect scan, brute force, and unrelated zone transfer either touch the target or are unlikely to work.
    reference:
      label: OWASP Web Security Testing Guide
      url: https://owasp.org/www-project-web-security-testing-guide/
    career: Red team operator
  - id: pentest-3-02
    domain: '3'
    objective: 3.1 Analyze vulnerability scan results and validate findings.
    difficulty: standard
    style: scenario
    prompt: An authenticated scanner reports a critical plugin finding, but a manual check shows the service is
      patched. What is the BEST next step?
    options:
    - Validate the finding and document it as a false positive with evidence
    - Report it as critical without qualification
    - Ignore all scanner findings in future
    - Exploit it to confirm the scanner is right
    correct: 0
    explanation: Scanner output needs validation. Documenting the check and the evidence prevents a false positive
      from reaching the client, while blanket distrust or exploitation adds risk without improving the report.
    reference:
      label: 'NIST SP 800-115: Technical Guide to Security Testing'
      url: https://csrc.nist.gov/pubs/sp/800/115/final
    career: Vulnerability analyst
  - id: pentest-4-02
    domain: '4'
    objective: 4.2 Perform authentication attacks within scope.
    difficulty: standard
    style: scenario
    prompt: Which test BEST validates a password policy without locking accounts?
    options:
    - A slow, rate-limited credential test within the agreed lockout threshold
    - A full brute force at maximum rate
    - A password spray with no coordination
    - Repeated attempts after the lockout triggers
    correct: 0
    explanation: Rate limiting and coordination keep the test inside the agreed threshold and avoid locking real
      users. Maximum-rate brute force, uncoordinated spraying, and retrying after lockout can cause outages.
    reference:
      label: 'NIST SP 800-63B: Digital Identity Guidelines'
      url: https://csrc.nist.gov/pubs/sp/800/63b/final
    career: Penetration tester
  - id: pentest-5-02
    domain: '5'
    objective: 5.2 Perform post-exploitation activities.
    difficulty: advanced
    style: scenario
    prompt: After establishing a foothold, what should be documented before cleanup?
    options:
    - Persistence mechanisms, lateral movement paths, and collected evidence
    - Only the initial IP address
    - The final report only
    - Nothing, to avoid leaving evidence
    correct: 0
    explanation: The attack narrative needs the persistence, paths, and evidence that prove impact and support remediation.
      An IP or final report alone loses the chain of activity; destroying evidence defeats the engagement.
    reference:
      label: 'MITRE ATT&CK: Post-Exploitation'
      url: https://attack.mitre.org/tactics/TA0008/
    career: Red team operator
  careers:
  - Penetration tester
  - Red team operator
  - Security consultant
  - Application security tester
  - Vulnerability analyst
- id: comptia-network-plus
  name: CompTIA Network+
  code: N10-009
  url: https://www.comptia.org/certifications/network
  objectives_url: https://www.comptia.org/certifications/network#examdetails
  tracks:
  - network
  domains:
  - id: '1'
    name: Networking Concepts
    weight: 23
  - id: '2'
    name: Network Implementation
    weight: 20
  - id: '3'
    name: Network Operations
    weight: 19
  - id: '4'
    name: Network Security
    weight: 14
  - id: '5'
    name: Network Troubleshooting
    weight: 24
  questions:
  - id: netplus-1-01
    domain: '1'
    objective: 1.1 Explain the OSI model and TCP/IP.
    difficulty: starter
    style: scenario
    prompt: Which protocol uses a three-way handshake before sending application data?
    options:
    - TCP
    - UDP
    - ICMP
    - ARP
    correct: 0
    explanation: TCP establishes a connection with SYN, SYN/ACK, and ACK. UDP is connectionless, ICMP carries control
      messages, and ARP resolves link-layer addresses.
    reference:
      label: 'RFC 9293: Transmission Control Protocol'
      url: https://www.rfc-editor.org/rfc/rfc9293
    career: Network administrator
  - id: netplus-3-01
    domain: '3'
    objective: 3.2 Given a scenario, use network monitoring tools.
    difficulty: standard
    style: scenario
    prompt: A switch port is configured to copy traffic to a monitoring host. What is this feature called?
    options:
    - Port mirroring / SPAN
    - DHCP snooping
    - VLAN pruning
    - NAT overload
    correct: 0
    explanation: SPAN or port mirroring copies selected traffic to a monitoring port for capture or IDS. DHCP snooping,
      VLAN pruning, and NAT overload serve different purposes.
    reference:
      label: 'Wireshark: Capture setup'
      url: https://wiki.wireshark.org/CaptureSetup
    career: Network administrator
  - id: netplus-4-01
    domain: '4'
    objective: 4.1 Explain basic network security concepts.
    difficulty: standard
    style: scenario
    prompt: A firewall rule set blocks all traffic unless a rule explicitly allows it. Which policy is this?
    options:
    - Default deny
    - Default allow
    - Implicit permit
    - Open egress
    correct: 0
    explanation: Default deny blocks traffic unless an explicit rule permits it. It is a safer baseline than default
      allow.
    reference:
      label: 'NIST SP 800-41: Guidelines on Firewalls and Firewall Policy'
      url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
    career: Network administrator
  - id: netplus-5-01
    domain: '5'
    objective: 5.3 Given a scenario, troubleshoot common network issues.
    difficulty: standard
    style: scenario
    prompt: Users can reach an IP address but not the hostname. Which service should be checked FIRST?
    options:
    - DNS resolution
    - The default gateway
    - The switch duplex setting
    - The DHCP lease time
    correct: 0
    explanation: If the IP works but the name does not, name resolution is the first suspect. Check the resolver
      configuration and DNS server reachability.
    reference:
      label: 'RFC 1034: Domain Names - Concepts and Facilities'
      url: https://www.rfc-editor.org/rfc/rfc1034
    career: Network administrator
  - id: netplus-1-02
    domain: '1'
    objective: 1.4 Explain IPv4 and IPv6 addressing concepts.
    difficulty: starter
    style: scenario
    prompt: Which IPv4 range is private?
    options:
    - 172.16.0.0/12
    - 8.8.8.0/24
    - 192.0.2.0/24
    - 203.0.113.0/24
    correct: 0
    explanation: 172.16.0.0/12 is one of the RFC 1918 private ranges. 8.8.8.0/24 is public, and 192.0.2.0/24 and
      203.0.113.0/24 are documentation ranges.
    reference:
      label: 'RFC 1918: Address Allocation for Private Internets'
      url: https://www.rfc-editor.org/rfc/rfc1918
    career: Network administrator
  - id: netplus-2-02
    domain: '2'
    objective: 2.2 Explain VLAN and switching concepts.
    difficulty: standard
    style: scenario
    prompt: Which technology carries multiple VLANs between switches?
    options:
    - An 802.1Q trunk
    - An access port
    - NAT
    - A DHCP relay
    correct: 0
    explanation: An 802.1Q trunk tags frames so multiple VLANs share a link. Access ports belong to one VLAN, NAT
      translates addresses, and DHCP relay forwards DHCP requests.
    reference:
      label: CompTIA Network+ N10-009 objectives
      url: https://www.comptia.org/en-us/certifications/network/
    career: Network engineer
  - id: netplus-3-02
    domain: '3'
    objective: 3.3 Explain DNS records and services.
    difficulty: starter
    style: scenario
    prompt: Which DNS record maps a hostname to an IPv6 address?
    options:
    - AAAA
    - A
    - CNAME
    - MX
    correct: 0
    explanation: AAAA maps a name to IPv6. A maps to IPv4, CNAME aliases one name to another, and MX identifies
      mail exchangers.
    reference:
      label: 'RFC 3596: DNS Extensions for IPv6'
      url: https://www.rfc-editor.org/rfc/rfc3596
    career: NOC analyst
  - id: netplus-4-02
    domain: '4'
    objective: 4.2 Explain network security controls.
    difficulty: standard
    style: scenario
    prompt: Which control BEST limits lateral movement between VLANs?
    options:
    - Inter-VLAN ACLs on a firewall or Layer 3 switch
    - A larger broadcast domain
    - Disabling STP
    - Replacing switches with hubs
    correct: 0
    explanation: Inter-VLAN ACLs enforce which subnets may talk and block unnecessary paths. A larger broadcast
      domain, disabled STP, and hubs increase exposure and instability.
    reference:
      label: 'NIST SP 800-41 Rev. 1: Firewalls and Firewall Policy'
      url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
    career: Network security engineer
  - id: netplus-5-02
    domain: '5'
    objective: 5.3 Troubleshoot connectivity issues.
    difficulty: standard
    style: scenario
    prompt: Users can reach internal servers but not the internet, and DNS resolves names. Which is the MOST likely
      cause?
    options:
    - A missing default gateway or NAT configuration
    - A failed DNS zone
    - A bad VLAN tag on the server
    - A duplicate MAC address
    correct: 0
    explanation: 'Internal reachability plus working DNS points to the path out of the local network: default gateway
      or NAT. A DNS failure would break name resolution, and a server VLAN or duplicate MAC would not isolate internet
      access.'
    reference:
      label: CompTIA Network+ N10-009 objectives
      url: https://www.comptia.org/en-us/certifications/network/
    career: Network administrator
  careers:
  - Network administrator
  - Network engineer
  - NOC analyst
  - Network security analyst
  - Network security engineer
- id: comptia-linux-plus
  name: CompTIA Linux+
  code: XK0-006
  url: https://www.comptia.org/certifications/linux
  objectives_url: https://www.comptia.org/certifications/linux#examdetails
  tracks:
  - linux
  domains:
  - id: '1'
    name: System Management
    weight: 23
  - id: '2'
    name: Services and User Management
    weight: 20
  - id: '3'
    name: Security
    weight: 18
  - id: '4'
    name: Automation, Orchestration, and Scripting
    weight: 17
  - id: '5'
    name: Troubleshooting
    weight: 22
  questions:
  - id: linuxplus-2-01
    domain: '2'
    objective: 2.1 Given a scenario, manage users and permissions.
    difficulty: standard
    style: scenario
    prompt: A file must be readable and writable by its owner and readable by everyone else, with no other permissions.
      Which mode is correct?
    options:
    - '644'
    - '777'
    - '600'
    - '755'
    correct: 0
    explanation: 644 gives the owner read/write (6), group read (4), and others read (4). 600 removes group and
      other access; 755 adds execute; 777 grants everything.
    reference:
      label: 'Linux man-pages: chmod(1)'
      url: https://man7.org/linux/man-pages/man1/chmod.1.html
    career: Linux systems administrator
  - id: linuxplus-1-01
    domain: '2'
    objective: 1.4 Given a scenario, manage services.
    difficulty: standard
    style: scenario
    prompt: Which command shows the status of a systemd service and its recent log lines?
    options:
    - systemctl status <service>
    - chmod +x <service>
    - tar -czf <service>
    - useradd <service>
    correct: 0
    explanation: systemctl status reports the unit state and recent journal lines. The other commands change permissions,
      archive files, or create users.
    reference:
      label: 'systemd: systemctl man page'
      url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
    career: Linux systems administrator
  - id: linuxplus-4-01
    domain: '5'
    objective: 4.2 Given a scenario, troubleshoot storage and resource issues.
    difficulty: advanced
    style: scenario
    prompt: A server reports no space left on a filesystem, but a large deleted log file is still held open by a
      process. Which action is SAFEST?
    options:
    - Restart or reload the process that holds the file, after confirming the impact
    - Delete every file in /var/log immediately
    - Rebuild the server without investigation
    - Disable logging permanently
    correct: 0
    explanation: A deleted file held open keeps its blocks allocated. Restarting or reloading the owning process
      releases them. Deleting other logs, rebuilding, or disabling logging are disproportionate or harmful.
    reference:
      label: 'Linux man-pages: lsof(8)'
      url: https://man7.org/linux/man-pages/man8/lsof.8.html
    career: Linux systems administrator
  - id: linuxplus-1-02
    domain: '1'
    objective: 1.5 Use shell and networking tools.
    difficulty: starter
    style: scenario
    prompt: Which command lists listening TCP sockets with process IDs?
    options:
    - ss -tlnp
    - ls -l
    - df -h
    - ip route
    correct: 0
    explanation: ss -tlnp shows TCP listeners, numeric ports, and the owning process. ls lists files, df shows filesystem
      space, and ip route shows the routing table.
    reference:
      label: ss(8) manual
      url: https://man7.org/linux/man-pages/man8/ss.8.html
    career: Linux systems administrator
  - id: linuxplus-2-02
    domain: '2'
    objective: 2.2 Manage users and groups.
    difficulty: starter
    style: scenario
    prompt: Which command creates a user and a home directory?
    options:
    - useradd -m
    - userdel -r
    - passwd -l
    - groupmod
    correct: 0
    explanation: useradd -m creates the home directory. userdel -r removes a user and home, passwd -l locks a password,
      and groupmod changes a group.
    reference:
      label: useradd(8) manual
      url: https://man7.org/linux/man-pages/man8/useradd.8.html
    career: Systems administrator
  - id: linuxplus-3-02
    domain: '3'
    objective: 3.3 Apply OS hardening and access controls.
    difficulty: standard
    style: scenario
    prompt: Which practice safely edits sudo privileges?
    options:
    - Use visudo to edit /etc/sudoers
    - Edit /etc/sudoers directly with any editor
    - chmod 777 /etc/sudoers
    - Add every user to the wheel group without review
    correct: 0
    explanation: visudo validates syntax and prevents concurrent edits. Direct edits can lock out administration,
      world-writable sudoers is a critical exposure, and unreviewed wheel membership defeats least privilege.
    reference:
      label: sudoers manual
      url: https://www.sudo.ws/docs/man/sudoers.man/
    career: Linux administrator
  - id: linuxplus-4-02
    domain: '4'
    objective: 4.1 Automate tasks with systemd and scripts.
    difficulty: standard
    style: scenario
    prompt: Which systemd unit runs a task on a schedule?
    options:
    - A timer unit
    - A socket unit
    - A target unit
    - A mount unit
    correct: 0
    explanation: A timer unit schedules activation of a service. Socket units activate on socket traffic, targets
      group units, and mount units manage filesystems.
    reference:
      label: systemd.timer manual
      url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html
    career: Automation engineer
  - id: linuxplus-5-02
    domain: '5'
    objective: 5.1 Troubleshoot system and service issues.
    difficulty: starter
    style: scenario
    prompt: A service fails to start. Which command shows its recent logs?
    options:
    - journalctl -u <service>
    - dmesg -w
    - last
    - top
    correct: 0
    explanation: journalctl -u filters the journal by unit and shows recent service messages. dmesg shows kernel
      messages, last shows logins, and top shows live processes.
    reference:
      label: journalctl(1) manual
      url: https://man7.org/linux/man-pages/man1/journalctl.1.html
    career: Site reliability engineer
  careers:
  - Linux systems administrator
  - Systems engineer
  - Cloud operations engineer
  - Site reliability engineer
  - Systems administrator
  - Linux administrator
  - Automation engineer
- id: microsoft-sc-900
  name: Microsoft SC-900
  code: SC-900
  url: https://learn.microsoft.com/en-us/credentials/certifications/security-compliance-and-identity-fundamentals/
