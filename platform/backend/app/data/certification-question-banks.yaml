  domains:
  - id: '1'
    name: Security, Compliance, and Identity Concepts
    weight: 10
  - id: '2'
    name: Microsoft Entra
    weight: 25
  - id: '3'
    name: Microsoft Security Solutions
    weight: 35
  - id: '4'
    name: Microsoft Compliance Solutions
    weight: 30
  questions:
  - id: sc900-2-01
    domain: '2'
    objective: 2.1 Describe identity concepts.
    difficulty: starter
    style: scenario
    prompt: A company wants one identity for each user across Microsoft 365 and third-party apps. Which Microsoft
      cloud service is the primary identity provider?
    options:
    - Microsoft Entra ID
    - Microsoft Defender for Endpoint
    - Azure Cost Management
    - Microsoft Purview
    correct: 0
    explanation: Microsoft Entra ID provides identity and access management for users, apps, and devices. Defender,
      Cost Management, and Purview serve different roles.
    reference:
      label: Microsoft Entra documentation
      url: https://learn.microsoft.com/en-us/entra/
    career: Identity and access administrator
  - id: sc900-3-01
    domain: '3'
    objective: 3.2 Describe Microsoft Defender XDR.
    difficulty: standard
    style: scenario
    prompt: Which capability BEST describes Microsoft Defender XDR?
    options:
    - Correlated detection and response across email, endpoints, identity, and cloud apps
    - A spreadsheet for licence renewals
    - A backup service for virtual machines
    - A public DNS resolver
    correct: 0
    explanation: Defender XDR correlates signals across Microsoft security products to detect and respond to cross-domain
      attacks. It is not a licensing, backup, or DNS service.
    reference:
      label: Microsoft Defender XDR documentation
      url: https://learn.microsoft.com/en-us/defender-xdr/
    career: Identity and access administrator
  - id: sc900-1-01
    domain: '1'
    objective: 1.1 Describe the Zero Trust model.
    difficulty: standard
    style: scenario
    prompt: Which principle is central to Zero Trust?
    options:
    - Verify explicitly and assume breach
    - Trust every device on the corporate network
    - Use one shared administrator password
    - Disable logging to reduce noise
    correct: 0
    explanation: Zero Trust verifies every request explicitly and assumes breach. Trusting a network location or
      sharing credentials contradicts the model, and logging is essential.
    reference:
      label: 'Microsoft: Zero Trust guidance'
      url: https://learn.microsoft.com/en-us/security/zero-trust/
    career: Identity and access administrator
  - id: sc900-1-02
    domain: '1'
    objective: 1.1 Describe security and compliance concepts.
    difficulty: starter
    style: scenario
    prompt: Which model assumes no implicit trust based on network location?
    options:
    - Zero Trust
    - Perimeter security
    - Castle-and-moat
    - A flat network
    correct: 0
    explanation: Zero Trust verifies explicitly and assumes breach regardless of network location. Perimeter, castle-and-moat,
      and flat-network models rely on location or a single boundary.
    reference:
      label: 'NIST SP 800-207: Zero Trust Architecture'
      url: https://csrc.nist.gov/pubs/sp/800/207/final
    career: Security architect
  - id: sc900-2-02
    domain: '2'
    objective: 2.2 Describe Microsoft Entra capabilities.
    difficulty: standard
    style: scenario
    prompt: Which Entra feature evaluates signals and enforces access policies?
    options:
    - Conditional Access
    - Microsoft Intune
    - Azure Policy
    - Microsoft Defender for Cloud
    correct: 0
    explanation: Conditional Access evaluates user, device, location, and risk signals before granting access. Intune
      manages devices, Azure Policy governs Azure resources, and Defender for Cloud protects cloud workloads.
    reference:
      label: 'Microsoft Learn: Conditional Access overview'
      url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
    career: Identity administrator
  - id: sc900-2-03
    domain: '2'
    objective: 2.3 Describe authentication and identity protection.
    difficulty: standard
    style: scenario
    prompt: Which sign-in method is phishing-resistant and passwordless?
    options:
    - A FIDO2 security key
    - An SMS one-time code
    - A security question
    - A voice call
    correct: 0
    explanation: FIDO2 security keys bind the credential to the origin and resist phishing. SMS, security questions,
      and voice calls can be intercepted or socially engineered.
    reference:
      label: 'Microsoft Learn: Passwordless authentication'
      url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passwordless
    career: Identity administrator
  - id: sc900-3-02
    domain: '3'
    objective: 3.2 Describe Microsoft security solutions.
    difficulty: starter
    style: scenario
    prompt: Which Microsoft solution protects endpoints from malware and attacks?
    options:
    - Microsoft Defender for Endpoint
    - Microsoft Purview
    - Microsoft Entra ID
    - Azure Bastion
    correct: 0
    explanation: Defender for Endpoint provides endpoint detection and response. Purview covers data governance
      and compliance, Entra ID provides identity, and Bastion provides managed remote access.
    reference:
      label: 'Microsoft Learn: Defender for Endpoint'
      url: https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-endpoint
    career: SOC analyst
  - id: sc900-4-02
    domain: '4'
    objective: 4.1 Describe Microsoft compliance solutions.
    difficulty: standard
    style: scenario
    prompt: Which tool maps controls to regulations and tracks improvement actions?
    options:
    - Microsoft Purview Compliance Manager
    - Microsoft Defender XDR
    - Microsoft Entra ID
    - Azure Monitor
    correct: 0
    explanation: Compliance Manager provides assessments, controls, and improvement actions. Defender XDR detects
      attacks, Entra ID manages identity, and Azure Monitor observes resources.
    reference:
      label: 'Microsoft Learn: Purview Compliance Manager'
      url: https://learn.microsoft.com/en-us/purview/compliance-manager
    career: Compliance analyst
  careers:
