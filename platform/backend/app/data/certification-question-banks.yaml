  questions:
  - id: secplus-1-01
    domain: '1'
    objective: 1.2 Compare and contrast security concepts.
    difficulty: standard
    style: scenario
    prompt: A team wants to reduce the impact of a stolen laptop. Which control BEST limits the usefulness of the
      data if the disk is removed?
    options:
    - Full-disk encryption tied to a TPM
    - A screen-lock timeout
    - A cable lock
    - A privacy screen
    correct: 0
    explanation: Full-disk encryption protects data at rest even if the drive is removed. A screen lock, cable lock,
      and privacy screen reduce other risks but do not protect the data on the disk.
    reference:
      label: CompTIA Security+ exam objectives
      url: https://www.comptia.org/certifications/security#examdetails
    career: SOC analyst
  - id: secplus-2-01
    domain: '2'
    objective: 2.3 Explain various types of vulnerabilities.
    difficulty: standard
    style: scenario
    prompt: A web application reflects user input into the page without encoding it. Which vulnerability is MOST
      likely?
    options:
    - Cross-site scripting
    - SQL injection
    - Directory traversal
    - Race condition
    correct: 0
    explanation: Reflecting unencoded input into HTML lets an attacker inject script that runs in another user's
      browser. SQL injection targets the database, directory traversal targets file paths, and a race condition
      is a timing flaw.
    reference:
      label: OWASP Cross Site Scripting Prevention Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    career: SOC analyst
  - id: secplus-4-01
    domain: '4'
    objective: 4.8 Explain incident response activities.
    difficulty: standard
    style: scenario
    prompt: An analyst confirms a workstation is infected and isolates it from the network. Which incident response
      phase is this?
    options:
    - Containment
    - Preparation
    - Eradication
    - Lessons learned
    correct: 0
    explanation: Isolation limits spread and is part of containment. Eradication removes the cause, preparation
      happens before the incident, and lessons learned happens after recovery.
    reference:
      label: 'NIST SP 800-61: Incident Handling Guide'
      url: https://csrc.nist.gov/pubs/sp/800/61/r2/final
    career: SOC analyst
  - id: secplus-4-02
    domain: '4'
    objective: 4.6 Use mitigation techniques and controls.
    difficulty: advanced
    style: scenario
    prompt: A service account needs to read one object store bucket and nothing else. Which control BEST applies
      least privilege?
    options:
    - A scoped role limited to that bucket and read actions
    - A shared administrator key stored in the application
    - A network ACL that allows the whole subnet
    - A long-lived access key rotated once a year
    correct: 0
    explanation: A scoped role grants only the required actions on the required resource. Shared administrator keys,
      broad network rules, and long-lived keys all exceed the required privilege.
    reference:
      label: 'NIST SP 800-53: Access Control (AC)'
      url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home?element=AC
    career: SOC analyst
  - id: secplus-1-02
    domain: '1'
    objective: 1.1 Explain the importance of security concepts in an enterprise environment.
    difficulty: starter
    style: scenario
    prompt: A helpdesk role must reset passwords but must not change group membership. Which principle does this
      illustrate?
    options:
    - Least privilege
    - Separation of duties
    - Defense in depth
    - Zero trust
    correct: 0
    explanation: Least privilege gives each role only the access required to do the job. Separation of duties prevents
      one person from controlling every step, defense in depth layers controls, and zero trust removes implicit
      network trust.
    reference:
      label: 'NIST SP 800-53 AC-6: Least Privilege'
      url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    career: IT support technician
  - id: secplus-2-02
    domain: '2'
    objective: 2.2 Explain common threat vectors and attack surfaces.
    difficulty: standard
    style: scenario
    prompt: An email asks a user to scan a QR code to re-authenticate to payroll. The code opens a look-alike login
      page. Which attack is this?
    options:
    - Quishing
    - Smishing
    - Vishing
    - Whaling
    correct: 0
    explanation: Quishing is phishing delivered through a QR code. Smishing uses SMS text, vishing uses voice calls,
      and whaling targets senior executives with a tailored message.
    reference:
      label: 'CISA: Recognize and report phishing'
      url: https://www.cisa.gov/secure-our-world/recognize-and-report-phishing
    career: SOC analyst
  - id: secplus-3-02
    domain: '3'
    objective: 3.1 Compare and contrast security implications of different architecture models.
    difficulty: advanced
    style: scenario
    prompt: A plant network must share inventory data with the corporate ERP but must not expose PLCs to the corporate
      LAN. Which design is BEST?
    options:
    - An industrial DMZ with a firewall between IT and OT
    - A flat network shared by IT and OT
    - A VPN from every PLC directly to ERP
    - Direct public-cloud access for each PLC
    correct: 0
    explanation: An industrial DMZ brokers the data flow and keeps OT devices off the corporate LAN. A flat network
      removes the boundary, direct PLC tunnels widen the attack surface, and public exposure is worse.
    reference:
      label: 'NIST SP 800-82 Rev. 3: Guide to OT Security'
      url: https://csrc.nist.gov/pubs/sp/800/82/r3/final
    career: Network security engineer
  - id: secplus-4-03
    domain: '4'
    objective: 4.4 Explain security alerting and monitoring concepts and tools.
    difficulty: standard
    style: scenario
    prompt: Which log source is MOST useful for detecting credential stuffing against a web application?
    options:
    - WAF and authentication logs showing many usernames from one source
    - DNS query logs only
    - DHCP lease logs only
    - File-integrity logs only
    correct: 0
    explanation: Credential stuffing produces many failed authentication attempts across usernames from a small
      set of sources. WAF and authentication logs capture that pattern directly; DNS, DHCP, and file-integrity logs
      do not.
    reference:
      label: OWASP Logging Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    career: SOC analyst
  - id: secplus-5-02
    domain: '5'
    objective: 5.1 Summarize elements of effective security governance.
    difficulty: standard
    style: scenario
    prompt: A vendor requests a completed security questionnaire before a contract renewal. Which process owns this
      review?
    options:
    - Third-party risk management
    - Incident response
    - Change management
    - Asset disposal
    correct: 0
    explanation: Third-party risk management assesses vendors before and during a relationship. Incident response
      handles active events, change management controls changes, and asset disposal covers end-of-life media.
    reference:
      label: 'NIST Cybersecurity Framework 2.0: Supply chain risk'
      url: https://www.nist.gov/cyberframework
    career: GRC analyst
  careers:
  - SOC analyst
  - Security administrator
  - Junior penetration tester
  - IT auditor
  - IT support technician
  - Network security engineer
  - GRC analyst
- id: comptia-cysa-plus
  name: CompTIA CySA+
  code: CS0-004
  url: https://www.comptia.org/en-us/certifications/cybersecurity-analyst/v4/
  objectives_url: https://www.comptia.org/en-us/certifications/cybersecurity-analyst/v4/
  tracks:
