version: '1.0'
reviewed_at: '2026-11-12'
status: admin-curated; original practice mapped to current public objectives and career pathways
notes: 'These are original practice items written to published objectives and public, openly available references.
  They are not copied exam questions and are not a certification exam. Every item carries the objective it tests,
  an authoritative public reference, and a career pathway. Questions are sampled by exercise relevance: the engine
  maps a lab''s track and competency to the pathway domains below.'
