  - Compliance analyst
  - Microsoft 365 administrator
  - Security architect
  - Identity administrator
  - SOC analyst
- id: isc2-cc
  name: ISC2 Certified in Cybersecurity
  code: CC
  url: https://www.isc2.org/certifications/cc
  objectives_url: https://www.isc2.org/certifications/cc
  tracks:
  - high-school
  - network
  - linux
  domains:
  - id: '1'
    name: Security Principles
    weight: 26
  - id: '2'
    name: Business Continuity, Disaster Recovery, and Incident Response
    weight: 10
  - id: '3'
    name: Access Control Concepts
    weight: 22
  - id: '4'
    name: Network Security
    weight: 24
  - id: '5'
    name: Security Operations
    weight: 18
  questions:
  - id: cc-1-01
    domain: '1'
    objective: 1.1 Understand the security concepts of information assurance.
    difficulty: starter
    style: scenario
    prompt: Which trio describes confidentiality, integrity, and availability?
    options:
    - The CIA triad
    - The OSI model
    - The TCP handshake
    - The SDLC
    correct: 0
    explanation: Confidentiality, integrity, and availability form the CIA triad, the core model for information
      security.
    reference:
      label: 'NIST SP 800-12: An Introduction to Information Security'
      url: https://csrc.nist.gov/pubs/sp/800/12/r1/final
    career: Security analyst
  - id: cc-3-01
    domain: '3'
    objective: 3.1 Understand access control concepts.
    difficulty: standard
    style: scenario
    prompt: A user needs temporary access to a finance folder for a month. Which approach follows least privilege?
    options:
    - Grant a time-bound role for that folder
    - Add the user to the domain administrators group
    - Share a finance administrator password
    - Give permanent access to every folder
    correct: 0
    explanation: A time-bound role grants only the access needed for the required period. Administrator rights,
      shared passwords, and permanent broad access exceed the need.
    reference:
      label: 'NIST SP 800-53: Access Control (AC)'
      url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home?element=AC
    career: Security analyst
  - id: cc-4-01
    domain: '4'
    objective: 4.1 Understand network security.
    difficulty: standard
    style: scenario
    prompt: Which device primarily enforces rules between network segments?
    options:
    - A firewall
    - A keyboard
    - A monitor
    - A UPS
    correct: 0
    explanation: A firewall enforces traffic rules between segments. A keyboard, monitor, and UPS are not network
      policy devices.
    reference:
      label: 'NIST SP 800-41: Guidelines on Firewalls and Firewall Policy'
      url: https://csrc.nist.gov/pubs/sp/800/41/r1/final
    career: Security analyst
  - id: cc-5-01
    domain: '5'
    objective: 5.1 Understand security operations.
    difficulty: standard
    style: scenario
    prompt: What is the primary purpose of logging security events?
    options:
    - To detect, investigate, and reconstruct activity
    - To make the disk fill faster
    - To replace access control
    - To guarantee no incidents occur
    correct: 0
    explanation: Logs provide evidence for detection, investigation, and reconstruction. They do not replace access
      control or guarantee that incidents will not happen.
    reference:
      label: 'NIST SP 800-92: Guide to Computer Security Log Management'
      url: https://csrc.nist.gov/pubs/sp/800/92/final
    career: Security analyst
  - id: cc-1-02
    domain: '1'
    objective: 1.2 Understand security principles.
    difficulty: starter
    style: scenario
    prompt: Which principle gives users only the access required for their job?
    options:
    - Least privilege
    - Separation of duties
    - Defense in depth
    - Availability
    correct: 0
    explanation: Least privilege limits access to what the job needs. Separation of duties divides sensitive tasks,
      defense in depth layers controls, and availability keeps systems usable.
    reference:
      label: 'NIST SP 800-53 AC-6: Least Privilege'
      url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    career: Security analyst
  - id: cc-2-02
    domain: '2'
    objective: 2.2 Understand incident response and business continuity.
    difficulty: starter
    style: scenario
    prompt: Which incident response phase comes first?
    options:
    - Preparation
    - Containment
    - Eradication
    - Recovery
    correct: 0
    explanation: Preparation builds the plan, roles, and tools before an incident. Containment, eradication, and
      recovery follow detection and analysis.
    reference:
      label: 'NIST SP 800-61 Rev. 2: Incident Handling Guide'
      url: https://csrc.nist.gov/pubs/sp/800/61/r2/final
    career: Incident responder
  - id: cc-3-02
    domain: '3'
    objective: 3.1 Understand access control concepts.
    difficulty: standard
    style: scenario
    prompt: Which access control model assigns permissions through job roles?
    options:
    - Role-based access control
    - Discretionary access control
    - Mandatory access control
    - Rule-based access control
    correct: 0
    explanation: RBAC grants permissions to roles and assigns users to roles. DAC lets owners decide, MAC uses labels
      and clearances, and rule-based control applies explicit rules such as time or location.
    reference:
      label: 'NIST SP 800-53: Access Control family'
      url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    career: Access control administrator
  - id: cc-4-02
    domain: '4'
    objective: 4.1 Understand network security.
    difficulty: starter
    style: scenario
    prompt: Which protocol provides encrypted web traffic?
    options:
    - TLS
    - HTTP
    - FTP
    - Telnet
    correct: 0
    explanation: TLS encrypts and authenticates web sessions. HTTP is plaintext, FTP sends credentials in clear
      text, and Telnet is an unencrypted remote shell.
    reference:
      label: 'NIST SP 800-52 Rev. 2: TLS Guidelines'
      url: https://csrc.nist.gov/pubs/sp/800/52/r2/final
    career: Network security analyst
  - id: cc-5-02
    domain: '5'
    objective: 5.1 Understand security operations.
    difficulty: standard
    style: scenario
    prompt: What does a cryptographic hash primarily provide?
    options:
    - Integrity
    - Confidentiality
    - Availability
    - Non-repudiation by itself
    correct: 0
    explanation: A hash detects changes and supports integrity checks. It does not hide data, keep a service available,
      or by itself prove who sent a message.
    reference:
      label: 'FIPS 180-4: Secure Hash Standard'
      url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
    career: Security operations analyst
  careers:
  - Security analyst
  - Access control administrator
  - Junior SOC analyst
  - IT support technician
  - Incident responder
  - Network security analyst
  - Security operations analyst
