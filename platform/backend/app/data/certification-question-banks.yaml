    prompt: A user changes the account ID in a URL and sees another customer's invoice. Which category is this?
    options:
    - Broken access control
    - Cryptographic failure
    - Security misconfiguration
    - Vulnerable component
    correct: 0
    explanation: Changing an identifier to reach another user's object is an insecure direct object reference, a
      form of broken access control. Authorization must be checked on the server for every object.
    reference:
      label: 'OWASP Top 10: A01 Broken Access Control'
      url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    career: Application security engineer
  - id: owasp-a03-01
    domain: A03
    objective: A03:2021 Injection.
    difficulty: standard
    style: scenario
    prompt: Which control MOST directly prevents SQL injection?
    options:
    - Parameterized queries
    - A longer password policy
    - A web application firewall only
    - Disabling error messages
    correct: 0
    explanation: Parameterized queries keep data separate from SQL syntax. A WAF can help but is not a substitute,
      and password or error-message changes do not fix the flaw.
    reference:
      label: OWASP SQL Injection Prevention Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    career: Application security engineer
  - id: owasp-a10-01
    domain: A10
    objective: A10:2021 Server-Side Request Forgery.
    difficulty: advanced
    style: scenario
    prompt: An application fetches a URL supplied by the user. Which control BEST reduces SSRF risk?
    options:
    - Allow-list approved destinations and block internal ranges
    - Trust any URL that starts with https
    - Hide the URL from the browser
    - Increase the request timeout
    correct: 0
    explanation: An allow-list plus blocking internal/link-local ranges prevents the server from being used to reach
      protected services. HTTPS alone does not make a destination safe.
    reference:
      label: 'OWASP: Server-Side Request Forgery Prevention Cheat Sheet'
      url: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    career: Application security engineer
  - id: owasp-a05-01
    domain: A05
    objective: A05:2021 Security Misconfiguration.
    difficulty: starter
    style: scenario
    prompt: A cloud storage bucket is readable by anyone on the internet. Which category does this illustrate?
    options:
    - Security misconfiguration
    - Injection
    - Broken authentication
    - Software supply-chain failure
    correct: 0
    explanation: An unintended public permission is a security misconfiguration. The fix is to remove public access
      and enforce least privilege.
    reference:
      label: 'OWASP Top 10: A05 Security Misconfiguration'
      url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
    career: Application security engineer
  - id: owasp-a02-01
    domain: A02
    objective: A02:2021 Cryptographic Failures
    difficulty: standard
    style: scenario
    prompt: Passwords are stored as unsalted SHA-256 hashes. Which fix is BEST?
    options:
    - Argon2id with a unique salt per password
    - SHA-512 instead of SHA-256
    - MD5 for faster verification
    - Base64 encoding before hashing
    correct: 0
    explanation: Argon2id is a memory-hard password hash and a unique salt prevents precomputation. SHA-512 is still
      fast and unsalted, MD5 is broken, and Base64 is encoding, not protection.
    reference:
      label: OWASP Password Storage Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    career: Application security engineer
  - id: owasp-a04-01
    domain: A04
    objective: A04:2021 Insecure Design
    difficulty: standard
    style: scenario
    prompt: Which control reduces unlimited password-reset abuse?
    options:
    - Rate limiting and risk-based verification
    - Longer passwords only
    - Hiding the reset page
    - Disabling MFA
    correct: 0
    explanation: Rate limits and risk checks stop repeated reset attempts and account enumeration. Password length
      does not limit reset abuse, hidden pages are not a control, and disabling MFA weakens security.
    reference:
      label: 'OWASP ASVS: Authentication verification'
      url: https://owasp.org/www-project-application-security-verification-standard/
    career: Web developer
  - id: owasp-a06-01
    domain: A06
    objective: A06:2021 Vulnerable and Outdated Components
    difficulty: standard
    style: scenario
    prompt: Which practice BEST manages a vulnerable third-party library?
    options:
    - Track components with an SBOM or SCA tool and patch by risk
    - Copy the library into the repository
    - Ignore it if the application still works
    - Disable application logging
    correct: 0
    explanation: An SBOM or software-composition analysis identifies versions and exposure so patches can be prioritized.
      Vendoring without tracking, ignoring the finding, or disabling logs does not remove the vulnerability.
    reference:
      label: 'OWASP Top 10 A06: Vulnerable and Outdated Components'
      url: https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
    career: Security code reviewer
  - id: owasp-a07-01
    domain: A07
    objective: A07:2021 Identification and Authentication Failures
    difficulty: standard
    style: scenario
    prompt: Which MFA method is most resistant to phishing?
    options:
    - A FIDO2 passkey
    - An SMS one-time code
    - An email one-time code
    - A security question
    correct: 0
    explanation: FIDO2 passkeys are bound to the origin and resist relay and phishing pages. SMS, email codes, and
      security questions can be intercepted, redirected, or guessed.
    reference:
      label: OWASP Multifactor Authentication Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html
    career: Application security engineer
  - id: owasp-a08-01
    domain: A08
    objective: A08:2021 Software and Data Integrity Failures
    difficulty: advanced
    style: scenario
    prompt: Which control protects a CI/CD artifact from tampering?
    options:
    - Sign artifacts and verify provenance before deployment
    - Store artifacts in a public bucket
    - Disable version pinning
    - Use long-lived administrator keys
    correct: 0
    explanation: Signing and provenance verification let the deploy step reject altered artifacts. Public storage,
      unpinned versions, and long-lived admin keys increase the chance of tampering or misuse.
    reference:
      label: 'SLSA: Supply-chain Levels for Software Artifacts'
      url: https://slsa.dev/
    career: Application security engineer
  - id: owasp-a09-01
    domain: A09
    objective: A09:2021 Security Logging and Monitoring Failures
    difficulty: standard
    style: scenario
    prompt: Which log pattern BEST indicates a credential attack?
    options:
    - Many failed logins followed by a success from the same source
    - A single 404 response
    - A slow page load
    - A DNS query for a public site
    correct: 0
    explanation: A burst of failures followed by success is the classic credential-attack signature. A single 404,
      slow page, or normal DNS query has little diagnostic value on its own.
    reference:
      label: OWASP Logging Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    career: SOC analyst
  careers:
  - Application security engineer
  - Web developer
  - Penetration tester
  - Security code reviewer
  - SOC analyst
- id: owasp-llm-top-10
  name: OWASP Top 10 for LLM Applications
  code: '2025'
  url: https://genai.owasp.org/llm-top-10/
  objectives_url: https://genai.owasp.org/llm-top-10/
  tracks:
  - ai
  domains:
  - id: LLM01
    name: Prompt Injection
    weight: 0
  - id: LLM05
    name: Improper Output Handling
    weight: 0
  - id: LLM06
    name: Excessive Agency
    weight: 0
  - id: LLM04
    name: Data and Model Poisoning
    weight: 0
  - id: LLM02
    name: Sensitive Information Disclosure
    weight: 0
  - id: LLM03
    name: Supply Chain
    weight: 0
  - id: LLM07
    name: System Prompt Leakage
    weight: 0
  - id: LLM08
    name: Vector and Embedding Weaknesses
    weight: 0
  - id: LLM09
    name: Misinformation
    weight: 0
  - id: LLM10
    name: Unbounded Consumption
    weight: 0
  questions:
  - id: llm-01-01
    domain: LLM01
    objective: 'LLM01: Prompt Injection.'
    difficulty: standard
    style: scenario
    prompt: A retrieved document contains instructions that tell the model to ignore its system prompt. Which risk
      is this?
    options:
    - Indirect prompt injection
    - Improper output handling
    - Model denial of service
    - Supply-chain compromise
    correct: 0
    explanation: Instructions hidden in retrieved content are indirect prompt injection. The model may treat untrusted
      content as instructions.
    reference:
      label: 'OWASP LLM01: Prompt Injection'
      url: https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    career: AI security engineer
  - id: llm-05-01
    domain: LLM05
    objective: 'LLM05: Improper Output Handling.'
    difficulty: standard
    style: scenario
    prompt: Model output is inserted into a web page without encoding. Which risk is MOST direct?
    options:
    - Cross-site scripting through model output
    - A stronger model
    - Faster inference
    - Lower token cost
    correct: 0
    explanation: Unencoded model output can carry script into the page. Treat model output as untrusted input and
      encode or sanitize it for the destination context.
    reference:
      label: 'OWASP LLM05: Improper Output Handling'
      url: https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    career: AI security engineer
  - id: llm-06-01
    domain: LLM06
    objective: 'LLM06: Excessive Agency.'
    difficulty: advanced
    style: scenario
    prompt: An agent can call any internal API without approval. Which mitigation BEST reduces excessive agency?
    options:
    - Limit tools to the minimum required and require confirmation for high-impact actions
    - Give the agent administrator credentials
    - Remove all logging
    - Increase the context window
    correct: 0
    explanation: Least-privilege tools and human confirmation for destructive actions reduce excessive agency. Broader
      credentials and less logging increase risk.
    reference:
      label: 'OWASP LLM06: Excessive Agency'
      url: https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
    career: AI security engineer
  - id: llm-04-01
    domain: LLM04
    objective: 'LLM04: Data and Model Poisoning.'
    difficulty: advanced
    style: scenario
    prompt: An attacker adds misleading records to a model's training data. Which risk is this?
    options:
    - Data poisoning
    - Prompt injection
    - Model theft
    - Denial of service
    correct: 0
    explanation: Training-data manipulation is data poisoning. It can bias or degrade model behaviour and is different
      from injecting instructions at inference time.
    reference:
      label: 'OWASP LLM04: Data and Model Poisoning'
      url: https://genai.owasp.org/llmrisk/llm042025-data-and-model-poisoning/
    career: AI security engineer
  - id: llm-02-01
    domain: LLM02
    objective: LLM02:2025 Sensitive Information Disclosure
    difficulty: standard
    style: scenario
    prompt: A model repeats sensitive data from its training set. Which control is BEST?
    options:
    - Data minimization and redaction, plus output filtering
    - A larger context window
    - A higher temperature
    - Disabling all logging
    correct: 0
    explanation: Minimize and redact sensitive training data, then filter outputs for sensitive patterns. A larger
      context or higher temperature does not remove memorized data, and disabling logs hides the problem.
    reference:
      label: OWASP LLM02:2025 Sensitive Information Disclosure
      url: https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    career: AI security engineer
  - id: llm-03-01
    domain: LLM03
    objective: LLM03:2025 Supply Chain
    difficulty: standard
    style: scenario
    prompt: Which practice reduces model supply-chain risk?
    options:
    - Verify model provenance, checksums, and provider contracts
    - Download models from any public mirror
    - Disable dependency pinning
    - Install unverified plugins
    correct: 0
    explanation: Provenance, checksums, and contracts establish what model is running and who supplied it. Unverified
      mirrors, unpinned dependencies, and unverified plugins introduce tampering and licensing risk.
    reference:
      label: OWASP LLM03:2025 Supply Chain
      url: https://genai.owasp.org/llmrisk/llm032025-supply-chain/
    career: ML engineer
  - id: llm-07-01
    domain: LLM07
    objective: LLM07:2025 System Prompt Leakage
    difficulty: advanced
    style: scenario
    prompt: Which design limits the impact of system-prompt leakage?
    options:
    - Keep secrets out of prompts and enforce authorization server-side
    - Put API keys in the system prompt
    - Rely on prompt secrecy for access control
    - Publish the prompt in the UI
    correct: 0
    explanation: Assume the prompt can leak. Keep credentials out of it and enforce authorization in the application.
      Prompt secrecy is not an access-control boundary, and publishing secrets is worse.
    reference:
      label: OWASP LLM07:2025 System Prompt Leakage
      url: https://genai.owasp.org/llmrisk/llm072025-system-prompt-leakage/
    career: AI governance analyst
  - id: llm-08-01
    domain: LLM08
    objective: LLM08:2025 Vector and Embedding Weaknesses
    difficulty: advanced
    style: scenario
    prompt: Which control reduces poisoning risk in a retrieval-augmented generation system?
    options:
    - Validate sources and enforce access control on the vector store
    - Accept every uploaded document without review
    - Disable document review
    - Share one index across all tenants
    correct: 0
    explanation: Source validation and per-tenant access control keep untrusted or unauthorized content out of retrieval.
      Unreviewed uploads, no review, and a shared index increase poisoning and cross-tenant leakage.
    reference:
      label: OWASP LLM08:2025 Vector and Embedding Weaknesses
      url: https://genai.owasp.org/llmrisk/llm082025-vector-and-embedding-weaknesses/
    career: AI security engineer
  - id: llm-09-01
    domain: LLM09
    objective: LLM09:2025 Misinformation
    difficulty: standard
    style: scenario
    prompt: Which control BEST addresses hallucinated answers in a high-impact workflow?
    options:
    - Ground answers with citations and require human review
    - Increase the temperature
    - Remove all source links
    - Trust the model unconditionally
    correct: 0
    explanation: Grounding and human review catch unsupported claims before they affect a decision. Higher temperature
      increases variation, removing sources hides evidence, and unconditional trust removes the safety net.
    reference:
      label: OWASP LLM09:2025 Misinformation
      url: https://genai.owasp.org/llmrisk/llm092025-misinformation/
    career: AI governance analyst
  - id: llm-10-01
    domain: LLM10
    objective: LLM10:2025 Unbounded Consumption
    difficulty: standard
    style: scenario
    prompt: Which control limits unbounded consumption?
    options:
    - Rate limits, token budgets, and timeouts
    - Unlimited retries
    - No per-user quotas
    - Public administrator keys
    correct: 0
    explanation: Rate limits, token budgets, and timeouts bound cost and availability impact. Unlimited retries,
      no quotas, and public admin keys increase both cost and risk.
    reference:
      label: OWASP LLM10:2025 Unbounded Consumption
      url: https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    career: AI security engineer
  careers:
  - AI security engineer
  - ML engineer
  - AI governance analyst
  - Application security engineer
