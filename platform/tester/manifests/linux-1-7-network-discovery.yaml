lab_id: linux-1-7-network-discovery
track: Linux
difficulty: beginner
source: platform/labs/Linux/linux-1-7-network-discovery/lab.yaml
expected_services:
- port: 21
  protocol: tcp
- port: 22
  protocol: tcp
- port: 80
  protocol: tcp
- port: 8888
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr/tester:current
  command: /tests/linux-1-7-network-discovery.sh
  steps:
  - name: Port scan discovers multiple services
    command: nmap -sV -p 21,22,80,8888 {target.target} 2>&1 | grep -c open
    expect: '4'
  - name: Extract token 1 from web page source
    command: 'curl -s http://{target.target}/ | grep -o ''Token: [a-z0-9_]*'' | awk ''{print $2}'''
    expect: sc4nn3d
  - name: Extract token 2 from FTP anonymous access
    command: curl -s --ftp-port - ftp://{target.target}/token.txt --connect-timeout 10 || curl -s ftp://{target.target}/token.txt --connect-timeout 10
    expect: 4n0n
  - name: Extract token 3 from service banner on port 8888
    command: 'timeout 3 bash -c ''cat < /dev/tcp/{target.target}/8888'' 2>&1 | grep -o ''Token: [a-z0-9_]*'' | awk ''{print $2}'''
    expect: h1dd3n
  - name: Verify complete flag
    command: echo 'OCR{sc4nn3d_4n0n_h1dd3n}'
    expect: OCR{sc4nn3d_4n0n_h1dd3n}
expected_flag_count: 1
expected_flag: OCR{sc4nn3d_4n0n_h1dd3n}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
