lab_id: network-1-2-http-traffic-analysis
track: Network
difficulty: beginner
source: platform/labs/Network/network-1-2-http-traffic-analysis/lab.yaml
expected_services:
- port: 80
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/network-1-2-http-traffic-analysis.sh
  steps:
  - name: HTTP server responds
    command: curl -s -o /dev/null -w '%{http_code}' http://{target.target}/
    expect: '200'
  - name: PCAP file accessible
    command: curl -s -o /dev/null -w '%{http_code}' http://{target.target}/capture.pcap
    expect: '200'
  - name: Flag found in PCAP file
    command: curl -s http://{target.target}/capture.pcap | strings | grep -o 'OCR{[^}]*}' | head -1
    expect: '{flag}'
expected_flag_count: 1
expected_flag: '{flag}'
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 512
max_cpu: 0.5
