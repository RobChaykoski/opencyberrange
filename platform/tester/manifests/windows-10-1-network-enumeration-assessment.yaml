lab_id: windows-10-1-network-enumeration-assessment
track: Windows
difficulty: intermediate
source: platform/labs/Windows/windows-10-1-network-enumeration-assessment/lab.yaml
expected_services:
- port: 80
  protocol: tcp
- port: 445
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/windows-10-1-network-enumeration-assessment.sh
  steps:
  - name: Verify web portal HTTP service is running
    command: curl -s -o /dev/null -w '%{http_code}' http://{target.webportal}/
    expect: '200'
  - name: Retrieve flag part 1 from web portal internal directory
    command: curl -s http://{target.webportal}/internal/patch-notes.txt 2>&1
    expect: m1dt3rm
  - name: Retrieve flag part 2 from fileserver SMB public share
    command: smbclient //{target.fileserver}/public -N -c 'get welcome-packet.txt -' 2>&1
    expect: n3tw0rk
  - name: Retrieve flag part 3 from domain controller SMB server string
    command: smbclient -L //{target.dc} -N 2>&1
    expect: 3num
  - name: Combine flag parts into final flag
    command: echo '{flag}'
    expect: '{flag}'
expected_flag_count: 1
expected_flag: '{flag}'
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
