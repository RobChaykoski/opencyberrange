lab_id: linux-1-3-service-interaction
track: Linux
difficulty: beginner
source: platform/labs/Linux/linux-1-3-service-interaction/lab.yaml
expected_services:
- port: 21
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/linux-1-3-service-interaction.sh
  steps:
  - name: Verify FTP port is open
    command: nc -z -w 5 {target.target} 21 && echo 'port_open'
    expect: port_open
  - name: Detect FTP service with nmap
    command: nmap -Pn -n -p 21 -sV {target.target} 2>&1
    expect: ftp
  - name: Grab FTP banner via netcat
    command: nc -w 5 {target.target} 21 </dev/null 2>&1
    expect: ProFTPD
  - name: Retrieve flag from FTP welcome banner
    command: nc -w 5 {target.target} 21 </dev/null 2>&1 | grep -o 'OCR{[^}]*}'
    expect: '{flag}'
expected_flag_count: 1
expected_flag: '{flag}'
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
