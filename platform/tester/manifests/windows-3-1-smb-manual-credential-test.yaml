lab_id: windows-3-1-smb-manual-credential-test
track: Windows
difficulty: beginner
source: platform/labs/Windows/windows-3-1-smb-manual-credential-test/lab.yaml
expected_services:
- port: 445
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/windows-3-1-smb-manual-credential-test.sh
  steps:
  - name: Verify SMB port 445 is open
    command: nmap -Pn -p 445 {target.target} | grep '445/tcp'
    expect: open
  - name: Authenticate to SMB with valid credentials
    command: smbclient //{target.target}/private -U '{cred.smb-user.user}%{cred.smb-user.pass}' -c 'ls' 2>&1
    expect: flag.txt
  - name: Retrieve flag from SMB private share
    command: smbclient //{target.target}/private -U '{cred.smb-user.user}%{cred.smb-user.pass}' -c 'get flag.txt -' 2>&1
    expect: OCR{
expected_flag_count: 1
expected_flag: '{flag}'
