lab_id: network-1-1-packet-capture-analysis
track: Network
difficulty: intermediate
source: platform/labs/Network/network-1-1-packet-capture-analysis/lab.yaml
expected_services:
- port: 22
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/network-1-1-packet-capture-analysis.sh
  steps:
  - name: SSH to analysis workstation
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'echo connected' 2>&1
    expect: connected
  - name: Verify PCAP file exists
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'test -f /home/analyst/evidence/capture.pcap && echo pcap_found' 2>&1
    expect: pcap_found
  - name: Extract IOC 1 from HTTP POST body
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'tcpdump -r /home/analyst/evidence/capture.pcap -A 2>/dev/null | grep -o "token=[a-z0-9_]*" | sed "s/^token=//" | head -1' 2>&1
    expect: p4ck3t
  - name: Extract IOC 2 from FTP PASS command
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'tcpdump -r /home/analyst/evidence/capture.pcap -A 2>/dev/null | grep -o "PASS [a-z0-9_]*" | sed "s/^PASS //" | head -1' 2>&1
    expect: 4n4lyz3
  - name: Extract IOC 3 from DNS exfiltration query
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'tcpdump -r /home/analyst/evidence/capture.pcap -n port 53 2>/dev/null | grep -o "token_[a-z0-9]*\.data\.evil-c2\.net" | head -1 | sed "s/token_//;s/\..*//"' 2>&1
    expect: 3xf1l
  - name: Assemble and verify complete flag
    command: echo '{flag}'
    expect: '{flag}'
expected_flag_count: 1
expected_flag: '{flag}'
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 1280
max_cpu: 1.25
