lab_id: linux-5-4-suricata-live-detection
track: Linux
difficulty: intermediate
source: platform/labs/Linux/linux-5-4-suricata-live-detection/lab.yaml
expected_services:
- port: 22
  protocol: tcp
- port: 80
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr/tester:current
  command: /tests/linux-5-4-suricata-live-detection.sh
  steps:
  - name: Verify analyst SSH access
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'echo connected' 2>&1
    expect: connected
  - name: Verify Suricata is running on IDS sensor
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'pgrep -x Suricata-Main > /dev/null && echo suricata_running' 2>&1
    expect: suricata_running
  - name: Observe attack traffic arriving on the IDS sensor
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'sudo timeout 25 tcpdump -i eth0 -A -c 5 port 80 2>/dev/null | grep -ci http' 2>&1
    expect: ''
  - name: Write Suricata rules for SQLi and command injection detection
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'printf "alert http any any -> any any (msg:\"SQLi Attack Detected\"; content:\"UNION SELECT\"; nocase; http_uri; sid:1000001; rev:1;)\nalert http any any -> any any (msg:\"Command Injection Detected\"; content:\"cat /etc\"; nocase; http_client_body; sid:1000002; rev:1;)\n" > /etc/suricata/rules/local.rules && sudo kill -USR2 $(pgrep -x Suricata-Main) && echo rules_deployed' 2>&1
    expect: rules_deployed
  - name: Wait for attack cycle and verify Suricata alerts fire
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'sleep 20 && jq -r "select(.alert) | .alert.signature" /var/log/suricata/eve.json 2>/dev/null | sort -u' 2>&1
    expect: Detected
  - name: Extract flag part 1 from SQLi alert payload (campaign tag)
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'jq -r "select(.alert) | select(.alert.signature_id == 1000001) | .http.url" /var/log/suricata/eve.json 2>/dev/null | grep -o "campaign=[^&]*" | sed "s/^campaign=//" | head -1' 2>&1
    expect: d3t3ct
  - name: Extract flag part 2 from CMDi alert payload (exfil tag)
    command: sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst} 'jq -r "select(.alert) | select(.alert.signature_id == 1000002) | .payload_printable" /var/log/suricata/eve.json 2>/dev/null | grep -o "exfil=[^& ]*" | sed "s/^exfil=//" | head -1' 2>&1
    expect: rul3
  - name: SSH to target and extract attacker User-Agent from access log
    command: sshpass -p '{cred.webadmin.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.webadmin.user}@{target.target} 'grep -o "SentinelBreaker/[a-zA-Z0-9_]*" /var/log/nginx/access.log | head -1 | cut -d/ -f2' 2>&1
    expect: wr1t3r
  - name: Assemble and verify complete flag
    command: echo 'OCR{d3t3ct_rul3_wr1t3r}'
    expect: OCR{d3t3ct_rul3_wr1t3r}
expected_flag_count: 1
expected_flag: OCR{d3t3ct_rul3_wr1t3r}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 1280
max_cpu: 1.25
