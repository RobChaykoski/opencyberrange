solver:
  image: ocr-tester:latest
  command: /tests/linux-4-4-encrypted-exfiltration.sh
  steps:
  - name: SSH as operator with sudo
    command: sshpass -p '{cred.operator.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.operator.user}@{target.target} 'sudo whoami' 2>&1
    expect: root
  - name: Decode base64 file for token 1
    command: 'sshpass -p ''{cred.operator.pass}'' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.operator.user}@{target.target} ''base64 -d /var/backups/obsidian/export.b64 | grep -o "assessment_marker: [a-z0-9_]*" | awk "{print \$2}"'' 2>&1'
    expect: 3ncrypt
  - name: Read bash history for GPG password
    command: sshpass -p '{cred.operator.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.operator.user}@{target.target} 'grep passphrase /home/operator/.bash_history' 2>&1
    expect: 0bs1d14n_Vault#
  - name: Decrypt GPG file for token 2
    command: sshpass -p '{cred.operator.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.operator.user}@{target.target} 'gpg --batch --passphrase 0bs1d14n_Vault# -d /opt/obsidian/data/archive.gpg 2>/dev/null | grep -o "marker_value=[a-z0-9_]*" | cut -d= -f2' 2>&1
    expect: d3c0d3
  - name: Decode hex file for token 3
    command: sshpass -p '{cred.operator.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.operator.user}@{target.target} 'cat /opt/obsidian/.cache/.data_store | xxd -r -p' 2>&1
    expect: 3xf1l
  - name: Verify complete flag
    command: echo 'OCR{3ncrypt_d3c0d3_3xf1l}'
    expect: OCR{3ncrypt_d3c0d3_3xf1l}
expected_flag_count: 1
expected_flag: OCR{3ncrypt_d3c0d3_3xf1l}
