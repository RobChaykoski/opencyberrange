lab_id: network-2-3-http-session-hijacking
track: Network
difficulty: intermediate
source: platform/labs/Network/network-2-3-http-session-hijacking/lab.yaml
expected_services:
- port: 22
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/network-2-3-http-session-hijacking.sh
  steps:
  - name: SSH accessible on analyst workstation
    command: nc -w 5 {target.analyst-workstation} 22 </dev/null | head -1
