lab_id: windows-6-1-mssql-service-detection
track: Windows
difficulty: intermediate
source: platform/labs/Windows/windows-6-1-mssql-service-detection/lab.yaml
expected_services:
- port: 3306
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/windows-6-1-mssql-service-detection.sh
  steps:
  - name: Verify MySQL port 3306 is open
    command: nmap -Pn -p 3306 {target.target} | grep '3306/tcp'
    expect: open
  - name: Detect MySQL service version
    command: nmap -Pn -sV -p 3306 {target.target} | grep '3306/tcp'
    expect: mysql
  - name: Query flag from database
    command: mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e 'SELECT content FROM target_db.secrets LIMIT 1' 2>&1
    expect: OCR{
expected_flag_count: 1
expected_flag: OCR{mssql_d3t3ct}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
