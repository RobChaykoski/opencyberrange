lab_id: linux-2-4-ssh-command-execution
track: Linux
difficulty: beginner
source: platform/labs/Linux/linux-2-4-ssh-command-execution/lab.yaml
expected_services:
- port: 22
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/linux-2-4-ssh-command-execution.sh
  steps:
  - name: Verify SSH port is open
    command: nc -z -w 5 {target.target} 22 && echo 'port_open'
    expect: port_open
  - name: SSH banner check
    command: nc -w 5 {target.target} 22 </dev/null | head -1
    expect: SSH
  - name: SSH login and retrieve flag from environment variable
    command: sshpass -p '{cred.ssh-user.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.ssh-user.user}@{target.target} 'env | grep OCR 2>/dev/null || echo $SECURITY_ASSESSMENT_FLAG' 2>&1
    expect: OCR{cmd_3x3c}
expected_flag_count: 1
expected_flag: OCR{cmd_3x3c}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
