- port: 22
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr/tester:current
  command: /tests/network-2-1-ftp-credential-extraction.sh
  steps:
  - name: SSH accessible on analyst workstation
    command: nc -w 5 {target.analyst-workstation} 22 </dev/null | head -1
