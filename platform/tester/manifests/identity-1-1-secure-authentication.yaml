lab_id: identity-1-1-secure-authentication
track: Identity
difficulty: beginner
source: platform/labs/Identity/identity-1-1-secure-authentication/lab.yaml
expected_services:
- port: 80
  protocol: tcp
- port: 8080
  protocol: tcp
health_timeout_seconds: 60
solver:
  image: ocr-tester:latest
  command: /tests/identity-1-1-secure-authentication.sh
  steps:
  - name: Staff portal responds
    command: curl -s -o /dev/null -w '%{http_code}' http://{target.portal}:8080/
