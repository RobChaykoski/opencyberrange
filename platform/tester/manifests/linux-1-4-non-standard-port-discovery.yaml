lab_id: linux-1-4-non-standard-port-discovery
track: Linux
difficulty: beginner
source: platform/labs/Linux/linux-1-4-non-standard-port-discovery/lab.yaml
expected_services:
- port: 22
  protocol: tcp
- port: 80
  protocol: tcp
