title: Secret read from an unusual source address
id: 5e7a1c90-9d22-4f6b-b3a0-ocrcloud003
status: experimental
description: Detects a secret read from a source that has not used the secret before.
references:
  - https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final
author: OpenCyberRange simulated cloud
date: 2026/11/18
tags:
  - attack.credential_access
  - attack.t1552
logsource:
  product: vault
  service: audit
detection:
  selection:
    event: secrets
    action: secret.read
  filter_known:
    source_ip:
      - 10.10.4.0/24
  condition: selection and not filter_known
falsepositives:
  - A new approved service host
  - A disaster-recovery test
level: high
