apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config
  namespace: cloud-lab
data:
  report-id: "IR-2027-014"
  owner: "cloud-analyst"
---
# A lab-only secret. Do not copy this pattern into a real workload.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cloud-lab
type: Opaque
stringData:
  username: svc-cloud
  app_secret: example-not-a-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: cloud-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      serviceAccountName: report-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
