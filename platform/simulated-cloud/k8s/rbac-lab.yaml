apiVersion: v1
kind: Namespace
metadata:
  name: cloud-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-reader
  namespace: cloud-lab
---
# Intentionally over-permissive. The learner narrows it to get/list on the
# report ConfigMap only, then proves the denied actions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-reader
  namespace: cloud-lab
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-reader
  namespace: cloud-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-reader
subjects:
  - kind: ServiceAccount
    name: report-reader
    namespace: cloud-lab
