site_name: "SWOCTS Cyber Range - Web Application Penetration Testing"
site_description: "Web application penetration testing exercises for SWOCTS Cyber Range"
site_url: ""
docs_dir: Workbook
site_dir: _site_webpt
copyright: 'SWOCTS Cyber Range | Powered by <a class="ocr-powered" href="https://github.com/RobChaykoski/opencyberrange">OpenCyberRange</a>'

theme:
  name: material
  logo: assets/swocts-cyber-range-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: red
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: red
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/embed-mode.js?v=1
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - javascripts/html2pdf.bundle.min.js?v=1

nav:
  - Home: index.md
  - "Curriculum map": CURRICULUM.md
  - Terminology: TERMINOLOGY.md
  - Frameworks: FRAMEWORKS.md
  - "WEB01: Web Reconnaissance":
    - Introduction: CH_WEB01_Web_Reconnaissance/00_Introduction.md
    - "Exercise W1.1 -- Web Target and Scope Preflight": CH_WEB01_Web_Reconnaissance/01_Web_Target_and_Scope_Preflight.md
    - "Exercise W1.2 -- HTTP Request and Response Orientation": CH_WEB01_Web_Reconnaissance/02_HTTP_Request_and_Response_Orientation.md
    - "Exercise W1.3 -- Browser Developer Tools Observation": CH_WEB01_Web_Reconnaissance/03_Browser_Developer_Tools_Observation.md
    - "Exercise W1.4 -- Technology Fingerprinting": CH_WEB01_Web_Reconnaissance/04_Technology_Fingerprinting.md
    - "Exercise W1.5 -- Content, Directory, and File Discovery": CH_WEB01_Web_Reconnaissance/05_Content_Directory_and_File_Discovery.md
    - "Exercise W1.6 -- Virtual Host and Subdomain Discovery": CH_WEB01_Web_Reconnaissance/06_Virtual_Host_and_Subdomain_Discovery.md
    - "Exercise W1.7 -- Robots, Sitemaps, JavaScript, and Metadata": CH_WEB01_Web_Reconnaissance/07_Robots_Sitemaps_JavaScript_and_Metadata.md
    - "Exercise W1.8 -- Forms, Parameters, APIs, and Session Observation": CH_WEB01_Web_Reconnaissance/08_Forms_Parameters_APIs_and_Session_Observation.md
