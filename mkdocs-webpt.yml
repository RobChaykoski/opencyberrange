    - "Exercise W1.11 -- Comprehensive Web Reconnaissance": CH_WEB01_Web_Reconnaissance/11_Comprehensive_Web_Reconnaissance.md
    - Chapter Review: CH_WEB01_Web_Reconnaissance/12_Chapter_Review.md
  - "WEB02: SQL Injection and Web Exploitation":
