schema_version: 1
last_reviewed: "2026-11-11"
notes: >
  This file is the single source of truth for the learner-facing curriculum.
  Directory names are stable identifiers; display IDs are the labels shown in
  chapter titles, navigation, curriculum maps, prerequisite blocks, PDFs,
  progress analytics, and assessment reports. Do not rename a directory to
  change its display ID.

