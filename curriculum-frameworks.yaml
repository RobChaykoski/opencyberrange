lab_overrides:
  # Selective additions where the governing framework is more specific than the
  # chapter default. Keep this list short and justified.
  ai-1-3-indirect-prompt-injection:
    framework_refs: [NIST_AI_RMF, MITRE_ATLAS]
  software-security-1-1-hidden-export-route:
    framework_refs: [NIST_SSDF, CWE]
  software-security-2-1-diagnostics-command-injection:
    framework_refs: [NIST_SSDF, CWE]
  # Beginner-stage labs cross several chapter themes. Keep the primary
  # competency specific to the exercise rather than the whole stage.
  high-school-9-3-cyberchef-base64-basics: {primary_competency: digital_safety, framework_refs: [NICE, NIST_CSF]}
  high-school-9-4-cyberchef-caesar-shift: {primary_competency: digital_safety, framework_refs: [NICE, NIST_CSF]}
  high-school-9-5-cyberchef-layered-message: {primary_competency: digital_safety, framework_refs: [NICE, NIST_CSF]}
  high-school-9-6-read-the-link: {primary_competency: digital_safety, framework_refs: [NICE, NIST_CSF]}
  high-school-9-7-know-the-file: {primary_competency: digital_safety, framework_refs: [NICE, NIST_CSF]}
  high-school-9-8-forwarded-message: {primary_competency: digital_safety, framework_refs: [NICE, NIST_CSF]}
  high-school-10-1-rangebox-network-basics: {primary_competency: network_systems, framework_refs: [NICE, NIST_CSF]}
