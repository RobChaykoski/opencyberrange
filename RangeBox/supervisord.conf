; RangeBox Supervisor Configuration
; Alternative to entrypoint.sh for production deployments.
; Provides automatic restart of crashed processes and structured logging.
;
; Usage: Replace ENTRYPOINT in Dockerfile with:
;   ENTRYPOINT ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/rangebox.conf"]

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvnc]
command=Xvnc :1 -geometry %(ENV_RESOLUTION)s -depth 24 -SecurityTypes None -DisableBasicAuth -websocketPort 6080 -sslOnly 0 -interface 0.0.0.0 -AlwaysShared -httpd /usr/share/kasmvnc/www
environment=RESOLUTION="1280x800",HOME="/home/kali"
user=kali
autorestart=true
priority=100
startsecs=3

[program:xfce4]
command=bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.5; done; exec startxfce4"
environment=DISPLAY=":1",HOME="/home/kali"
user=kali
autorestart=true
priority=200
startsecs=3
