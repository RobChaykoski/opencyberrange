site_name: "SWOCTS Cyber Range - High School Cybersecurity"
site_description: "A browser-first cybersecurity pathway for grades 9-12 in the SWOCTS Cyber Range"
site_url: ""
docs_dir: Workbook
site_dir: _site_highschool
copyright: 'SWOCTS Cyber Range | Powered by <a class="ocr-powered" href="https://github.com/RobChaykoski/opencyberrange">OpenCyberRange</a>'

theme:
  name: material
  logo: assets/swocts-cyber-range-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js

nav:
  - Home: index.md
  - "CH HS09 -- Grade 9 RangeBox Basics":
    - Introduction: CH_HS09_Grade_9_RangeBox_Basics/00_Introduction.md
    - "Signing In and Opening RangeBox": CH_HS09_Grade_9_RangeBox_Basics/01_First_Steps.md
    - "File Hunt": CH_HS09_Grade_9_RangeBox_Basics/02_File_Hunt.md
    - "CyberChef: Base64": CH_HS09_Grade_9_RangeBox_Basics/03_CyberChef_Base64.md
    - "CyberChef: Caesar Shift": CH_HS09_Grade_9_RangeBox_Basics/04_CyberChef_Caesar.md
    - "CyberChef: Two Layers": CH_HS09_Grade_9_RangeBox_Basics/05_CyberChef_Layers.md
    - "Read the Link": CH_HS09_Grade_9_RangeBox_Basics/06_Read_The_Link.md
    - "Know the File": CH_HS09_Grade_9_RangeBox_Basics/07_Know_The_File.md
    - "Capstone: Forwarded Message": CH_HS09_Grade_9_RangeBox_Basics/08_Forwarded_Message.md
  - "CH HS10 -- Grade 10 RangeBox Basics":
    - Introduction: CH_HS10_Grade_10_RangeBox_Basics/00_Introduction.md
    - "Network Basics": CH_HS10_Grade_10_RangeBox_Basics/01_Network_Basics.md
    - "Browser and Source": CH_HS10_Grade_10_RangeBox_Basics/02_Browser_and_Source.md
    - "Dissect an Email": CH_HS10_Grade_10_RangeBox_Basics/03_Email_Metadata.md
    - "MFA and the Lost Phone": CH_HS10_Grade_10_RangeBox_Basics/04_MFA_Lost_Phone.md
  - "CH HS11 -- Grade 11 Defensive Security":
    - Introduction: CH_HS11_Grade_11_Defensive_Security/00_Introduction.md
    - "Log Detective": CH_HS11_Grade_11_Defensive_Security/01_Log_Detective.md
    - "Media Provenance": CH_HS11_Grade_11_Defensive_Security/02_Media_Provenance.md
    - "Chapter Review": CH_HS11_Grade_11_Defensive_Security/03_Chapter_Review.md
  - "CH HS12 -- Grade 12 Applied Cybersecurity":
    - Introduction: CH_HS12_Grade_12_Applied_Cybersecurity/00_Introduction.md
    - "DevFest Community Portal": CH_HS12_Grade_12_Applied_Cybersecurity/01_DevFest_Community_Portal.md
    - "Crypto Rug Pull": CH_HS12_Grade_12_Applied_Cybersecurity/02_Crypto_Rug_Pull.md
    - Chapter Review: CH_HS12_Grade_12_Applied_Cybersecurity/03_Chapter_Review.md
  - "Free training and certifications": FREE-TRAINING-AND-CERTIFICATIONS.md
