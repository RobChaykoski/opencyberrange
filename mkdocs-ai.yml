site_name: "SWOCTS Cyber Range - AI Hacking"
site_description: "AI security and prompt-injection exercises for SWOCTS Cyber Range"
site_url: ""
docs_dir: Workbook
site_dir: _site_ai
copyright: 'SWOCTS Cyber Range | Powered by <a class="ocr-powered" href="https://github.com/RobChaykoski/opencyberrange">OpenCyberRange</a>'

theme:
  name: material
  logo: assets/swocts-cyber-range-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: pink
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: pink
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js

nav:
  - Home: index.md
  - "Curriculum map": CURRICULUM.md
  - Terminology: TERMINOLOGY.md
  - Frameworks: FRAMEWORKS.md
  - "AI01: AI Security Foundations":
    - Introduction: CH_AI01_AI_Foundations/00_Introduction.md
    - "Exercise 1.1 -- Prompt Injection Basics": CH_AI01_AI_Foundations/01_Prompt_Injection_Basics.md
    - "Exercise 1.2 -- Jailbreak Policy Bypass": CH_AI01_AI_Foundations/02_Jailbreak_Policy_Bypass.md
    - "Exercise 1.3 -- Indirect Prompt Injection": CH_AI01_AI_Foundations/03_Indirect_Prompt_Injection.md
    - Chapter Review: CH_AI01_AI_Foundations/04_Chapter_Review.md
  - "Free training and certifications": FREE-TRAINING-AND-CERTIFICATIONS.md
